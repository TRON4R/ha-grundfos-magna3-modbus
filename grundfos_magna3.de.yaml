# ==============================================================================
# GRUNDFOS MAGNA3 - Home Assistant Modbus TCP Integration
# ==============================================================================
# Version:       v4.3.3 (2026-09-02)
# CIM 500 Modbus TCP Konfiguration
# Dokumentation: Grundfos 98367081 05.2025
# Repo:          https://github.com/TRON4R/ha-grundfos-magna3-modbus
# Changelog:     https://github.com/TRON4R/ha-grundfos-magna3-modbus/blob/main/CHANGELOG.de.md
#
# YAML erstellt in 2025 von TRON4R zur Anbindung der MAGNA3 in Home Assistant
#
# INSTALLATION:
# 1. Diese Datei nach /config/packages/grundfos-magna3.yaml kopieren
# 2. In configuration.yaml einfügen:
#    homeassistant:
#      packages: !include_dir_named packages
# 3. IP-Adresse im modbus:-Block unten anpassen (Schlüssel "host:")
# 4. Home Assistant neu starten
# ==============================================================================

modbus:
  - name: Grundfos_MAGNA3
    type: tcp
    host: 192.168.2.7  # ← ANPASSEN: IP-Adresse Deines CIM 500
    port: 502

    # ==========================================================================
    # SENSORS - Messwerte (nach Register-Adresse sortiert)
    # ==========================================================================
    sensors:

    # --- Register 00031-00037: Softwareversionsstand und -Datum - noch später manuell hinzugefügt (RO) --- 
      - name: "MAGNA3 Software Version HI (Raw)"
        unique_id: magna3_r00034_sw_version_hi
        address: 33  # Register 00034
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 86400  # 1x pro Tag reicht

      - name: "MAGNA3 Software Version LO (Raw)"
        unique_id: magna3_r00035_sw_version_lo
        address: 34  # Register 00035
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 86400

      - name: "MAGNA3 Software Datum DayMonth (Raw)"
        unique_id: magna3_r00036_sw_date_dm
        address: 35  # Register 00036
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 86400

      - name: "MAGNA3 Software Datum Year (Raw)"
        unique_id: magna3_r00037_sw_date_year
        address: 36  # Register 00037
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 86400
    
    # --- Register 00101-00106: Pump Control (nur Anzeige / alle Register in dem Block 00101 bis 00112 sind aber grundsätzlich RW!) ---
      
      - name: "MAGNA3 Control Register (00101 Raw)"
        unique_id: magna3_r00101_control_register_raw
        address: 100  # Register 00101
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
        # device_class: (weggelassen)  # Bitfeld
        # state_class: (weggelassen)   # Bitfeld
      
      - name: "MAGNA3 Control Mode Request (00102)"
        unique_id: magna3_r00102_control_mode_req
        address: 101  # Register 00102
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
        # device_class: (weggelassen)  # Enum/Code
        # state_class: (weggelassen)   # Enum/Code
      
      - name: "MAGNA3 Operation Mode Request (00103)"
        unique_id: magna3_r00103_operation_mode_req
        address: 102  # Register 00103
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
        # device_class: (weggelassen)  # Enum/Code
        # state_class: (weggelassen)   # Enum/Code
      
      - name: "MAGNA3 Sollwert-Anforderung (00104)"
        unique_id: magna3_r00104_setpoint_req
        address: 103  # Register 00104
        input_type: holding
        data_type: uint16
        unit_of_measurement: "%"
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 30
        # device_class: (weggelassen)  # Prozentwerte: keine passende allgemeine device_class
        state_class: measurement
      
      # 00105 ist laut Doku "RelayControl" und gilt nur für "E-pumps and CUE".
      # Bei MAGNA3 ist das in vielen Fällen NICHT nutzbar (liefert oft 0 / nicht vorhanden).
      # Daher mitgeliefert, aber auskommentiert
      # - name: "MAGNA3 Relay Control (00105 Raw)"
      #   unique_id: magna3_r00105_relay_control_raw
      #   address: 104  # Register 00105
      #   input_type: holding
      #   data_type: uint16
      #   slave: 1
      #   scan_interval: 30
      #   # device_class: (weggelassen)  # Bitfeld
      #   # state_class: (weggelassen)   # Bitfeld
      
      - name: "MAGNA3 Max. Volumenstrom-Sollwert (00106)"
        unique_id: magna3_r00106_set_max_flow_limit
        address: 105  # Register 00106
        input_type: holding
        data_type: uint16
        unit_of_measurement: "m³/h"
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 30
        device_class: volume_flow_rate
        state_class: measurement
        
      
      # --- Register 00201-00225: Pump Status --- alle Register sind read-only (RO)
      
      - name: "MAGNA3 Status Bits (Raw)"
        unique_id: magna3_r00201_status_bits
        address: 200  # Register 00201
        input_type: input
        slave: 1
        scan_interval: 30
        # Wird für Template Binary Sensors verwendet
      
      - name: "MAGNA3 Prozess-Rückmeldung"
        unique_id: magna3_r00202_process_feedback
        address: 201  # Register 00202
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        state_class: measurement
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Regelungsart Code"
        unique_id: magna3_r00203_control_mode
        address: 202  # Register 00203
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
        # Wird in Template Sensor als Text dargestellt
      
      - name: "MAGNA3 Betriebsmodus Code"
        unique_id: magna3_r00204_operation_mode
        address: 203  # Register 00204
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Alarm Code"
        unique_id: magna3_r00205_alarm_code
        address: 204  # Register 00205
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Warning Code"
        unique_id: magna3_r00206_warning_code
        address: 205  # Register 00206
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
      
      # --- Register 00207: Bearing service (Bitfeld)
      - name: "MAGNA3 Bearing Service (Raw)"
        unique_id: magna3_r00207_bearing_service_raw
        address: 206  # Register 00207
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 3600
        # device_class: (weggelassen)  # Bitfeld/Status, keine passende HA-Device-Class
        # state_class: (weggelassen)   # kein Messwert im HA-Sinn, Roh-Bitfeld
      
# --- Register 00208: DriveState (Enum)
      - name: "MAGNA3 Drive State Code"
        unique_id: magna3_r00208_drive_state
        address: 207  # Register 00208
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
        # device_class: (weggelassen)  # Status-Code/Enum
        # state_class: (weggelassen)   # Status-Code/Enum
      
      - name: "MAGNA3 Sensor Einheit"
        unique_id: magna3_r00209_sensor_unit
        address: 208  # Register 00209
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 3600
        # 0=bar, 2=m, 6=m³/h, 10=°C
      
      - name: "MAGNA3 Sensor Minimum"
        unique_id: magna3_r00210_sensor_min
        address: 209  # Register 00210
        input_type: input
        data_type: uint16
        # kein device_class angegeben, da hier die Unit davon abhängt, was in Register 209 steht
        # kein state_class: measurement, weil ein Mindestwert
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Sensor Maximum"
        unique_id: magna3_r00211_sensor_max
        address: 210  # Register 00211
        input_type: input
        data_type: uint16
        # kein device_class angegeben, da hier die Unit davon abhängt, was in Register 209 steht
        # kein state_class: measurement, weil ein Maximalwert
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Nenn-Frequenz"
        unique_id: magna3_r00212_nom_frequency
        address: 211  # Register 00212
        input_type: input
        data_type: uint16
        unit_of_measurement: "Hz"
        device_class: frequency
        # state_class: measurement # nicht gesetzt, weil kein statistischer Wert
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Min Frequenz"
        unique_id: magna3_r00213_min_frequency
        address: 212  # Register 00213
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # state_class: measurement # nicht gesetzt, weil weil kein statistischer Wert
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Max Frequenz"
        unique_id: magna3_r00214_max_frequency
        address: 213  # Register 00214
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # state_class: measurement # nicht gesetzt, weil weil kein statistischer Wert
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Sollwertbereich Min"
        unique_id: magna3_r00215_setpoint_range_min
        address: 214  # Register 00215
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # state_class: measurement # nicht gesetzt, weil weil kein statistischer Wert
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Sollwertbereich Max"
        unique_id: magna3_r00216_setpoint_range_max
        address: 215  # Register 00216
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # state_class: measurement # nicht gesetzt, weil weil kein statistischer Wert
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 3600
      
      
      - name: "MAGNA3 Flow Estimation Status"
        unique_id: magna3_r00221_flow_estimation_state
        address: 220  # Register 00221
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 15
        # Kein Device Class, da Status-Code
        # 0: Within range, 1: Below range, 2: Above range

      - name: "MAGNA3 Aktueller Kp (P-Faktor)"
        unique_id: magna3_r00222_kp_actual
        address: 221  # Register 00222
        input_type: input
        data_type: uint16
        # Kein Device Class, da dimensionsloser Faktor
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 60
        # icon: mdi:sine-wave # icons sind bei Sensoren hier unzulässig

      - name: "MAGNA3 Aktuelles Ti (I-Faktor)"
        unique_id: magna3_r00223_ti_actual
        address: 222  # Register 00223
        input_type: input
        data_type: uint16
        unit_of_measurement: "s"     # Wichtig für duration
        device_class: duration
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 60
        # icon: mdi:timer-outline # icons sind bei Sensoren hier unzulässig

      - name: "MAGNA3 Regelrichtung Status"
        unique_id: magna3_r00224_direct_control_actual
        address: 223  # Register 00224
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 60
        # Kein Device Class, da Binär-Status (0/1)
        # 0: Inverse (Standard), 1: Direct

      - name: "MAGNA3 Steuerquelle Code"
        unique_id: magna3_r00225_control_source
        address: 224  # Register 00225
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
        # Werte: 1=Display, 2=Bus, 3=GO App, 4=Digtal Input, 5=Off Button

      #
      # --- Register 00301-00365: Pump Data (Messwerte) --- alle Register sind read-only (RO)
      
      - name: "MAGNA3 Förderhöhe"
        unique_id: magna3_r00301_head
        address: 300  # Register 00301
        input_type: input
        data_type: uint16
        unit_of_measurement: "m"
        device_class: distance
        state_class: measurement
        scale: 0.01  # 0.001 bar × 10.2 ≈ 0.01 m
        precision: 2
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Durchfluss"
        unique_id: magna3_r00302_volume_flow
        address: 301  # Register 00302
        input_type: input
        data_type: uint16
        unit_of_measurement: "m³/h"
        device_class: volume_flow_rate # added, weil HA inzwischen Volume flows unterstützt
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 15
        # icon: mdi:water-pump # icons sind bei Sensoren hier unzulässig
      
      - name: "MAGNA3 Relative Leistung"
        unique_id: magna3_r00303_relative_performance
        address: 302  # Register 00303
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # hier keine device_class einfügen, da HA bei Prozentwerten nur battery, humidity oder power_factor kennt
        state_class: measurement
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Drehzahl"
        unique_id: magna3_r00304_speed
        address: 303  # Register 00304
        input_type: input
        data_type: uint16
        unit_of_measurement: "rpm"
        # device_class: frequency # frequency ist falsch hier. HA hat bisher keine device_class für RPM also lieber keine als eine falsche 
        state_class: measurement
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Frequenz"
        unique_id: magna3_r00305_frequency
        address: 304  # Register 00305
        input_type: input
        data_type: uint16
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Digitale Eingänge"
        unique_id: magna3_r00306_digital_input
        address: 305  # Register 00306
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 60
        # Bitfeld: DI1-DI3
      
      - name: "MAGNA3 Digitale Ausgänge"
        unique_id: magna3_r00307_digital_output
        address: 306  # Register 00307
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 60
        # Bitfeld: DO1-DO2
      
      - name: "MAGNA3 Sollwert (Aktuell)"
        unique_id: magna3_r00308_actual_setpoint
        address: 307  # Register 00308
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        state_class: measurement
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 15
        # icon: mdi:speedometer # icons sind bei Sensoren hier unzulässig
      
      - name: "MAGNA3 Motorstrom"
        unique_id: magna3_r00309_motor_current
        address: 308  # Register 00309
        input_type: input
        data_type: uint16
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 DC-Link Spannung"
        unique_id: magna3_r00310_dc_link_voltage
        address: 309  # Register 00310
        input_type: input
        data_type: uint16
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Leistungsaufnahme"
        unique_id: magna3_r00312_power
        address: 311  # Register 00312-00313 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Elektronik-Temperatur"
        unique_id: magna3_r00321_electronic_temp
        address: 320  # Register 00321
        input_type: input
        data_type: uint16
        unit_of_measurement: "K"  # Grundfos liefert Kelvin-Rohwerte; HA konvertiert automatisch in °C/°F via device_class
        device_class: temperature
        state_class: measurement
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Medientemperatur"
        unique_id: magna3_r00322_pump_liquid_temp
        address: 321  # Register 00322
        input_type: input
        data_type: uint16
        unit_of_measurement: "K"  # Grundfos liefert Kelvin-Rohwerte; HA konvertiert automatisch in °C/°F via device_class
        device_class: temperature
        state_class: measurement
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Spez. Energieverbrauch"
        unique_id: magna3_r00326_specific_energy
        address: 325  # Register 00326
        input_type: input
        data_type: uint16
        unit_of_measurement: "Wh/m³"
        state_class: measurement
        slave: 1
        scan_interval: 300
      
      - name: "MAGNA3 Betriebsstunden (Laufend)"
        unique_id: magna3_r00327_operation_time
        address: 326  # Register 00327-00328 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "h"
        # device_class: duration # nicht kompatibel mit state_class: total_increasing laut HA-Doku
        state_class: total_increasing
        slave: 1
        scan_interval: 300

      - name: "MAGNA3 Betriebsstunden (Gesamt)"
        unique_id: magna3_r00329_total_powered_time
        address: 328  # Register 00329-00330 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "h"
        # device_class: duration # nicht kompatibel mit state_class: total_increasing laut HA-Doku
        state_class: total_increasing
        slave: 1
        scan_interval: 300
      
      - name: "MAGNA3 Energieverbrauch"
        unique_id: magna3_r00332_energy
        address: 331  # Register 00332-00333 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        slave: 1
        scan_interval: 300
      
      - name: "MAGNA3 Anzahl Starts"
        unique_id: magna3_r00334_number_of_starts
        address: 333  # Register 00334-00335 (32-bit)
        input_type: input
        data_type: uint32
        state_class: total_increasing
        slave: 1
        scan_interval: 300
      
      - name: "MAGNA3 Sollwert (Benutzer)"
        unique_id: magna3_r00338_user_setpoint
        address: 337  # Register 00338
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        state_class: measurement
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 15
        # icon: mdi:speedometer # icons sind bei Sensoren hier unzulässig
      
      - name: "MAGNA3 Differenzdruck"
        unique_id: magna3_r00339_diff_pressure
        address: 338  # Register 00339
        input_type: input
        data_type: uint16
        unit_of_measurement: "bar"
        device_class: pressure
        state_class: measurement
        scale: 0.001
        precision: 3
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Uhrzeit (Unix)"
        unique_id: magna3_r00343_pump_rtc
        address: 342  # Register 00343-00344 (32-bit)
        input_type: input
        data_type: uint32
        # device_class: timestamp # hat nicht funktioniert weil HA das Zeitformat nicht versteht
        slave: 1
        scan_interval: 300
      
      - name: "MAGNA3 Max Durchflusslimit"
        unique_id: magna3_r00345_max_flow_limit
        address: 344  # Register 00345
        input_type: input
        data_type: uint16
        unit_of_measurement: "m³/h"
        state_class: measurement
        device_class: volume_flow_rate
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 60
      
      # Optional: Mit externem Temperatursensor
      # - name: "MAGNA3 Wärmeenergie"
      #   unique_id: magna3_r00352_heat_energy
      #   address: 351  # Register 00352-00353 (32-bit)
      #   input_type: input
      #   data_type: uint32
      #   unit_of_measurement: "kWh"
      #   device_class: energy
      #   state_class: total_increasing
      #   slave: 1
      #   scan_interval: 300
      
      # - name: "MAGNA3 Wärmeleistung"
      #   unique_id: magna3_r00354_heat_power
      #   address: 353  # Register 00354-00355 (32-bit)
      #   input_type: input
      #   data_type: uint32
      #   unit_of_measurement: "W"
      #   device_class: power
      #   state_class: measurement
      #   slave: 1
      #   scan_interval: 60
      
      # - name: "MAGNA3 Temperaturdifferenz"
      #   unique_id: magna3_r00356_heat_diff_temp
      #   address: 355  # Register 00356
      #   input_type: input
      #   data_type: uint16
      #   unit_of_measurement: "K"
      #   device_class: temperature
      #   state_class: measurement
      #   scale: 0.01
      #   precision: 2
      #   slave: 1
      #   scan_interval: 60
      
      - name: "MAGNA3 Gepumptes Volumen"
        unique_id: magna3_r00357_volume1
        address: 356  # Register 00357-00358 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "m³"
        device_class: volume
        state_class: total_increasing
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 300
        
      - name: "MAGNA3 Gepumptes Volumen (Richtung 2)" # selbst hinzugefügt
        unique_id: magna3_r00361_volume2
        address: 360  # Register 00361-00362 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "m³"
        device_class: volume
        state_class: total_increasing
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 300
      
      # --- Optional: Mit externem Drucksensor ---
      # - name: "MAGNA3 Remote Druck 1"
      #   unique_id: magna3_r00316_remote_pressure1
      #   address: 315  # Register 00316
      #   input_type: input
      #   data_type: uint16
      #   unit_of_measurement: "bar"
      #   device_class: pressure
      #   state_class: measurement
      #   scale: 0.001
      #   precision: 3
      #   slave: 1
      #   scan_interval: 30
    
      # --- Optional: Mit externem Temperatursensor ---
      # - name: "MAGNA3 Remote Temperatur 1"
      #   unique_id: magna3_r00320_remote_temp1
      #   address: 319  # Register 00320
      #   input_type: input
      #   data_type: uint16
      #   unit_of_measurement: "°C"
      #   device_class: temperature
      #   state_class: measurement
      #   scale: 0.01
      #   precision: 1
      #   slave: 1
      #   scan_interval: 60
    


# ==============================================================================
# TEMPLATE BINARY SENSORS - Status-Bits dekodieren
# ==============================================================================
# Die Modbus-Integration kann nicht einzelne Bits auslesen,
# daher über Template Binary Sensors mit Bit-Masken
template:
  - binary_sensor: # für Register 00201
      # Bit 0: LowFlowStop
      - name: "MAGNA3 Low Flow Stop"
        unique_id: magna3_status_low_flow_stop
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(1) > 0 }}
        device_class: running
        icon: mdi:water-off
      
      # Bit 1: CopyToLocal
      - name: "MAGNA3 Copy to Local"
        unique_id: magna3_status_copy_to_local
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(2) > 0 }}
        icon: mdi:content-copy
      
      # Bit 2: MaxFlowLimit Enabled
      - name: "MAGNA3 FlowLimit Aktiv"
        unique_id: magna3_status_flowlimit_enabled
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(4) > 0 }}
        icon: mdi:water-check
      
      # Bit 6: Rotation (Pumpe läuft)
      - name: "MAGNA3 Läuft"
        unique_id: magna3_status_rotation
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(64) > 0 }}
        device_class: running
        icon: mdi:pump
      
      # Bit 8: AccessMode (Remote/Local)
      - name: "MAGNA3 Remote Modus"
        unique_id: magna3_status_remote_mode
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(256) > 0 }}
        device_class: connectivity
        icon: mdi:lan-connect
      
      # Bit 9: OnOff
      - name: "MAGNA3 Eingeschaltet"
        unique_id: magna3_status_on_off
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(512) > 0 }}
        device_class: power
        icon: mdi:power
      
      # Bit 10: Alarm
      - name: "MAGNA3 Alarm"
        unique_id: magna3_status_alarm
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(1024) > 0 }}
        device_class: problem
        icon: mdi:alert-circle
      
      # Bit 11: Warning
      - name: "MAGNA3 Warnung"
        unique_id: magna3_status_warning
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(2048) > 0 }}
        device_class: problem
        icon: mdi:alert
      
      # Bit 12: ForcedToLocal - zeigt ob Fernsteuerung ausgeschaltet und lokaler Handbetrieb eingeschaltet ist
      - name: "MAGNA3 Zwang auf Handbetrieb"
        unique_id: magna3_status_forced_to_local
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(4096) > 0 }}
        device_class: problem
        icon: mdi:hand-back-left
      
      # Bit 13: AtMaxSpeed
      - name: "MAGNA3 Max Drehzahl"
        unique_id: magna3_status_at_max_speed
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(8192) > 0 }}
        icon: mdi:speedometer
      
      # Bit 15: AtMinSpeed
      - name: "MAGNA3 Min Drehzahl"
        unique_id: magna3_status_at_min_speed
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(32768) > 0 }}
        icon: mdi:speedometer

  # ==========================================================================
  # TEMPLATE SENSORS - Berechnete Werte und Textausgaben
  # ==========================================================================

  - sensor:
      # errechnet Softwareversion und -datum aus den BCD-Werten in den Registern 00034 bis 00037
      - name: "MAGNA3 Software Version" 
        unique_id: magna3_software_version
        state: >
          {% set hi = states('sensor.magna3_software_version_hi_raw') | int(0) %}
          {% set lo = states('sensor.magna3_software_version_lo_raw') | int(0) %}
          {% set dm = states('sensor.magna3_software_datum_daymonth_raw') | int(0) %}
          {% set yr = states('sensor.magna3_software_datum_year_raw') | int(0) %}
          {% set a = (hi // 4096) | bitwise_and(0x0F) %}
          {% set b = (hi // 256) | bitwise_and(0x0F) %}
          {% set c = (hi // 16) | bitwise_and(0x0F) %}
          {% set d = hi | bitwise_and(0x0F) %}
          {% set e = (lo // 4096) | bitwise_and(0x0F) %}
          {% set f = (lo // 256) | bitwise_and(0x0F) %}
          {% set g = (lo // 16) | bitwise_and(0x0F) %}
          {% set h = lo | bitwise_and(0x0F) %}
          {% set day1 = (dm // 4096) | bitwise_and(0x0F) %}
          {% set day2 = (dm // 256) | bitwise_and(0x0F) %}
          {% set mon1 = (dm // 16) | bitwise_and(0x0F) %}
          {% set mon2 = dm | bitwise_and(0x0F) %}
          {% set y1 = (yr // 4096) | bitwise_and(0x0F) %}
          {% set y2 = (yr // 256) | bitwise_and(0x0F) %}
          {% set y3 = (yr // 16) | bitwise_and(0x0F) %}
          {% set y4 = yr | bitwise_and(0x0F) %}
          {{ a }}{{ b }}.{{ c }}{{ d }}.{{ e }}{{ f }}.{{ g }}{{ h }} ({{ day1 }}{{ day2 }}.{{ mon1 }}{{ mon2 }}.{{ y1 }}{{ y2 }}{{ y3 }}{{ y4 }})
        icon: mdi:information-outline
  
      # Regelungsart als Text
      - name: "MAGNA3 Regelungsart"
        unique_id: magna3_control_mode_text
        state: >
          {% set mode = states('sensor.magna3_regelungsart_code') | int(0) %}
          {% if mode == 0 %}Konstante Drehzahl
          {% elif mode == 1 %}Konstante Frequenz
          {% elif mode == 3 %}Konstante Förderhöhe
          {% elif mode == 4 %}Konstantdruck
          {% elif mode == 5 %}Konstanter Differenzdruck
          {% elif mode == 6 %}Proportionaldruck
          {% elif mode == 7 %}Konstanter Volumenstrom
          {% elif mode == 8 %}Konstante Temperatur
          {% elif mode == 10 %}Konstanter Füllstand
          {% elif mode == 128 %}AUTOADAPT
          {% elif mode == 129 %}FLOWADAPT
          {% elif mode == 130 %}Regelung mit externem Sensor
          {% elif mode == 131 %}AUTOADAPT(CP)
          {% else %}Unbekannt ({{ mode }})
          {% endif %}
        icon: mdi:tune
      
      # Betriebsmodus als Text
      - name: "MAGNA3 Betriebsmodus"
        unique_id: magna3_operation_mode_text
        state: >
          {% set mode = states('sensor.magna3_betriebsmodus_code') | int(0) %}
          {% if mode == 0 %}Auto-Regelung
          {% elif mode == 4 %}Mindestkennlinie
          {% elif mode == 6 %}Maximumkennlinie
          {% else %}Unbekannt ({{ mode }})
          {% endif %}
        icon: mdi:cog-outline
      
      # Alarm-Code als Text (häufigste Codes)
      - name: "MAGNA3 Alarm Text"
        unique_id: magna3_alarm_text
        state: >
          {% set code = states('sensor.magna3_alarm_code') | int(0) %}
          {% if code == 0 %}Kein Alarm
          {% elif code == 1 %}Leakage Current
          {% elif code == 2 %}Missing Phase
          {% elif code == 3 %}External Fault
          {% elif code == 4 %}Too Many Restarts
          {% elif code == 32 %}Overvoltage
          {% elif code == 40 %}Undervoltage
          {% elif code == 48 %}Overload
          {% elif code == 49 %}Overcurrent
          {% elif code == 51 %}Blocked Motor
          {% elif code == 57 %}Dry Running
          {% elif code == 64 %}Overtemperature
          {% elif code == 88 %}Sensor Fault
          {% else %}Code {{ code }}
          {% endif %}
        icon: mdi:alert-circle-outline
      
      # Energiekosten (anpassbar)
      - name: "MAGNA3 Energiekosten"
        unique_id: magna3_energy_cost
        unit_of_measurement: "EUR"
        device_class: monetary
        state_class: total
        state: >
          {{ (states('sensor.magna3_energieverbrauch') | float(0) * 0.30) | round(2) }}
        # ↑ Strompreis anpassen!
      
      # Effizienz berechnen
      - name: "MAGNA3 Effizienz"
        unique_id: magna3_efficiency
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set p_elec = states('sensor.magna3_leistungsaufnahme') | float(0) %}
          {% set flow = states('sensor.magna3_durchfluss') | float(0) %}
          {% set head = states('sensor.magna3_forderhohe') | float(0) %}
          {% if p_elec > 0 %}
            {% set p_hydr = (flow * head * 2.725) %}
            {{ ((p_hydr / p_elec) * 100) | round(1) }}
          {% else %}0{% endif %}
        icon: mdi:percent
      
      # Sollwert in Meter umrechnen (Formel verifiziert am 11.02.2026)
      - name: "MAGNA3 Sollwert (Meter)"
        unique_id: magna3_setpoint_meter
        unit_of_measurement: "m"
        device_class: distance
        state_class: measurement
        # Quellen sind Modbus-Register, die zeitweise aussetzen koennen.
        # Bei fehlenden Quellen wird der Sensor regulaer "unavailable"
        # statt im state den Text "unavailable" zu rendern (= ungueltig
        # fuer einen numerischen Sensor -> wurde sonst zu "unknown").
        availability: >
          {% set sp = states('sensor.magna3_sollwert_benutzer') | float(-1) %}
          {% set s_max = states('sensor.magna3_sensor_maximum') | float(0) %}
          {% set r_min_pct = states('sensor.magna3_sollwertbereich_min') | float(0) %}
          {% set r_max_pct = states('sensor.magna3_sollwertbereich_max') | float(0) %}
          {{ sp >= 0 and s_max > 0 and r_max_pct > r_min_pct }}
        state: >
          {% set sp = states('sensor.magna3_sollwert_benutzer') | float(0) %}
          {% set s_max = states('sensor.magna3_sensor_maximum') | float(0) %}
          {% set r_min_pct = states('sensor.magna3_sollwertbereich_min') | float(0) %}
          {% set r_max_pct = states('sensor.magna3_sollwertbereich_max') | float(0) %}
          {% set rmin = (r_min_pct / 100) * s_max %}
          {% set rmax = (r_max_pct / 100) * s_max %}
          {{ ((sp / 100) * (rmax - rmin) + rmin) | round(2) }}
        icon: mdi:ruler
      
      - name: "MAGNA3 Uhrzeit"
        unique_id: magna3_pump_rtc_formatted
        device_class: timestamp
        state: >
          {{ states('sensor.magna3_uhrzeit_unix') | int(0) | as_datetime }}


      - name: "MAGNA3 Durchfluss-Status Text"
        unique_id: magna3_flow_estimation_text
        state: >
          {% set status = states('sensor.magna3_flow_estimation_status') | int(0) %}
          {% if status == 0 %}innerhalb des Messbereichs
          {% elif status == 1 %}unterhalb des Messbereichs
          {% elif status == 2 %}oberhalb des Messbereichs
          {% else %}Unbekannt ({{ status }})
          {% endif %}
        icon: mdi:chart-bell-curve

        # Steuerquelle als Text
      - name: "MAGNA3 Steuerquelle"
        unique_id: magna3_control_source_text
        state: >
          {% set source = states('sensor.magna3_steuerquelle_code') | int(0) %}
          {% if source == 1 %}Pumpendisplay
          {% elif source == 2 %}Home Assistant via Modbus/TCP
          {% elif source == 3 %}Grundfos GO App
          {% elif source == 4 %}Digital Input
          {% elif source == 5 %}OFF Taste
          {% else %}Unbekannt ({{ source }})
          {% endif %}
        icon: >
          {% set source = states('sensor.magna3_steuerquelle_code') | int(0) %}
          {% if source == 1 %}mdi:monitor
          {% elif source == 2 %}mdi:ethernet
          {% elif source == 3 %}mdi:cellphone-wireless
          {% elif source == 4 %}mdi:electric-switch
          {% elif source == 5 %}mdi:power-off
          {% else %}mdi:help-circle
          {% endif %}


      - name: "MAGNA3 Months To Bearing Service"
        unique_id: magna3_months_to_bearing_service
        unit_of_measurement: "mon"
        state_class: measurement
        # device_class: (weggelassen)  # HA hat keine duration-Device-Class für "Monate"
        availability: >
          {{ (states('sensor.magna3_bearing_service_raw') | int(0)) | bitwise_and(0xFF) != 255 }}
        state: >
          {{ (states('sensor.magna3_bearing_service_raw') | int(0)) | bitwise_and(0xFF) }}

      - name: "MAGNA3 Bearing Service Type"
        unique_id: magna3_bearing_service_type
        state: >
          {% set v = states('sensor.magna3_bearing_service_raw') | int(0) %}
          {% set t = (v // 256) | bitwise_and(0x01) %}
          {{ 'Lubricate bearings' if t == 0 else 'Change bearings' }}
        # device_class: (weggelassen)  # Textstatus
        # state_class: (weggelassen)   # Textstatus

      - name: "MAGNA3 Drive State"
        unique_id: magna3_drive_state_text
        state: >
          {% set s = states('sensor.magna3_drive_state_code') | int(-1) %}
          {% if s == 0 %}Stopped
          {% elif s == 1 %}Accelerating
          {% elif s == 2 %}Decelerating
          {% elif s == 3 %}Steady state / closed loop
          {% elif s == 5 %}Accelerating halt
          {% elif s == 6 %}Decelerating halt
          {% elif s == 7 %}Start on the run (flying cut-in)
          {% else %}Code {{ s }}
          {% endif %}
        # device_class: (weggelassen)  # Textstatus
        # state_class: (weggelassen)   # Textstatus


      # --- Durchfluss Sensor zeigt nativ m³/h an statt L/h. Z.B. die Lambda WP aber L/h ---
      # --- Dieser Template-Sensor spiegelt den Original-Modbus-Sensor in L/h zur besseren Vergleichbarkeit in Kurven ---
      - name: "MAGNA3 Durchfluss L/h"
        unique_id: magna3_durchfluss_lh
        unit_of_measurement: "L/h"
        state: "{{ (states('sensor.magna3_durchfluss') | float(0) * 1000) | round(0) }}"
        device_class: volume_flow_rate
        state_class: measurement

# ==============================================================================
# INPUT NUMBERS - UI-Steuerung
# ==============================================================================
input_number:
  magna3_sollwert_prozent:
    name: "MAGNA3 Sollwert (%)"
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: "%"
    icon: mdi:percent
    mode: slider # alternativ auch box möglich
  
  magna3_sollwert_meter:
    name: "MAGNA3 Sollwert (m)"
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: "m"
    icon: mdi:ruler
    mode: slider # alternativ auch box möglich
  
  magna3_regelungsart:
    name: "MAGNA3 Regelungsart (Code)"
    min: 0
    max: 131
    step: 1
    icon: mdi:cog
    mode: box
  
  # --- Optional: FLOWLIMIT setzen (Register 00106) ---
  # ACHTUNG: Nur aktivieren wenn FLOWADAPT oder EnableMaxFlowLimit verwendet wird!
  # magna3_max_flow_limit:
  #   name: "MAGNA3 Max Durchflusslimit"
  #   min: 0
  #   max: 90  # 0-90% von Qmax oder 0-9.0 m³/h (je nach Pumpe)
  #   step: 0.1
  #   unit_of_measurement: "m³/h"
  #   # kein state_class: measurement weil ein Sollwert und keine Statistik
  #   icon: mdi:water-check
  #   mode: slider
  
  # ============================================================================
  # WARNUNG: PID-PARAMETER - NUR FÜR EXPERTEN!
  # ============================================================================
  # Die folgenden Register (00110-00112) steuern den PID-Regler der Pumpe.
  # Grundfos hat diese Werte werkseitig optimal eingestellt!
  # 
  # RISIKEN beim Verstellen:
  # - Instabile Regelung (Pumpe taktet, schwingt)
  # - Mechanische Belastung, Motor-Überlastung
  # - Bei falscher Regelrichtung (00112): KATASTROPHALE Fehlfunktion!
  # - Keine Sollwert-Erreichung
  # - Schwer rückgängig zu machen
  # 
  # NUR AKTIVIEREN wenn:
  # - Von Grundfos-Support explizit empfohlen
  # - Hydraulik massiv verändert wurde
  # - Unter Beobachtung mit Messgeräten!
  # ============================================================================
  
  # --- PID-Parameter (NUR für Experten, auskommentiert!) ---
  # magna3_pid_kp:
  #   name: "MAGNA3 Kp (P-Verstärkung)"
  #   min: 0
  #   max: 10.0
  #   step: 0.1
  #   icon: mdi:sine-wave
  #   mode: box
  #   # Register 00110, Skalierung 0.1
  #   # Default: Pumpen-spezifisch (z.B. 1.5)
  #   # Zu hoch → Überschwingen, Schwingen
  #   # Zu niedrig → Träge Regelung
  
  # magna3_pid_ti:
  #   name: "MAGNA3 Ti (Integralzeit)"
  #   min: 0
  #   max: 100.0
  #   step: 0.1
  #   unit_of_measurement: "s"
  #   icon: mdi:timer-outline
  #   mode: box
  #   # Register 00111, Skalierung 0.1 s
  #   # Default: 10-30s (pumpen-spezifisch)
  #   # Zu klein → Schnelles Aufintegrieren, Überschwingen
  #   # Zu groß → Langsame Ausregelung
  
  # magna3_pid_direct:
  #   name: "MAGNA3 Regelrichtung"
  #   min: 0
  #   max: 1
  #   step: 1
  #   icon: mdi:swap-vertical
  #   mode: box
  #   # Register 00112
  #   # 0 = Invers (Standard): Sensor↑ → Pumpe↓
  #   # 1 = Direkt: Sensor↑ → Pumpe↑
  #   # ACHTUNG: Falsch eingestellt = Pumpe regelt verkehrt herum!

# ==============================================================================
# SCRIPTS - Pumpensteuerung
# ==============================================================================
script:
  # Sollwert in % setzen
  magna3_set_sollwert_prozent:
    alias: "MAGNA3: Sollwert (%) setzen"
    fields:
      prozent:
        description: "Sollwert in Prozent (0-100)"
        example: "45.5"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 103  # Register 00104
          slave: 1
          value: >
            {% if prozent is defined %}
              {{ (prozent | float * 100) | int }}
            {% else %}
              {{ (states('input_number.magna3_sollwert_prozent') | float * 100) | int }}
            {% endif %}
  
  magna3_set_sollwert_meter:
    alias: "MAGNA3: Sollwert (m) setzen"
    fields:
      meter:
        description: "Sollwert in Meter (z.B. 4.0)"
        example: "4.0"
    sequence:
      - variables:
          m: "{{ meter | float if meter is defined else states('input_number.magna3_sollwert_meter') | float }}"
          s_max: "{{ states('sensor.magna3_sensor_maximum') | float(0) }}"
          r_min_pct: "{{ states('sensor.magna3_sollwertbereich_min') | float(0) }}"
          r_max_pct: "{{ states('sensor.magna3_sollwertbereich_max') | float(0) }}"
      - condition: template
        value_template: "{{ s_max > 0 and r_max_pct > r_min_pct }}"
      - variables:
          rmin: "{{ (r_min_pct / 100) * s_max }}"
          rmax: "{{ (r_max_pct / 100) * s_max }}"
          prozent: "{{ ((m - rmin) / (rmax - rmin)) * 100 }}"
          # Clamp auf 0-100% und umrechnen in Registerwert (0-10000)
          reg_value: "{{ [0, [10000, (prozent * 100) | int] | min] | max }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 103  # Register 00104
          slave: 1
          value: "{{ reg_value }}"
  
  # Regelungsart setzen
  magna3_set_regelungsart:
    alias: "MAGNA3: Regelungsart setzen"
    fields:
      mode:
        description: "Mode Code (6=Prop, 128=AUTO, 129=FLOW)"
        example: "128"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 101  # Register 00102
          slave: 1
          value: >
            {% if mode is defined %}
              {{ mode | int }}
            {% else %}
              {{ states('input_number.magna3_regelungsart') | int }}
            {% endif %}
  
  # Remote Start
  magna3_start_remote:
    alias: "MAGNA3: Remote Start"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100  # Register 00101
          slave: 1
          value: 3  # Remote(1) + On(1)

  # Remote Stop
  magna3_stop_remote:
    alias: "MAGNA3: Remote Stop"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 1  # Remote(1) + Off(0)

  # Zurück zu Lokal (Bus-Sollwert verwerfen, Pumpe nutzt im EEPROM gespeicherten Wert)
  magna3_to_local:
    alias: "MAGNA3: Zurück zu Lokal"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 0  # Local(0)

  # Zurück zu Lokal MIT Übernahme des aktuellen Bus-Sollwerts ins Pumpen-EEPROM.
  # Mechanismus laut Grundfos-Dok 98367081 (Reg 00101 Bit 4 "CopyToLocal"):
  # Control Context (Regelmodus, Betriebsmodus, On/Off, Sollwert) wird von
  # Remote nach Local kopiert, wenn beim Remote->Local-Wechsel Bit 4 gesetzt ist.
  # Zweistufige Variante: Bit 4 setzen, waehrend wir noch in Remote sind,
  # damit die Pumpe es bei ihrem naechsten Polling-Zyklus sieht; dann der
  # Remote->Local-Wechsel. Der Ein-Write-Ansatz (3 -> 16) hat sich auf realer
  # MAGNA3-Firmware als unzuverlaessig erwiesen, weil die Pumpe CopyToLocal
  # nicht zwingend im selben Polling-Zyklus wie die Bit-0-Flanke erkennt.
  magna3_to_local_copy:
    alias: "MAGNA3: Zurück zu Lokal (Sollwert übernehmen)"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100  # Register 00101
          slave: 1
          value: 19  # Remote(1) + On(1) + CopyToLocal(1) — Bit 4 vorbereiten (noch Remote)
      - delay:
          milliseconds: 500
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 16  # Local(0) + CopyToLocal(1) — Remote->Local-Flanke loest EEPROM-Kopie aus
      - delay: 2
      - action: persistent_notification.create
        data:
          message: "MAGNA3 auf Lokal — aktueller Sollwert übernommen"
          title: "MAGNA3"

  # Alarm Reset
  magna3_reset_alarm:
    alias: "MAGNA3: Alarm zurücksetzen"
    sequence:
      # Rising Edge: 0 → 1
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 7  # Remote(1) + On(1) + ResetAlarm(1)
      - delay: 2
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 3  # Zurück zu Remote + On
      - action: persistent_notification.create
        data:
          title: "MAGNA3"
          message: "Alarm-Reset ausgeführt (Pumpe ist jetzt unter HA-Steuerung)"

  # AUTOADAPT aktivieren
  magna3_enable_autoadapt:
    alias: "MAGNA3: AUTOADAPT aktivieren"
    sequence:
      - action: script.magna3_set_regelungsart
        data:
          mode: 128

  # FLOWADAPT aktivieren
  magna3_enable_flowadapt:
    alias: "MAGNA3: FLOWADAPT aktivieren"
    sequence:
      - action: script.magna3_set_regelungsart
        data:
          mode: 129

  # Proportionaldruck aktivieren
  magna3_enable_proportional:
    alias: "MAGNA3: Proportionaldruck aktivieren"
    sequence:
      - action: script.magna3_set_regelungsart
        data:
          mode: 6

  # Konstantdruck aktivieren
  magna3_enable_constant_pressure:
    alias: "MAGNA3: Konstantdruck aktivieren"
    sequence:
      - action: script.magna3_set_regelungsart
        data:
          mode: 4

  # --- Optional: FLOWLIMIT setzen (Register 00106) ---
  # HINWEIS: Dieses Script wird nicht über die UI bedient — die zugehörige
  # input_number ist oben bewusst auskommentiert. Der Fallback unten greift
  # nur, wenn sie einkommentiert wird; sonst bricht das Script sauber ab.
  # Aufruf mit explizitem Parameter, z.B.:
  #   action: script.magna3_set_max_flow_limit
  #   data:
  #     limit_m3h: 2.5  # Max. Durchfluss in m³/h
  magna3_set_max_flow_limit:
    alias: "MAGNA3: Max Durchflusslimit setzen"
    fields:
      limit_m3h:
        description: "Max. Durchfluss in m³/h (z.B. 2.5)"
        example: "2.5"
    variables:
      limit: >
        {% if limit_m3h is defined %}
          {{ limit_m3h | float(-1) }}
        {% else %}
          {{ states('input_number.magna3_max_flow_limit') | float(-1) }}
        {% endif %}
    sequence:
      # Ohne gültigen Wert sauber abbrechen, statt 0 m³/h ins Limit zu schreiben.
      # (numeric_state scheidet aus: es verlangt eine entity_id, limit ist eine Variable.)
      - condition: template
        value_template: "{{ limit | float(-1) >= 0 }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 105  # Register 00106
          slave: 1
          value: "{{ (limit | float(0) * 100) | int }}"

  # --- WARNUNG: PID-Parameter - NUR FÜR EXPERTEN! ---
  # magna3_set_pid_kp:
  #   alias: "MAGNA3: Kp setzen (EXPERTEN!)"
  #   fields:
  #     kp:
