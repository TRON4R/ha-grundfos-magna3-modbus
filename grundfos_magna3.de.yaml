# ==============================================================================
# TEMPLATE BINARY SENSORS - Status-Bits dekodieren
# ==============================================================================
# Die Modbus-Integration kann nicht einzelne Bits auslesen,
# daher über Template Binary Sensors mit Bit-Masken
template:
  - binary_sensor: # für Register 00201
      # Bit 0: LowFlowStop
      - name: "MAGNA3 Low Flow Stop"
        unique_id: magna3_status_low_flow_stop
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(1) > 0 }}
        device_class: running
        icon: mdi:water-off
      
      # Bit 1: CopyToLocal
      - name: "MAGNA3 Copy to Local"
        unique_id: magna3_status_copy_to_local
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(2) > 0 }}
        icon: mdi:content-copy
      
      # Bit 2: MaxFlowLimit Enabled
      - name: "MAGNA3 FlowLimit Aktiv"
        unique_id: magna3_status_flowlimit_enabled
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(4) > 0 }}
        icon: mdi:water-check
      
      # Bit 6: Rotation (Pumpe läuft)
      - name: "MAGNA3 Läuft"
        unique_id: magna3_status_rotation
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(64) > 0 }}
        device_class: running
        icon: mdi:pump
      
      # Bit 8: AccessMode (Remote/Local)
      - name: "MAGNA3 Remote Modus"
        unique_id: magna3_status_remote_mode
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(256) > 0 }}
        device_class: connectivity
        icon: mdi:lan-connect
      
      # Bit 9: OnOff
      - name: "MAGNA3 Eingeschaltet"
        unique_id: magna3_status_on_off
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(512) > 0 }}
        device_class: power
        icon: mdi:power
      
      # Bit 10: Alarm
      - name: "MAGNA3 Alarm"
        unique_id: magna3_status_alarm
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(1024) > 0 }}
        device_class: problem
        icon: mdi:alert-circle
      
      # Bit 11: Warning
      - name: "MAGNA3 Warnung"
        unique_id: magna3_status_warning
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(2048) > 0 }}
        device_class: problem
        icon: mdi:alert
      
      # Bit 12: ForcedToLocal - zeigt ob Fernsteuerung ausgeschaltet und lokaler Handbetrieb eingeschaltet ist
      - name: "MAGNA3 Zwang auf Handbetrieb"
        unique_id: magna3_status_forced_to_local
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(4096) > 0 }}
        device_class: problem
        icon: mdi:hand-back-left
      
      # Bit 13: AtMaxSpeed
      - name: "MAGNA3 Max Drehzahl"
        unique_id: magna3_status_at_max_speed
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(8192) > 0 }}
        icon: mdi:speedometer
      
      # Bit 15: AtMinSpeed
      - name: "MAGNA3 Min Drehzahl"
        unique_id: magna3_status_at_min_speed
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(32768) > 0 }}
        icon: mdi:speedometer

  # ==========================================================================
  # TEMPLATE SENSORS - Berechnete Werte und Textausgaben
  # ==========================================================================

  - sensor:
      # errechnet Softwareversion und -datum aus den BCD-Werten in den Registern 00034 bis 00037
      - name: "MAGNA3 Software Version" 
        unique_id: magna3_software_version
        availability: "{{ states('sensor.magna3_software_version_hi_raw') | is_number and states('sensor.magna3_software_version_lo_raw') | is_number and states('sensor.magna3_software_datum_daymonth_raw') | is_number and states('sensor.magna3_software_datum_year_raw') | is_number }}"
        state: >
          {% set hi = states('sensor.magna3_software_version_hi_raw') | int(0) %}
          {% set lo = states('sensor.magna3_software_version_lo_raw') | int(0) %}
          {% set dm = states('sensor.magna3_software_datum_daymonth_raw') | int(0) %}
          {% set yr = states('sensor.magna3_software_datum_year_raw') | int(0) %}
          {% set a = (hi // 4096) | bitwise_and(0x0F) %}
          {% set b = (hi // 256) | bitwise_and(0x0F) %}
          {% set c = (hi // 16) | bitwise_and(0x0F) %}
          {% set d = hi | bitwise_and(0x0F) %}
          {% set e = (lo // 4096) | bitwise_and(0x0F) %}
          {% set f = (lo // 256) | bitwise_and(0x0F) %}
          {% set g = (lo // 16) | bitwise_and(0x0F) %}
          {% set h = lo | bitwise_and(0x0F) %}
          {% set day1 = (dm // 4096) | bitwise_and(0x0F) %}
          {% set day2 = (dm // 256) | bitwise_and(0x0F) %}
          {% set mon1 = (dm // 16) | bitwise_and(0x0F) %}
          {% set mon2 = dm | bitwise_and(0x0F) %}
          {% set y1 = (yr // 4096) | bitwise_and(0x0F) %}
          {% set y2 = (yr // 256) | bitwise_and(0x0F) %}
          {% set y3 = (yr // 16) | bitwise_and(0x0F) %}
          {% set y4 = yr | bitwise_and(0x0F) %}
          {{ a }}{{ b }}.{{ c }}{{ d }}.{{ e }}{{ f }}.{{ g }}{{ h }} ({{ day1 }}{{ day2 }}.{{ mon1 }}{{ mon2 }}.{{ y1 }}{{ y2 }}{{ y3 }}{{ y4 }})
        icon: mdi:information-outline
  
      # Regelungsart als Text
      - name: "MAGNA3 Regelungsart"
        unique_id: magna3_control_mode_text
        availability: "{{ states('sensor.magna3_regelungsart_code') | is_number }}"
        state: >
          {% set mode = states('sensor.magna3_regelungsart_code') | int(0) %}
          {% if mode == 0 %}Konstante Drehzahl
          {% elif mode == 1 %}Konstante Frequenz
          {% elif mode == 3 %}Konstante Förderhöhe
          {% elif mode == 4 %}Konstantdruck
          {% elif mode == 5 %}Konstanter Differenzdruck
          {% elif mode == 6 %}Proportionaldruck
          {% elif mode == 7 %}Konstanter Volumenstrom
          {% elif mode == 8 %}Konstante Temperatur
          {% elif mode == 10 %}Konstanter Füllstand
          {% elif mode == 128 %}AUTOADAPT
          {% elif mode == 129 %}FLOWADAPT
          {% elif mode == 130 %}Regelung mit externem Sensor
          {% elif mode == 131 %}AUTOADAPT(CP)
          {% else %}Unbekannt ({{ mode }})
          {% endif %}
        icon: mdi:tune
      
      # Betriebsmodus als Text
      - name: "MAGNA3 Betriebsmodus"
        unique_id: magna3_operation_mode_text
        availability: "{{ states('sensor.magna3_betriebsmodus_code') | is_number }}"
        state: >
          {% set mode = states('sensor.magna3_betriebsmodus_code') | int(0) %}
          {% if mode == 0 %}Auto-Regelung
          {% elif mode == 4 %}Mindestkennlinie
          {% elif mode == 6 %}Maximumkennlinie
          {% else %}Unbekannt ({{ mode }})
          {% endif %}
        icon: mdi:cog-outline
      
      # Alarm-Code als Text (häufigste Codes)
      - name: "MAGNA3 Alarm Text"
        unique_id: magna3_alarm_text
        availability: "{{ states('sensor.magna3_alarm_code') | is_number }}"
        state: >
          {% set code = states('sensor.magna3_alarm_code') | int(0) %}
          {% if code == 0 %}Kein Alarm
          {% elif code == 1 %}Leakage Current
          {% elif code == 2 %}Missing Phase
          {% elif code == 3 %}External Fault
          {% elif code == 4 %}Too Many Restarts
          {% elif code == 32 %}Overvoltage
          {% elif code == 40 %}Undervoltage
          {% elif code == 48 %}Overload
          {% elif code == 49 %}Overcurrent
          {% elif code == 51 %}Blocked Motor
          {% elif code == 57 %}Dry Running
          {% elif code == 64 %}Overtemperature
          {% elif code == 88 %}Sensor Fault
          {% else %}Code {{ code }}
          {% endif %}
        icon: mdi:alert-circle-outline
      
      # Energiekosten (anpassbar)
      - name: "MAGNA3 Energiekosten"
        unique_id: magna3_energy_cost
        availability: "{{ states('sensor.magna3_energieverbrauch') | is_number }}"
        unit_of_measurement: "EUR"
        device_class: monetary
        state_class: total
        state: >
          {{ (states('sensor.magna3_energieverbrauch') | float(0) * 0.30) | round(2) }}
        # ↑ Strompreis anpassen!
      
      # Effizienz berechnen
      - name: "MAGNA3 Effizienz"
        unique_id: magna3_efficiency
        availability: "{{ states('sensor.magna3_leistungsaufnahme') | is_number and states('sensor.magna3_durchfluss') | is_number and states('sensor.magna3_forderhohe') | is_number }}"
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set p_elec = states('sensor.magna3_leistungsaufnahme') | float(0) %}
          {% set flow = states('sensor.magna3_durchfluss') | float(0) %}
          {% set head = states('sensor.magna3_forderhohe') | float(0) %}
          {% if p_elec > 0 %}
            {% set p_hydr = (flow * head * 2.725) %}
            {{ ((p_hydr / p_elec) * 100) | round(1) }}
          {% else %}0{% endif %}
        icon: mdi:percent
      
      # Sollwert in Meter umrechnen (Formel verifiziert am 11.02.2026)
      - name: "MAGNA3 Sollwert (Meter)"
        unique_id: magna3_setpoint_meter
        unit_of_measurement: "m"
        device_class: distance
        state_class: measurement
        # Quellen sind Modbus-Register, die zeitweise aussetzen koennen.
        # Bei fehlenden Quellen wird der Sensor regulaer "unavailable"
        # statt im state den Text "unavailable" zu rendern (= ungueltig
        # fuer einen numerischen Sensor -> wurde sonst zu "unknown").
        # Nur gueltig, wenn die Pumpe in Metern meldet (Einheit 2) und geregelt
        # laeuft. Bei Konstanter Drehzahl (0) / Frequenz (1) meldet sie Bereich und
        # Maximum in %; die Formel ergaebe dann Unsinn (z. B. "43 m").
        # Jeder Eingang muss eine gueltige Zahl sein; ein fehlender Wert darf nicht als 0 einfliessen
        # (fehlende Untergrenze 00215 ergaebe sonst einen falschen Meterwert).
        availability: >
          {% set sp = states('sensor.magna3_sollwert_benutzer') | float(-1) %}
          {% set s_max = states('sensor.magna3_sensor_maximum') | float(0) %}
          {% set r_min_pct = states('sensor.magna3_sollwertbereich_min') | float(-1) %}
          {% set r_max_pct = states('sensor.magna3_sollwertbereich_max') | float(-1) %}
          {% set einheit = states('sensor.magna3_sensor_einheit') | int(-1) %}
          {% set modus = states('sensor.magna3_regelungsart_code') | int(-1) %}
          {{ 0 <= sp <= 100 and s_max > 0 and 0 <= r_min_pct < r_max_pct <= 100
             and einheit == 2 and modus not in [-1, 0, 1] }}
        state: >
          {% set sp = states('sensor.magna3_sollwert_benutzer') | float(0) %}
          {% set s_max = states('sensor.magna3_sensor_maximum') | float(0) %}
          {% set r_min_pct = states('sensor.magna3_sollwertbereich_min') | float(0) %}
          {% set r_max_pct = states('sensor.magna3_sollwertbereich_max') | float(0) %}
          {% set rmin = (r_min_pct / 100) * s_max %}
          {% set rmax = (r_max_pct / 100) * s_max %}
          {{ ((sp / 100) * (rmax - rmin) + rmin) | round(2) }}
        icon: mdi:ruler
      
      - name: "MAGNA3 Uhrzeit"
        unique_id: magna3_pump_rtc_formatted
        availability: "{{ states('sensor.magna3_uhrzeit_unix') | is_number }}"
        device_class: timestamp
        state: >
          {{ states('sensor.magna3_uhrzeit_unix') | int(0) | as_datetime }}


      - name: "MAGNA3 Durchfluss-Status Text"
        unique_id: magna3_flow_estimation_text
        availability: "{{ states('sensor.magna3_flow_estimation_status') | is_number }}"
        state: >
          {% set status = states('sensor.magna3_flow_estimation_status') | int(0) %}
          {% if status == 0 %}innerhalb des Messbereichs
          {% elif status == 1 %}unterhalb des Messbereichs
          {% elif status == 2 %}oberhalb des Messbereichs
          {% else %}Unbekannt ({{ status }})
          {% endif %}
        icon: mdi:chart-bell-curve

        # Steuerquelle als Text
      - name: "MAGNA3 Steuerquelle"
        unique_id: magna3_control_source_text
        availability: "{{ states('sensor.magna3_steuerquelle_code') | is_number }}"
        state: >
          {% set source = states('sensor.magna3_steuerquelle_code') | int(0) %}
          {% if source == 1 %}Pumpendisplay
          {% elif source == 2 %}Home Assistant via Modbus/TCP
          {% elif source == 3 %}Grundfos GO App
          {% elif source == 4 %}Digital Input
          {% elif source == 5 %}OFF Taste
          {% else %}Unbekannt ({{ source }})
          {% endif %}
        icon: >
          {% set source = states('sensor.magna3_steuerquelle_code') | int(0) %}
          {% if source == 1 %}mdi:monitor
          {% elif source == 2 %}mdi:ethernet
          {% elif source == 3 %}mdi:cellphone-wireless
          {% elif source == 4 %}mdi:electric-switch
          {% elif source == 5 %}mdi:power-off
          {% else %}mdi:help-circle
          {% endif %}


      - name: "MAGNA3 Months To Bearing Service"
        unique_id: magna3_months_to_bearing_service
        unit_of_measurement: "mon"
        state_class: measurement
        # device_class: (weggelassen)  # HA hat keine duration-Device-Class für "Monate"
        availability: >
          {{ states('sensor.magna3_bearing_service_raw') | is_number
             and (states('sensor.magna3_bearing_service_raw') | int) | bitwise_and(0xFF) != 255 }}
        state: >
          {{ (states('sensor.magna3_bearing_service_raw') | int(0)) | bitwise_and(0xFF) }}

      - name: "MAGNA3 Bearing Service Type"
        unique_id: magna3_bearing_service_type
        availability: "{{ states('sensor.magna3_bearing_service_raw') | is_number }}"
        state: >
          {% set v = states('sensor.magna3_bearing_service_raw') | int(0) %}
          {% set t = (v // 256) | bitwise_and(0x01) %}
          {{ 'Lubricate bearings' if t == 0 else 'Change bearings' }}
        # device_class: (weggelassen)  # Textstatus
        # state_class: (weggelassen)   # Textstatus

      - name: "MAGNA3 Drive State"
        unique_id: magna3_drive_state_text
        availability: "{{ states('sensor.magna3_drive_state_code') | is_number }}"
        state: >
          {% set s = states('sensor.magna3_drive_state_code') | int(-1) %}
          {% if s == 0 %}Stopped
          {% elif s == 1 %}Accelerating
          {% elif s == 2 %}Decelerating
          {% elif s == 3 %}Steady state / closed loop
          {% elif s == 5 %}Accelerating halt
          {% elif s == 6 %}Decelerating halt
          {% elif s == 7 %}Start on the run (flying cut-in)
          {% else %}Code {{ s }}
          {% endif %}
        # device_class: (weggelassen)  # Textstatus
        # state_class: (weggelassen)   # Textstatus


      # --- Durchfluss Sensor zeigt nativ m³/h an statt L/h. Z.B. die Lambda WP aber L/h ---
      # --- Dieser Template-Sensor spiegelt den Original-Modbus-Sensor in L/h zur besseren Vergleichbarkeit in Kurven ---
      - name: "MAGNA3 Durchfluss L/h"
        unique_id: magna3_durchfluss_lh
        unit_of_measurement: "L/h"
        state: "{{ (states('sensor.magna3_durchfluss') | float(0) * 1000) | round(0) }}"
        device_class: volume_flow_rate
        state_class: measurement

# ==============================================================================
# INPUT NUMBERS - UI-Steuerung
# ==============================================================================
input_number:
  magna3_sollwert_prozent:
    name: "MAGNA3 Sollwert (%)"
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: "%"
    icon: mdi:percent
    mode: slider # alternativ auch box möglich
  
  magna3_sollwert_meter:
    name: "MAGNA3 Sollwert (m)"
    min: 0
    max: 10  # bei Pumpen mit mehr Förderhöhe erhöhen
    step: 0.1
    unit_of_measurement: "m"
    icon: mdi:ruler
    mode: slider # alternativ auch box möglich
  
  magna3_regelungsart:
    name: "MAGNA3 Regelungsart (Code)"
    min: 0
    max: 131
    step: 1
    icon: mdi:cog
    mode: box
  
  # --- Optional: FLOWLIMIT setzen (Register 00106) ---
  # ACHTUNG: Nur aktivieren wenn FLOWADAPT oder EnableMaxFlowLimit verwendet wird!
  # magna3_max_flow_limit:
  #   name: "MAGNA3 Max Durchflusslimit"
  #   min: 0
  #   max: 90  # 0-90% von Qmax oder 0-9.0 m³/h (je nach Pumpe)
  #   step: 0.1
  #   unit_of_measurement: "m³/h"
  #   # kein state_class: measurement weil ein Sollwert und keine Statistik
  #   icon: mdi:water-check
  #   mode: slider
  
  # ============================================================================
  # WARNUNG: PID-PARAMETER - NUR FÜR EXPERTEN!
  # ============================================================================
  # Die folgenden Register (00110-00112) steuern den PID-Regler der Pumpe.
  # Grundfos hat diese Werte werkseitig optimal eingestellt!
  # 
  # RISIKEN beim Verstellen:
  # - Instabile Regelung (Pumpe taktet, schwingt)
  # - Mechanische Belastung, Motor-Überlastung
  # - Bei falscher Regelrichtung (00112): KATASTROPHALE Fehlfunktion!
  # - Keine Sollwert-Erreichung
  # - Schwer rückgängig zu machen
  # 
  # NUR AKTIVIEREN wenn:
  # - Von Grundfos-Support explizit empfohlen
  # - Hydraulik massiv verändert wurde
  # - Unter Beobachtung mit Messgeräten!
  # ============================================================================
  
  # --- PID-Parameter (NUR für Experten, auskommentiert!) ---
  # magna3_pid_kp:
  #   name: "MAGNA3 Kp (P-Verstärkung)"
  #   min: 0
  #   max: 10.0
  #   step: 0.1
  #   icon: mdi:sine-wave
  #   mode: box
  #   # Register 00110, Skalierung 0.1
  #   # Default: Pumpen-spezifisch (z.B. 1.5)
  #   # Zu hoch → Überschwingen, Schwingen
  #   # Zu niedrig → Träge Regelung
  
  # magna3_pid_ti:
  #   name: "MAGNA3 Ti (Integralzeit)"
  #   min: 0
  #   max: 100.0
  #   step: 0.1
  #   unit_of_measurement: "s"
  #   icon: mdi:timer-outline
  #   mode: box
  #   # Register 00111, Skalierung 0.1 s
  #   # Default: 10-30s (pumpen-spezifisch)
  #   # Zu klein → Schnelles Aufintegrieren, Überschwingen
  #   # Zu groß → Langsame Ausregelung
  
  # magna3_pid_direct:
  #   name: "MAGNA3 Regelrichtung"
  #   min: 0
  #   max: 1
  #   step: 1
  #   icon: mdi:swap-vertical
  #   mode: box
  #   # Register 00112
  #   # 0 = Invers (Standard): Sensor↑ → Pumpe↓
  #   # 1 = Direkt: Sensor↑ → Pumpe↑
  #   # ACHTUNG: Falsch eingestellt = Pumpe regelt verkehrt herum!

# ==============================================================================
# SCRIPTS - Pumpensteuerung
# ==============================================================================
script:
  # Sollwert in % setzen
  magna3_set_sollwert_prozent:
    alias: "MAGNA3: Sollwert (%) setzen"
    fields:
      prozent:
        description: "Sollwert in Prozent (0-100)"
        example: "45.5"
    sequence:
      - variables:
          wert: >
            {{ prozent | float(-1) if prozent is defined
               else states('input_number.magna3_sollwert_prozent') | float(-1) }}
      # Werte ausserhalb 0-100 % (z. B. bei direktem Skript-Aufruf) nicht schreiben
      - condition: template
        value_template: "{{ 0 <= wert <= 100 }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 103  # Register 00104
          slave: 1
          value: "{{ (wert * 100) | round(0) | int }}"
  
  # Die Meter-Umrechnung braucht Einheit und Bereiche der aktiven Regelungsart. Diese
  # liest "Sensor-Konfiguration bei Regelungsart-Wechsel nachlesen" erst 5 s nach einem
  # Wechsel nach. Waehrend ein Wechsel laeuft (vom Klick an, also schon vor dem Schreiben),
  # die Bereiche nachgelesen werden oder der Wechsel keine 7 s her ist, wird gewartet
  # (Wunschwert vorher gemerkt); sonst rechnete das Skript mit dem Bereich der alten
  # Regelungsart. Nach 20 s ohne Freigabe wird nicht geschrieben.
  # restart: Eine neue Eingabe waehrend der Wartezeit ersetzt die alte. Jede neue Slider-
  # Eingabe (% oder m) bricht einen wartenden Auftrag ab (siehe "Sync Sollwert %/m").
  magna3_set_sollwert_meter:
    alias: "MAGNA3: Sollwert (m) setzen"
    mode: restart
    fields:
      meter:
        description: "Sollwert in Meter (z.B. 4.0)"
        example: "4.0"
    sequence:
      - variables:
          m: "{{ meter | float if meter is defined else states('input_number.magna3_sollwert_meter') | float }}"
      # Warten, solange die Regelungsart gesetzt oder ihr Bereich nachgelesen wird (max. 20 s)
      - repeat:
          while:
            - condition: template
              value_template: >
                {{ repeat.index <= 40
                   and (is_state('script.magna3_set_regelungsart', 'on')
                        or state_attr('automation.magna3_sensor_konfiguration_bei_regelungsart_wechsel_nachlesen', 'current') | int(0) > 0
                        or now() - states.sensor.magna3_regelungsart_code.last_changed < timedelta(seconds=7)) }}
          sequence:
            - delay:
                milliseconds: 500
      # Nach 20 s immer noch nicht freigegeben: nicht schreiben
      - condition: template
        value_template: >
          {{ not (is_state('script.magna3_set_regelungsart', 'on')
                  or state_attr('automation.magna3_sensor_konfiguration_bei_regelungsart_wechsel_nachlesen', 'current') | int(0) > 0) }}
      - variables:
          s_max: "{{ states('sensor.magna3_sensor_maximum') | float(0) }}"
          r_min_pct: "{{ states('sensor.magna3_sollwertbereich_min') | float(-1) }}"
          r_max_pct: "{{ states('sensor.magna3_sollwertbereich_max') | float(-1) }}"
          einheit: "{{ states('sensor.magna3_sensor_einheit') | int(-1) }}"
          modus: "{{ states('sensor.magna3_regelungsart_code') | int(-1) }}"
      # Nur umrechnen, wenn alle Eingaenge gueltig sind (kein Ersatzwert 0),
      # die Pumpe in Metern meldet und geregelt laeuft
      - condition: template
        value_template: >
          {{ s_max > 0 and 0 <= r_min_pct < r_max_pct <= 100
             and einheit == 2 and modus not in [-1, 0, 1] }}
      - variables:
          rmin: "{{ (r_min_pct / 100) * s_max }}"
          rmax: "{{ (r_max_pct / 100) * s_max }}"
          prozent: "{{ ((m - rmin) / (rmax - rmin)) * 100 }}"
      # Ausserhalb 0-100 % abbrechen statt begrenzen: ein solcher Wert zeigt
      # falsche Eingangsdaten an, und Begrenzen haette 0 % geschrieben.
      - condition: template
        value_template: "{{ 0 <= prozent <= 100 }}"
      - variables:
          reg_value: "{{ (prozent * 100) | round(0) | int }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 103  # Register 00104
          slave: 1
          value: "{{ reg_value }}"
      # Pumpenwert nachlesen, damit die Slider gleich den geschriebenen Wert zeigen
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.magna3_sollwert_benutzer
  
  # Regelungsart setzen
  magna3_set_regelungsart:
    alias: "MAGNA3: Regelungsart setzen"
    # restart: Ein zweiter Klick innerhalb der 2 s Nachlesezeit wird ausgefuehrt statt verworfen
    mode: restart
    fields:
      mode:
        description: "Mode Code (6=Prop, 128=AUTO, 129=FLOW)"
        example: "128"
    sequence:
      - variables:
          code: >
            {{ mode | int(-1) if mode is defined
               else states('input_number.magna3_regelungsart') | int(-1) }}
      # Nur Regelungsarten aus Reg 00102 (Grundfos 98367081) schreiben
      - condition: template
        value_template: "{{ code in [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 128, 129, 130, 131] }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 101  # Register 00102
          slave: 1
          value: "{{ code }}"
      # Aktive Regelungsart sofort nachlesen (sonst bis zu 30 s), damit das Dashboard gleich umschaltet.
      # Auch den Sollwert (Reg 00338): Die Pumpe fuehrt je Regelungsart einen eigenen Sollwert,
      # sonst zeigen die Slider bis zu 15 s den der vorherigen Regelungsart.
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_regelungsart_code
            - sensor.magna3_sollwert_benutzer
  
  # Bus-Kontext vorbelegen, bevor die Pumpe nach Remote wechselt (intern, von
  # Remote Start, Remote Stop, Alarm-Reset und "Einstellungen sichern" aufgerufen).
  # Die Vorgabe-Register 00102 (Regelungsart), 00103 (Betriebsmodus) und 00104
  # (Sollwert) stehen nach jedem Aus/Ein der Pumpe auf 0. Ohne Vorbelegung liefe
  # die Pumpe in Remote mit Regelungsart 0 (Konstante Drehzahl) und 0 % Sollwert,
  # und ein anschliessendes "Einstellungen sichern" wuerde das dauerhaft ins EEPROM
  # schreiben. Deshalb werden die aktiven Werte (Reg 00203, 00204, 00338) frisch
  # gelesen und in die Vorgabe-Register kopiert. Die Pumpe laeuft nach dem Wechsel
  # also genau so weiter wie vorher.
  # Ist die Pumpe schon in Remote, stehen in den Vorgabe-Registern bereits die Werte
  # von HA; dann wird nichts geschrieben (sonst koennte ein noch nicht nachgelesener
  # Wert eine gerade gemachte Aenderung zuruecksetzen). Rueckgabe: {"ok": true/false}.
  magna3_prepare_remote:
    alias: "MAGNA3: Remote vorbereiten (intern)"
    # queued: Zwei fast gleichzeitige Vorbereitungen (z. B. Start und Stop) laufen
    # nacheinander, statt dass die zweite als "laeuft schon" verworfen wird. Das betrifft
    # nur die Vorbereitung; die aufrufenden Steuerablaeufe laufen weiterhin unabhaengig.
    mode: queued
    sequence:
      # Frisch lesen statt der bis zu 30 s alten Werte
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_regelungsart_code
            - sensor.magna3_betriebsmodus_code
            - sensor.magna3_sollwert_benutzer
      - variables:
          status: "{{ states('sensor.magna3_status_bits_raw') | int(-1) }}"
          ist_remote: "{{ status >= 0 and status | bitwise_and(256) > 0 }}"
          modus: "{{ states('sensor.magna3_regelungsart_code') | int(-1) }}"
          betrieb: "{{ states('sensor.magna3_betriebsmodus_code') | int(-1) }}"
          sollwert: "{{ states('sensor.magna3_sollwert_benutzer') | float(-1) }}"
          werte_ok: >
            {{ modus in [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 128, 129, 130, 131]
               and betrieb in [0, 4, 6] and 0 <= sollwert <= 100 }}
          ok: "{{ status >= 0 and (ist_remote or werte_ok) }}"
          ergebnis: "{{ {'ok': ok} }}"
      - if:
          - condition: template
            value_template: "{{ not ok }}"
        then:
          - action: persistent_notification.create
            data:
              title: "MAGNA3"
              message: >-
                Wechsel nach Remote abgebrochen: Status, Regelungsart, Betriebsmodus
                oder Sollwert der Pumpe sind gerade nicht verfügbar. Bitte in einer
                Minute erneut versuchen.
      - if:
          - condition: template
            value_template: "{{ ok and not ist_remote }}"
        then:
          - action: modbus.write_register
            data:
              hub: Grundfos_MAGNA3
              address: 101  # Register 00102 = aktive Regelungsart
              slave: 1
              value: "{{ modus }}"
          - action: modbus.write_register
            data:
              hub: Grundfos_MAGNA3
              address: 102  # Register 00103 = aktiver Betriebsmodus
              slave: 1
              value: "{{ betrieb }}"
          - action: modbus.write_register
            data:
              hub: Grundfos_MAGNA3
              address: 103  # Register 00104 = aktiver Sollwert
              slave: 1
              value: "{{ (sollwert * 100) | round(0) | int }}"
      - stop: "Remote vorbereitet"
        response_variable: ergebnis

  # Remote Start
  magna3_start_remote:
    alias: "MAGNA3: Remote Start"
    sequence:
      - action: script.magna3_prepare_remote
        response_variable: vorbereitung
      - condition: template
        value_template: "{{ vorbereitung.ok }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100  # Register 00101
          slave: 1
          value: 3  # Remote(1) + On(1)
      # Status sofort nachlesen (sonst bis zu 30 s), damit das Dashboard gleich umschaltet
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_steuerquelle_code

  # Remote Stop
  magna3_stop_remote:
    alias: "MAGNA3: Remote Stop"
    sequence:
      - action: script.magna3_prepare_remote
        response_variable: vorbereitung
      - condition: template
        value_template: "{{ vorbereitung.ok }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 1  # Remote(1) + Off(0)
      # Status sofort nachlesen (sonst bis zu 30 s), damit das Dashboard gleich umschaltet
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_steuerquelle_code

  # Zurück zu Lokal (Bus-Sollwert verwerfen, Pumpe nutzt im EEPROM gespeicherten Wert)
  magna3_to_local:
    alias: "MAGNA3: Zurück zu Lokal"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 0  # Local(0)
      # Status sofort nachlesen (sonst bis zu 30 s), damit das Dashboard gleich umschaltet
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_steuerquelle_code

  # Zurück zu Lokal MIT Übernahme des aktuellen Bus-Sollwerts ins Pumpen-EEPROM.
  # Mechanismus laut Grundfos-Dok 98367081 (Reg 00101 Bit 4 "CopyToLocal"):
  # Control Context (Regelmodus, Betriebsmodus, On/Off, Sollwert) wird von
  # Remote nach Local kopiert, wenn beim Remote->Local-Wechsel Bit 4 gesetzt ist.
  # Zweistufige Variante: Bit 4 setzen, waehrend wir noch in Remote sind,
  # damit die Pumpe es bei ihrem naechsten Polling-Zyklus sieht; dann der
  # Remote->Local-Wechsel. Der Ein-Write-Ansatz (3 -> 16) hat sich auf realer
  # MAGNA3-Firmware als unzuverlaessig erwiesen, weil die Pumpe CopyToLocal
  # nicht zwingend im selben Polling-Zyklus wie die Bit-0-Flanke erkennt.
  # Die Pumpe wird dabei immer eingeschaltet (19 = On): Ein gesichertes "Aus" liesse
  # die Heizkreispumpe nach dem Beenden stillstehen; anwerfen liesse sie sich dann nur
  # noch am Pumpendisplay oder per Grundfos GO, nicht durch die Waermepumpe.
  # Im Lokalbetrieb wechselt Schritt 1 erst nach Remote; damit dabei nicht die nach
  # einem Aus/Ein auf 0 stehenden Vorgabe-Register ins EEPROM gelangen, wird der
  # Bus-Kontext vorher vorbelegt (wie bei Remote Start).
  magna3_to_local_copy:
    alias: "MAGNA3: Zurück zu Lokal (Sollwert übernehmen)"
    sequence:
      - action: script.magna3_prepare_remote
        response_variable: vorbereitung
      - condition: template
        value_template: "{{ vorbereitung.ok }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100  # Register 00101
          slave: 1
          value: 19  # Remote(1) + On(1) + CopyToLocal(1) — Bit 4 vorbereiten (noch Remote)
      - delay:
          milliseconds: 500
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 16  # Local(0) + CopyToLocal(1) — Remote->Local-Flanke loest EEPROM-Kopie aus
      - delay: 2
      # Status sofort nachlesen (sonst bis zu 30 s), damit das Dashboard gleich umschaltet
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_steuerquelle_code
            - sensor.magna3_regelungsart_code
            - sensor.magna3_sollwert_benutzer
      # Kurz warten, bis Regelungsart-Text und Meter-Sensor die frisch gelesenen Werte zeigen
      - delay: 1
      # Meldung mit den Werten, die die Pumpe jetzt lokal hat (= die uebernommenen)
      - action: persistent_notification.create
        data:
          title: "MAGNA3"
          message: >-
            {% set sw = states('sensor.magna3_sollwert_benutzer') %}
            {% set m = states('sensor.magna3_sollwert_meter') %}
            MAGNA3 wurde wieder auf lokale Steuerung über das Display zurückgeschaltet.
            Übernommen wurden die Regelungsart {{ states('sensor.magna3_regelungsart') }}
            und der Sollwert
            {{ (sw | float | round(1) | string).replace('.', ',') ~ ' %' if sw | is_number else 'unbekannt' -}}
            {{ ' (' ~ (m | float | round(2) | string).replace('.', ',') ~ ' m)' if m | is_number else '' }}.

  # Alarm Reset (schaltet die Pumpe nach Remote und ein)
  magna3_reset_alarm:
    alias: "MAGNA3: Alarm zurücksetzen"
    sequence:
      # Der Reset schaltet die Pumpe nach Remote, daher vorher den Bus-Kontext vorbelegen
      - action: script.magna3_prepare_remote
        response_variable: vorbereitung
      - condition: template
        value_template: "{{ vorbereitung.ok }}"
      # Rising Edge: 0 → 1
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 7  # Remote(1) + On(1) + ResetAlarm(1)
      - delay: 2
      # ResetAlarm-Bit nur zuruecknehmen, wenn seither niemand anders Reg 00101 geschrieben
      # hat (Stop, Lokal, Sichern oder eine andere Automation). Sonst wuerde z. B. ein
      # Stop in diesen 2 s durch das Schreiben von 3 (Remote + On) wieder aufgehoben.
      # Zwischen Lesen und Schreiben bleiben wenige Millisekunden: keine atomare Pruefung,
      # verringert das Risiko aber deutlich.
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.magna3_control_register_00101_raw
      - if:
          - condition: state
            entity_id: sensor.magna3_control_register_00101_raw
            state: "7"
        then:
          - action: modbus.write_register
            data:
              hub: Grundfos_MAGNA3
              address: 100
              slave: 1
              value: 3  # Zurück zu Remote + On
      # Status sofort nachlesen (sonst bis zu 30 s), damit das Dashboard gleich umschaltet
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_steuerquelle_code
      # Meldung mit dem tatsaechlichen Zustand (ein Stop in den 2 s nach dem Reset gilt weiter)
      - action: persistent_notification.create
        data:
          title: "MAGNA3"
          message: >-
            {% set s = states('sensor.magna3_status_bits_raw') | int(-1) %}
            Alarm-Reset ausgeführt.
            {% if s < 0 %}Zustand der Pumpe gerade nicht lesbar.
            {%- else %}Pumpe jetzt:
            {{ 'unter HA-Steuerung' if s | bitwise_and(256) > 0 else 'lokal gesteuert' }},
            {{ 'eingeschaltet' if s | bitwise_and(512) > 0 else 'gestoppt' }}.
            {%- endif %}

  # AUTOADAPT aktivieren
  magna3_enable_autoadapt:
    alias: "MAGNA3: AUTOADAPT aktivieren"
    sequence:
      - action: script.magna3_set_regelungsart
        data:
          mode: 128

  # FLOWADAPT aktivieren
  magna3_enable_flowadapt:
    alias: "MAGNA3: FLOWADAPT aktivieren"
    sequence:
      - action: script.magna3_set_regelungsart
        data:
          mode: 129

  # Proportionaldruck aktivieren
  magna3_enable_proportional:
    alias: "MAGNA3: Proportionaldruck aktivieren"
    sequence:
      - action: script.magna3_set_regelungsart
        data:
          mode: 6

  # Konstantdruck aktivieren
  magna3_enable_constant_pressure:
    alias: "MAGNA3: Konstantdruck aktivieren"
    sequence:
      - action: script.magna3_set_regelungsart
        data:
          mode: 4

  # --- Optional: FLOWLIMIT setzen (Register 00106) ---
  # HINWEIS: Dieses Script wird nicht über die UI bedient — die zugehörige
  # input_number ist oben bewusst auskommentiert. Der Fallback unten greift
  # nur, wenn sie einkommentiert wird; sonst bricht das Script sauber ab.
  # Aufruf mit explizitem Parameter, z.B.:
  #   action: script.magna3_set_max_flow_limit
  #   data:
  #     limit_m3h: 2.5  # Max. Durchfluss in m³/h
  magna3_set_max_flow_limit:
    alias: "MAGNA3: Max Durchflusslimit setzen"
    fields:
      limit_m3h:
        description: "Max. Durchfluss in m³/h (z.B. 2.5)"
        example: "2.5"
    variables:
      limit: >
        {% if limit_m3h is defined %}
          {{ limit_m3h | float(-1) }}
        {% else %}
          {{ states('input_number.magna3_max_flow_limit') | float(-1) }}
        {% endif %}
    sequence:
      # Ohne gültigen Wert sauber abbrechen, statt 0 m³/h ins Limit zu schreiben.
      # (numeric_state scheidet aus: es verlangt eine entity_id, limit ist eine Variable.)
      - condition: template
        value_template: "{{ limit | float(-1) >= 0 }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 105  # Register 00106
          slave: 1
          value: "{{ (limit | float(0) * 100) | int }}"

  # --- WARNUNG: PID-Parameter - NUR FÜR EXPERTEN! ---
  # magna3_set_pid_kp:
  #   alias: "MAGNA3: Kp setzen (EXPERTEN!)"
  #   fields:
  #     kp:
  #       description: "Proportionalverstärkung (z.B. 1.5)"
  #       example: "1.5"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 109  # Register 00110
  #         slave: 1
  #         value: >
  #           {% set value = kp | float if kp is defined else states('input_number.magna3_pid_kp') | float %}
  #           {{ (value * 10) | int }}
  
  # magna3_set_pid_ti:
  #   alias: "MAGNA3: Ti setzen (EXPERTEN!)"
  #   fields:
  #     ti:
  #       description: "Integralzeit in Sekunden (z.B. 15.0)"
  #       example: "15.0"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 110  # Register 00111
  #         slave: 1
  #         value: >
  #           {% set value = ti | float if ti is defined else states('input_number.magna3_pid_ti') | float %}
  #           {{ (value * 10) | int }}
  
  # magna3_set_pid_direct:
  #   alias: "MAGNA3: Regelrichtung setzen (GEFÄHRLICH!)"
  #   fields:
  #     direct:
  #       description: "0=Invers, 1=Direkt"
  #       example: "0"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 111  # Register 00112
  #         slave: 1
  #         value: >
  #           {% set value = direct | int if direct is defined else states('input_number.magna3_pid_direct') | int %}
  #           {{ value }}

# ==============================================================================
# AUTOMATIONS - Beispiele
# ==============================================================================
automation:
  # ForcedToLocal-Detektor: Pumpe wurde von Hand am Display oder durch andere
  # nicht-HA-initiierte Aktion auf Lokal gezwungen (Reg 00201 Bit 12).
  - id: magna3_forced_to_local_detected
    alias: "MAGNA3: Pumpe wurde auf Lokal gezwungen"
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_zwang_auf_handbetrieb
        to: 'on'
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3"
          message: >
            Die Pumpe wurde auf Lokal gezwungen (ForcedToLocal-Bit gesetzt).
            HA-Steuerung ist aktuell nicht möglich. Ursache: vermutlich Bedienung
            am Pumpendisplay oder über die Grundfos GO App.
  
  # Alarm-Benachrichtigung
  # Statusbit und Alarmcode werden getrennt gelesen: Code vor der Meldung frisch lesen.
  # Aendert sich der Code bei aktivem Alarm, wird dieselbe Meldung (notification_id) aktualisiert.
  - id: magna3_alarm_notification
    alias: "MAGNA3: Alarm Benachrichtigung"
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_alarm
        to: 'on'
      - platform: state
        entity_id: sensor.magna3_alarm_code
        not_to: ['unavailable', 'unknown', '0']
    condition:
      - condition: state
        entity_id: binary_sensor.magna3_alarm
        state: 'on'
    action:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.magna3_alarm_code
      - action: persistent_notification.create
        data:
          notification_id: magna3_alarm
          title: "🚨 MAGNA3 Alarm"
          message: >
            Code: {{ states('sensor.magna3_alarm_code') }}
            {{ states('sensor.magna3_alarm_text') }}
  
  # Warnung-Benachrichtigung (Reg 00201 Bit 11, orange LED an der Pumpe)
  # Wie beim Alarm: Code frisch lesen, Codewechsel aktualisieren dieselbe Meldung.
  - id: magna3_warning_notification
    alias: "MAGNA3: Warnung Benachrichtigung"
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_warnung
        to: 'on'
      - platform: state
        entity_id: sensor.magna3_warning_code
        not_to: ['unavailable', 'unknown', '0']
    condition:
      - condition: state
        entity_id: binary_sensor.magna3_warnung
        state: 'on'
    action:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.magna3_warning_code
      - action: persistent_notification.create
        data:
          notification_id: magna3_warning
          title: "⚠️ MAGNA3 Warnung"
          message: >
            Warnung-Code: {{ states('sensor.magna3_warning_code') }}
            (Pumpe läuft weiter, aber Aufmerksamkeit nötig — z.B. Sensor-Drift
            oder Lager-Service fällig)

  # Warnung bei hohem Strom
  - id: magna3_high_current
    alias: "MAGNA3: Warnung Hoher Strom"
    trigger:
      - platform: numeric_state
        entity_id: sensor.magna3_motorstrom
        above: 5.0
        for:
          minutes: 5
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3 Warnung"
          message: "Motorstrom über 5A: {{ states('sensor.magna3_motorstrom') }} A"
  
  # Sollwert-Sync: Input Number → Modbus. Dafür zuständig, die Werte aus dem Input-Bereich an die Pumpe zu melden
  # Geschrieben wird nur, wenn der Slider vom Pumpenwert abweicht. Setzt die
  # Automation "Beide Slider aus Pumpenwert aktualisieren" einen Slider auf den
  # Pumpenwert, entsteht so kein Echo-Schreibvorgang zurueck zur Pumpe. Ist der
  # Pumpenwert nicht verfuegbar, wird ebenfalls nicht geschrieben.
  # Jede Slider-Eingabe bricht zuerst einen noch wartenden Meter-Auftrag ab (auch wenn sie
  # dem Pumpenwert entspricht), erst danach wird geprueft, ob geschrieben werden muss.
  # Sonst schriebe ein aelterer Meter-Auftrag spaeter ueber die neue Eingabe.
  - id: magna3_sync_setpoint_percent
    alias: "MAGNA3: Sync Sollwert %"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_number.magna3_sollwert_prozent
    action:
      - action: script.turn_off
        target:
          entity_id: script.magna3_set_sollwert_meter
      - condition: template
        value_template: >
          {% set pumpe = states('sensor.magna3_sollwert_benutzer') | float(none) %}
          {{ pumpe is not none
             and (trigger.to_state.state | float(0) - pumpe) | abs > 0.05 }}
      - action: script.magna3_set_sollwert_prozent

  - id: magna3_sync_setpoint_meter
    alias: "MAGNA3: Sync Sollwert m"
    mode: restart  # das Skript wartet ggf. nach einem Regelungsart-Wechsel; die letzte Eingabe gilt
    trigger:
      - platform: state
        entity_id: input_number.magna3_sollwert_meter
    action:
      - action: script.turn_off
        target:
          entity_id: script.magna3_set_sollwert_meter
      - condition: template
        value_template: >
          {% set pumpe = states('sensor.magna3_sollwert_meter') | float(none) %}
          {{ pumpe is not none
             and (trigger.to_state.state | float(0) - pumpe) | abs > 0.005 }}
      - action: script.magna3_set_sollwert_meter

  # Nach jedem HA-Start: 30 Sekunden warten (bis Modbus-Daten da sind), dann werden beide Slider/Boxen auf die aktuellen Pumpenwerte gesetzt.
  # Ein Slider wird nur gesetzt, wenn sein Pumpenwert verfuegbar ist; sonst wuerde er auf 0 springen.
  - id: magna3_sync_slider_on_start
    alias: "MAGNA3: Sollwerte bei Start synchronisieren"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: 30  # Warten bis Modbus-Sensoren geladen
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.magna3_sollwert_benutzer
                state: ["unavailable", "unknown"]
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.magna3_sollwert_prozent
            data:
              value: "{{ states('sensor.magna3_sollwert_benutzer') | float(0) }}"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.magna3_sollwert_meter
                state: ["unavailable", "unknown"]
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.magna3_sollwert_meter
            data:
              value: "{{ states('sensor.magna3_sollwert_meter') | float(0) }}"

  # Regel: 4 s nach der letzten Slider-Bewegung zeigen beide Slider den Pumpenwert.
  # Ausloeser: neue Pumpen-Rueckmeldung, Wechsel Lokal/Remote und Slider-Bewegungen von aussen.
  # - Die Pumpe wird nur alle 15 s gelesen. Nach einer Slider-Bewegung wird Reg 00338 deshalb 2 s spaeter
  #   sofort nachgelesen (Diagramme springen gleich um). Solange ein Slider in den letzten 4 s bewegt
  #   wurde (Nutzer stellt noch), wird er nicht ueberschrieben, sonst sprang er auf einen veralteten
  #   Zwischenwert zurueck.
  # - Im Lokalbetrieb wirkt ein Slider nicht (die Pumpe ignoriert Reg 00104, Remote Start ueberschreibt
  #   es). Wird er trotzdem bewegt, steht er nach 4 s wieder auf dem Pumpenwert.
  # - Eigene Slider-Aenderungen (gleicher Kontext wie der letzte Lauf) loesen keinen Neustart aus.
  - id: magna3_sync_both_sliders_from_pump
    alias: "MAGNA3: Beide Slider aus Pumpenwert aktualisieren"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.magna3_sollwert_benutzer
        id: pumpe
      - platform: state
        entity_id: sensor.magna3_steuerquelle_code
        id: steuerquelle
      # Meterwert aendert sich auch ohne neuen Prozentwert (Einheit/Bereich nach Regelungsart-
      # Wechsel, oder ein Eingangsregister kommt nach einem Ausfall erst spaeter zurueck)
      - platform: state
        entity_id: sensor.magna3_sollwert_meter
        id: pumpe
      - platform: state
        entity_id:
          - input_number.magna3_sollwert_prozent
          - input_number.magna3_sollwert_meter
        id: slider
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unavailable', 'unknown']
             and (trigger.id != 'slider'
                  or trigger.to_state.context.id != this.context.id) }}
    action:
      - delay: 2
      # Nach einer Slider-Bewegung den Pumpenwert sofort nachlesen statt bis zu 15 s zu warten.
      # Aendert er sich, startet die Automation ueber den Ausloeser "pumpe" neu.
      - if:
          - condition: trigger
            id: slider
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.magna3_sollwert_benutzer
      - repeat:
          while:
            - condition: template
              value_template: >
                {{ [states.input_number.magna3_sollwert_prozent.last_changed,
                    states.input_number.magna3_sollwert_meter.last_changed] | max
                   > now() - timedelta(seconds=4)
                   or is_state('script.magna3_set_sollwert_meter', 'on') }}
          sequence:
            - delay: 1
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.magna3_sollwert_benutzer
            state: ["unavailable", "unknown"]
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_sollwert_prozent
        data:
          value: "{{ states('sensor.magna3_sollwert_benutzer') | float(0) }}"
      # Meter-Slider nur setzen, wenn die Meter-Anzeige gueltig ist (nicht bei Open Loop)
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.magna3_sollwert_meter
                state: ["unavailable", "unknown"]
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.magna3_sollwert_meter
            data:
              value: "{{ states('sensor.magna3_sollwert_meter') | float(0) }}"

  # Einheit, Sensorbereich und Sollwertbereich haengen von der Regelungsart ab
  # (z. B. m bei Proportionaldruck, % bei Konstanter Drehzahl). Sie werden nur
  # alle 5 min abgefragt; bei jedem Wechsel der Regelungsart (auch nach einem
  # Aus/Ein der Pumpe) daher sofort nachlesen.
  - id: magna3_refresh_sensor_config
    alias: "MAGNA3: Sensor-Konfiguration bei Regelungsart-Wechsel nachlesen"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.magna3_regelungsart_code
        not_to: ["unavailable", "unknown"]
    action:
      - delay: 5  # der Pumpe Zeit geben, die Register umzustellen
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_sensor_einheit
            - sensor.magna3_sensor_minimum
            - sensor.magna3_sensor_maximum
            - sensor.magna3_sollwertbereich_min
            - sensor.magna3_sollwertbereich_max

