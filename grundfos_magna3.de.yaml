# ==============================================================================
# AUTOMATIONS - Beispiele
# ==============================================================================
automation:
  # ForcedToLocal-Detektor: Pumpe wurde von Hand am Display oder durch andere
  # nicht-HA-initiierte Aktion auf Lokal gezwungen (Reg 00201 Bit 12).
  - id: magna3_forced_to_local_detected
    alias: "MAGNA3: Pumpe wurde auf Lokal gezwungen"
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_zwang_auf_handbetrieb
        to: 'on'
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3"
          message: >
            Die Pumpe wurde auf Lokal gezwungen (ForcedToLocal-Bit gesetzt).
            HA-Steuerung ist aktuell nicht möglich. Ursache: vermutlich Bedienung
            am Pumpendisplay oder über die Grundfos GO App.
  
  # Alarm-Benachrichtigung
  - id: magna3_alarm_notification
    alias: "MAGNA3: Alarm Benachrichtigung"
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_alarm
        to: 'on'
    action:
      - action: persistent_notification.create
        data:
          title: "🚨 MAGNA3 Alarm"
          message: >
            Code: {{ states('sensor.magna3_alarm_code') }}
            {{ states('sensor.magna3_alarm_text') }}
  
  # Warnung-Benachrichtigung (Reg 00201 Bit 11, orange LED an der Pumpe)
  - id: magna3_warning_notification
    alias: "MAGNA3: Warnung Benachrichtigung"
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_warnung
        to: 'on'
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3 Warnung"
          message: >
            Warnung-Code: {{ states('sensor.magna3_warning_code') }}
            (Pumpe läuft weiter, aber Aufmerksamkeit nötig — z.B. Sensor-Drift
            oder Lager-Service fällig)

  # Warnung bei hohem Strom
  - id: magna3_high_current
    alias: "MAGNA3: Warnung Hoher Strom"
    trigger:
      - platform: numeric_state
        entity_id: sensor.magna3_motorstrom
        above: 5.0
        for:
          minutes: 5
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3 Warnung"
          message: "Motorstrom über 5A: {{ states('sensor.magna3_motorstrom') }} A"
  
  # Sollwert-Sync: Input Number → Modbus. Dafür zuständig, die Werte aus dem Input-Bereich an die Pumpe zu melden
  - id: magna3_sync_setpoint_percent
    alias: "MAGNA3: Sync Sollwert %"
    trigger:
      - platform: state
        entity_id: input_number.magna3_sollwert_prozent
    action:
      - action: script.magna3_set_sollwert_prozent
  
  - id: magna3_sync_setpoint_meter
    alias: "MAGNA3: Sync Sollwert m"
    trigger:
      - platform: state
        entity_id: input_number.magna3_sollwert_meter
    action:
      - action: script.magna3_set_sollwert_meter

  # Nach jedem HA-Start: 30 Sekunden warten (bis Modbus-Daten da sind), dann werden beide Slider/Boxen auf die aktuellen Pumpenwerte gesetzt.
  - id: magna3_sync_slider_on_start
    alias: "MAGNA3: Sollwerte bei Start synchronisieren"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: 30  # Warten bis Modbus-Sensoren geladen
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_sollwert_prozent
        data:
          value: "{{ states('sensor.magna3_sollwert_benutzer') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_sollwert_meter
        data:
          value: "{{ states('sensor.magna3_sollwert_meter') | float(0) }}"
        
  # Trigger ist die Pumpen-Rückmeldung. Wenn der User einen Slider bewegt → Script schreibt zur Pumpe → Pumpe meldet neuen Wert → Slider werden aktualisiert
  - id: magna3_sync_both_sliders_from_pump
    alias: "MAGNA3: Beide Slider aus Pumpenwert aktualisieren"
    trigger:
      - platform: state
        entity_id: sensor.magna3_sollwert_benutzer
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unavailable', 'unknown'] }}
    action:
      - delay: 2
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_sollwert_prozent
        data:
          value: "{{ states('sensor.magna3_sollwert_benutzer') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_sollwert_meter
        data:
          value: "{{ states('sensor.magna3_sollwert_meter') | float(0) }}"

