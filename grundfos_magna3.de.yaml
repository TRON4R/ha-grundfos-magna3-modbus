  #           {{ (value * 10) | int }}
  
  # magna3_set_pid_ti:
  #   alias: "MAGNA3: Ti setzen (EXPERTEN!)"
  #   fields:
  #     ti:
  #       description: "Integralzeit in Sekunden (z.B. 15.0)"
  #       example: "15.0"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 110  # Register 00111
  #         slave: 1
  #         value: >
  #           {% set value = ti | float if ti is defined else states('input_number.magna3_pid_ti') | float %}
  #           {{ (value * 10) | int }}
  
  # magna3_set_pid_direct:
  #   alias: "MAGNA3: Regelrichtung setzen (GEFÄHRLICH!)"
  #   fields:
  #     direct:
  #       description: "0=Invers, 1=Direkt"
