      - name: "MAGNA3 Pumped Volume"
        unique_id: magna3_r00357_volume1
        address: 356  # Register 00357-00358 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "m³"
        device_class: volume
        state_class: total_increasing
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 300
        
      - name: "MAGNA3 Pumped Volume (Direction 2)" # manually added
        unique_id: magna3_r00361_volume2
        address: 360  # Register 00361-00362 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "m³"
