# ==============================================================================
# TEMPLATE BINARY SENSORS - Decode status bits
# ==============================================================================
# The Modbus integration cannot read individual bits,
# so template binary sensors with bit masks are used
template:
  - binary_sensor: # for register 00201
      # Bit 0: LowFlowStop
      - name: "MAGNA3 Low Flow Stop"
        unique_id: magna3_status_low_flow_stop
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(1) > 0 }}
        device_class: running
        icon: mdi:water-off
      
      # Bit 1: CopyToLocal
      - name: "MAGNA3 Copy to Local"
        unique_id: magna3_status_copy_to_local
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(2) > 0 }}
        icon: mdi:content-copy
      
      # Bit 2: MaxFlowLimit Enabled
      - name: "MAGNA3 FlowLimit Active"
        unique_id: magna3_status_flowlimit_enabled
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(4) > 0 }}
        icon: mdi:water-check
      
      # Bit 6: Rotation (pump running)
      - name: "MAGNA3 Running"
        unique_id: magna3_status_rotation
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(64) > 0 }}
        device_class: running
        icon: mdi:pump
      
      # Bit 8: AccessMode (Remote/Local)
      - name: "MAGNA3 Remote Mode"
        unique_id: magna3_status_remote_mode
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(256) > 0 }}
        device_class: connectivity
        icon: mdi:lan-connect
      
      # Bit 9: OnOff
      - name: "MAGNA3 Powered On"
        unique_id: magna3_status_on_off
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(512) > 0 }}
        device_class: power
        icon: mdi:power
      
      # Bit 10: Alarm
      - name: "MAGNA3 Alarm"
        unique_id: magna3_status_alarm
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(1024) > 0 }}
        device_class: problem
        icon: mdi:alert-circle
      
      # Bit 11: Warning
      - name: "MAGNA3 Warning"
        unique_id: magna3_status_warning
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(2048) > 0 }}
        device_class: problem
        icon: mdi:alert
      
      # Bit 12: ForcedToLocal - remote control off, local manual mode on
      - name: "MAGNA3 Forced to Local"
        unique_id: magna3_status_forced_to_local
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(4096) > 0 }}
        device_class: problem
        icon: mdi:hand-back-left
      
      # Bit 13: AtMaxSpeed
      - name: "MAGNA3 At Max Speed"
        unique_id: magna3_status_at_max_speed
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(8192) > 0 }}
        icon: mdi:speedometer
      
      # Bit 15: AtMinSpeed
      - name: "MAGNA3 At Min Speed"
        unique_id: magna3_status_at_min_speed
        availability: "{{ states('sensor.magna3_status_bits_raw') | is_number }}"
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(32768) > 0 }}
        icon: mdi:speedometer

  # ==========================================================================
  # TEMPLATE SENSORS - Computed values and text outputs
  # ==========================================================================

  - sensor:
      # Computes software version and date from BCD values in registers 00034 to 00037
      - name: "MAGNA3 Software Version" 
        unique_id: magna3_software_version
        availability: "{{ states('sensor.magna3_software_version_hi_raw') | is_number and states('sensor.magna3_software_version_lo_raw') | is_number and states('sensor.magna3_software_date_daymonth_raw') | is_number and states('sensor.magna3_software_date_year_raw') | is_number }}"
        state: >
          {% set hi = states('sensor.magna3_software_version_hi_raw') | int(0) %}
          {% set lo = states('sensor.magna3_software_version_lo_raw') | int(0) %}
          {% set dm = states('sensor.magna3_software_date_daymonth_raw') | int(0) %}
          {% set yr = states('sensor.magna3_software_date_year_raw') | int(0) %}
          {% set a = (hi // 4096) | bitwise_and(0x0F) %}
          {% set b = (hi // 256) | bitwise_and(0x0F) %}
          {% set c = (hi // 16) | bitwise_and(0x0F) %}
          {% set d = hi | bitwise_and(0x0F) %}
          {% set e = (lo // 4096) | bitwise_and(0x0F) %}
          {% set f = (lo // 256) | bitwise_and(0x0F) %}
          {% set g = (lo // 16) | bitwise_and(0x0F) %}
          {% set h = lo | bitwise_and(0x0F) %}
          {% set day1 = (dm // 4096) | bitwise_and(0x0F) %}
          {% set day2 = (dm // 256) | bitwise_and(0x0F) %}
          {% set mon1 = (dm // 16) | bitwise_and(0x0F) %}
          {% set mon2 = dm | bitwise_and(0x0F) %}
          {% set y1 = (yr // 4096) | bitwise_and(0x0F) %}
          {% set y2 = (yr // 256) | bitwise_and(0x0F) %}
          {% set y3 = (yr // 16) | bitwise_and(0x0F) %}
          {% set y4 = yr | bitwise_and(0x0F) %}
          {{ a }}{{ b }}.{{ c }}{{ d }}.{{ e }}{{ f }}.{{ g }}{{ h }} ({{ day1 }}{{ day2 }}.{{ mon1 }}{{ mon2 }}.{{ y1 }}{{ y2 }}{{ y3 }}{{ y4 }})
        icon: mdi:information-outline
  
      # Control mode as text
      - name: "MAGNA3 Control Mode"
        unique_id: magna3_control_mode_text
        availability: "{{ states('sensor.magna3_control_mode_code') | is_number }}"
        state: >
          {% set mode = states('sensor.magna3_control_mode_code') | int(0) %}
          {% if mode == 0 %}Constant Speed
          {% elif mode == 1 %}Constant Frequency
          {% elif mode == 3 %}Constant Head
          {% elif mode == 4 %}Constant Pressure
          {% elif mode == 5 %}Const. Diff. Pressure
          {% elif mode == 6 %}Proportional Pressure
          {% elif mode == 7 %}Constant Flow
          {% elif mode == 8 %}Constant Temperature
          {% elif mode == 10 %}Constant Level
          {% elif mode == 128 %}AUTOADAPT
          {% elif mode == 129 %}FLOWADAPT
          {% elif mode == 130 %}Closed-Loop Sensor
          {% elif mode == 131 %}AUTOADAPT(CP)
          {% else %}Unknown ({{ mode }})
          {% endif %}
        icon: mdi:tune
      
      # Operation mode as text
      - name: "MAGNA3 Operation Mode"
        unique_id: magna3_operation_mode_text
        availability: "{{ states('sensor.magna3_operation_mode_code') | is_number }}"
        state: >
          {% set mode = states('sensor.magna3_operation_mode_code') | int(0) %}
          {% if mode == 0 %}Auto-Control
          {% elif mode == 4 %}Open Loop Min
          {% elif mode == 6 %}Open Loop Max
          {% else %}Unknown ({{ mode }})
          {% endif %}
        icon: mdi:cog-outline
      
      # Alarm code as text (most common codes)
      - name: "MAGNA3 Alarm Text"
        unique_id: magna3_alarm_text
        availability: "{{ states('sensor.magna3_alarm_code') | is_number }}"
        state: >
          {% set code = states('sensor.magna3_alarm_code') | int(0) %}
          {% if code == 0 %}No Alarm
          {% elif code == 1 %}Leakage Current
          {% elif code == 2 %}Missing Phase
          {% elif code == 3 %}External Fault
          {% elif code == 4 %}Too Many Restarts
          {% elif code == 32 %}Overvoltage
          {% elif code == 40 %}Undervoltage
          {% elif code == 48 %}Overload
          {% elif code == 49 %}Overcurrent
          {% elif code == 51 %}Blocked Motor
          {% elif code == 57 %}Dry Running
          {% elif code == 64 %}Overtemperature
          {% elif code == 88 %}Sensor Fault
          {% else %}Code {{ code }}
          {% endif %}
        icon: mdi:alert-circle-outline
      
      # Energy cost (adjustable)
      - name: "MAGNA3 Energy Cost"
        unique_id: magna3_energy_cost
        availability: "{{ states('sensor.magna3_energy_consumption') | is_number }}"
        unit_of_measurement: "EUR"
        device_class: monetary
        state_class: total
        state: >
          {{ (states('sensor.magna3_energy_consumption') | float(0) * 0.30) | round(2) }}
        # ↑ Adjust electricity price!
      
      # Calculate efficiency
      - name: "MAGNA3 Efficiency"
        unique_id: magna3_efficiency
        availability: "{{ states('sensor.magna3_power_consumption') | is_number and states('sensor.magna3_volume_flow') | is_number and states('sensor.magna3_head_pressure') | is_number }}"
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set p_elec = states('sensor.magna3_power_consumption') | float(0) %}
          {% set flow = states('sensor.magna3_volume_flow') | float(0) %}
          {% set head = states('sensor.magna3_head_pressure') | float(0) %}
          {% if p_elec > 0 %}
            {% set p_hydr = (flow * head * 2.725) %}
            {{ ((p_hydr / p_elec) * 100) | round(1) }}
          {% else %}0{% endif %}
        icon: mdi:percent
      
      # Convert setpoint to meters (formula verified 2026-02-11)
      - name: "MAGNA3 Actual Setpoint (m)"
        unique_id: magna3_setpoint_meter
        unit_of_measurement: "m"
        device_class: distance
        state_class: measurement
        # Sources are Modbus registers that can drop out intermittently.
        # When sources are missing the sensor becomes "unavailable" the
        # proper way instead of rendering the text "unavailable" in state
        # (invalid for a numeric sensor -> previously turned into "unknown").
        # Only valid while the pump reports in meters (unit 2) and runs a
        # closed-loop mode. In constant speed (0) / frequency (1) it reports range
        # and maximum in %, and the formula would yield nonsense (e.g. "43 m").
        # Every input must be a valid number; a missing value must not count as 0
        # (a missing lower bound 00215 would otherwise give a wrong meter value).
        availability: >
          {% set sp = states('sensor.magna3_user_setpoint') | float(-1) %}
          {% set s_max = states('sensor.magna3_feedback_sensor_max') | float(0) %}
          {% set r_min_pct = states('sensor.magna3_setpoint_range_min') | float(-1) %}
          {% set r_max_pct = states('sensor.magna3_setpoint_range_max') | float(-1) %}
          {% set einheit = states('sensor.magna3_feedback_sensor_unit') | int(-1) %}
          {% set modus = states('sensor.magna3_control_mode_code') | int(-1) %}
          {{ 0 <= sp <= 100 and s_max > 0 and 0 <= r_min_pct < r_max_pct <= 100
             and einheit == 2 and modus not in [-1, 0, 1] }}
        state: >
          {% set sp = states('sensor.magna3_user_setpoint') | float(0) %}
          {% set s_max = states('sensor.magna3_feedback_sensor_max') | float(0) %}
          {% set r_min_pct = states('sensor.magna3_setpoint_range_min') | float(0) %}
          {% set r_max_pct = states('sensor.magna3_setpoint_range_max') | float(0) %}
          {% set rmin = (r_min_pct / 100) * s_max %}
          {% set rmax = (r_max_pct / 100) * s_max %}
          {{ ((sp / 100) * (rmax - rmin) + rmin) | round(2) }}
        icon: mdi:ruler
      
      - name: "MAGNA3 Pump RTC"
        unique_id: magna3_pump_rtc_formatted
        availability: "{{ states('sensor.magna3_pump_unix_rtc') | is_number }}"
        device_class: timestamp
        state: >
          {{ states('sensor.magna3_pump_unix_rtc') | int(0) | as_datetime }}


      - name: "MAGNA3 Flow Estimation State Text"
        unique_id: magna3_flow_estimation_text
        availability: "{{ states('sensor.magna3_flow_estimation_state') | is_number }}"
        state: >
          {% set status = states('sensor.magna3_flow_estimation_state') | int(0) %}
          {% if status == 0 %}Within range
          {% elif status == 1 %}Below range
          {% elif status == 2 %}Above range
          {% else %}Unknown ({{ status }})
          {% endif %}
        icon: mdi:chart-bell-curve

        # Control source as text
      - name: "MAGNA3 Control Source"
        unique_id: magna3_control_source_text
        availability: "{{ states('sensor.magna3_control_source_code') | is_number }}"
        state: >
          {% set source = states('sensor.magna3_control_source_code') | int(0) %}
          {% if source == 1 %}Display
          {% elif source == 2 %}Home Assistant via Modbus/TCP
          {% elif source == 3 %}Grundfos GO App
          {% elif source == 4 %}Digital Input
          {% elif source == 5 %}OFF Button
          {% else %}Unknown ({{ source }})
          {% endif %}
        icon: >
          {% set source = states('sensor.magna3_control_source_code') | int(0) %}
          {% if source == 1 %}mdi:monitor
          {% elif source == 2 %}mdi:ethernet
          {% elif source == 3 %}mdi:cellphone-wireless
          {% elif source == 4 %}mdi:electric-switch
          {% elif source == 5 %}mdi:power-off
          {% else %}mdi:help-circle
          {% endif %}


      - name: "MAGNA3 Months To Bearing Service"
        unique_id: magna3_months_to_bearing_service
        unit_of_measurement: "mon"
        state_class: measurement
        # device_class: (omitted)  # HA has no duration device_class for "months"
        availability: >
          {{ states('sensor.magna3_bearing_service_raw') | is_number
             and (states('sensor.magna3_bearing_service_raw') | int) | bitwise_and(0xFF) != 255 }}
        state: >
          {{ (states('sensor.magna3_bearing_service_raw') | int(0)) | bitwise_and(0xFF) }}

      - name: "MAGNA3 Bearing Service Type"
        unique_id: magna3_bearing_service_type
        availability: "{{ states('sensor.magna3_bearing_service_raw') | is_number }}"
        state: >
          {% set v = states('sensor.magna3_bearing_service_raw') | int(0) %}
          {% set t = (v // 256) | bitwise_and(0x01) %}
          {{ 'Lubricate bearings' if t == 0 else 'Change bearings' }}
        # device_class: (omitted)  # Text status
        # state_class: (omitted)   # Text status

      - name: "MAGNA3 Drive State"
        unique_id: magna3_drive_state_text
        availability: "{{ states('sensor.magna3_drive_state_code') | is_number }}"
        state: >
          {% set s = states('sensor.magna3_drive_state_code') | int(-1) %}
          {% if s == 0 %}Stopped
          {% elif s == 1 %}Accelerating
          {% elif s == 2 %}Decelerating
          {% elif s == 3 %}Steady state / closed loop
          {% elif s == 5 %}Accelerating halt
          {% elif s == 6 %}Decelerating halt
          {% elif s == 7 %}Start on the run (flying cut-in)
          {% else %}Code {{ s }}
          {% endif %}
        # device_class: (omitted)  # Text status
        # state_class: (omitted)   # Text status


      # --- Flow sensor natively shows m³/h. E.g. Lambda heat pump uses L/h ---
      # --- This template sensor mirrors the original Modbus sensor in L/h for easier comparison in graphs ---
      - name: "MAGNA3 Flow Rate L/h"
        unique_id: magna3_flow_rate_lh
        unit_of_measurement: "L/h"
        state: "{{ (states('sensor.magna3_volume_flow') | float(0) * 1000) | round(0) }}"
        device_class: volume_flow_rate
        state_class: measurement

# ==============================================================================
# INPUT NUMBERS - UI Controls
# ==============================================================================
input_number:
  magna3_setpoint_percent:
    name: "MAGNA3 Setpoint (%)"
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: "%"
    icon: mdi:percent
    mode: slider # alternatively "box" mode is possible
  
  magna3_setpoint_m:
    name: "MAGNA3 Setpoint (m)"
    min: 0
    max: 10  # increase for pumps with a higher head
    step: 0.1
    unit_of_measurement: "m"
    icon: mdi:ruler
    mode: slider # alternatively "box" mode is possible
  
  magna3_control_mode:
    name: "MAGNA3 Control Mode (Code)"
    min: 0
    max: 131
    step: 1
    icon: mdi:cog
    mode: box
  
  # --- Optional: Set FLOWLIMIT (Register 00106) ---
  # WARNING: Only enable if FLOWADAPT or EnableMaxFlowLimit is used!
  # magna3_max_flow_limit:
  #   name: "MAGNA3 Max Flow Limit"
  #   min: 0
  #   max: 90  # 0-90% of Qmax or 0-9.0 m³/h (depending on pump)
  #   step: 0.1
  #   unit_of_measurement: "m³/h"
  #   # no state_class: measurement, this is a setpoint not a statistic
  #   icon: mdi:water-check
  #   mode: slider
  
  # ============================================================================
  # WARNING: PID PARAMETERS - EXPERTS ONLY!
  # ============================================================================
  # The following registers (00110-00112) control the pump PID controller.
  # Grundfos has optimally set these values at the factory!
  # 
  # RISKS of changing:
  # - Unstable control (pump cycles, oscillates)
  # - Mechanical stress, motor overload
  # - Wrong control direction (00112): CATASTROPHIC malfunction!
  # - Setpoint not reached
  # - Difficult to reverse
  # 
  # ONLY ENABLE if:
  # - Explicitly recommended by Grundfos support
  # - Hydraulics have been significantly changed
  # - Under observation with measuring instruments!
  # ============================================================================
  
  # --- PID parameters (EXPERTS ONLY, commented out!) ---
  # magna3_pid_kp:
  #   name: "MAGNA3 Kp (P-Gain)"
  #   min: 0
  #   max: 10.0
  #   step: 0.1
  #   icon: mdi:sine-wave
  #   mode: box
  #   # Register 00110, Skalierung 0.1
  #   # Default: Pumpen-spezifisch (z.B. 1.5)
  #   # Too high: overshoot, oscillation
  #   # Too low: sluggish control
  
  # magna3_pid_ti:
  #   name: "MAGNA3 Ti (Integral Time)"
  #   min: 0
  #   max: 100.0
  #   step: 0.1
  #   unit_of_measurement: "s"
  #   icon: mdi:timer-outline
  #   mode: box
  #   # Register 00111, Skalierung 0.1 s
  #   # Default: 10-30s (pumpen-spezifisch)
  #   # Too small: fast integration, overshoot
  #   # Too large: slow settling
  
  # magna3_pid_direct:
  #   name: "MAGNA3 Control Direction"
  #   min: 0
  #   max: 1
  #   step: 1
  #   icon: mdi:swap-vertical
  #   mode: box
  #   # Register 00112
  #   # 0 = Inverse (default): Sensor up -> Pump down
  #   # 1 = Direct: Sensor up -> Pump up
  #   # WARNING: Wrong setting = pump controls in reverse!

# ==============================================================================
# SCRIPTS - Pump Control
# ==============================================================================
script:
  # Set setpoint in %
  magna3_set_setpoint_percent:
    alias: "MAGNA3: Set Setpoint (%)"
    fields:
      prozent:
        description: "Setpoint in percent (0-100)"
        example: "45.5"
    sequence:
      - variables:
          wert: >
            {{ prozent | float(-1) if prozent is defined
               else states('input_number.magna3_setpoint_percent') | float(-1) }}
      # Do not write values outside 0-100 % (e.g. from a direct script call)
      - condition: template
        value_template: "{{ 0 <= wert <= 100 }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 103  # Register 00104
          slave: 1
          value: "{{ (wert * 100) | round(0) | int }}"
  
  # The meter conversion needs the unit and ranges of the active control mode. "Refresh
  # Sensor Config on Control Mode Change" only re-reads them 5 s after a change. So the
  # script waits until 7 s after the change (the requested value is kept), otherwise it
  # would convert with the previous control mode's range.
  # restart: a new input during the wait replaces the old one.
  magna3_set_setpoint_m:
    alias: "MAGNA3: Set Setpoint (m)"
    mode: restart
    fields:
      meter:
        description: "Setpoint in meters (e.g. 4.0)"
        example: "4.0"
    sequence:
      - variables:
          m: "{{ meter | float if meter is defined else states('input_number.magna3_setpoint_m') | float }}"
      - delay:
          milliseconds: >
            {{ ([0, 7 - (now() - states.sensor.magna3_control_mode_code.last_changed).total_seconds()]
                | max * 1000) | int }}
      - variables:
          s_max: "{{ states('sensor.magna3_feedback_sensor_max') | float(0) }}"
          r_min_pct: "{{ states('sensor.magna3_setpoint_range_min') | float(-1) }}"
          r_max_pct: "{{ states('sensor.magna3_setpoint_range_max') | float(-1) }}"
          einheit: "{{ states('sensor.magna3_feedback_sensor_unit') | int(-1) }}"
          modus: "{{ states('sensor.magna3_control_mode_code') | int(-1) }}"
      # Only convert when all inputs are valid (no fallback 0),
      # the pump reports in meters and runs closed loop
      - condition: template
        value_template: >
          {{ s_max > 0 and 0 <= r_min_pct < r_max_pct <= 100
             and einheit == 2 and modus not in [-1, 0, 1] }}
      - variables:
          rmin: "{{ (r_min_pct / 100) * s_max }}"
          rmax: "{{ (r_max_pct / 100) * s_max }}"
          prozent: "{{ ((m - rmin) / (rmax - rmin)) * 100 }}"
      # Abort outside 0-100 % instead of clamping: such a value means the input
      # data is wrong, and clamping would have written 0 %.
      - condition: template
        value_template: "{{ 0 <= prozent <= 100 }}"
      - variables:
          reg_value: "{{ (prozent * 100) | round(0) | int }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 103  # Register 00104
          slave: 1
          value: "{{ reg_value }}"
      # Re-read the pump value so the sliders show the written value right away
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.magna3_user_setpoint
  
  # Set control mode
  magna3_set_control_mode:
    alias: "MAGNA3: Set Control Mode"
    # restart: a second click within the 2 s re-read time is executed instead of dropped
    mode: restart
    fields:
      mode:
        description: "Mode code (6=Prop, 128=AUTO, 129=FLOW)"
        example: "128"
    sequence:
      - variables:
          code: >
            {{ mode | int(-1) if mode is defined
               else states('input_number.magna3_control_mode') | int(-1) }}
      # Only write control modes listed for reg 00102 (Grundfos 98367081)
      - condition: template
        value_template: "{{ code in [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 128, 129, 130, 131] }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 101  # Register 00102
          slave: 1
          value: "{{ code }}"
      # Re-read the active control mode right away (otherwise up to 30 s) so the dashboard switches at once.
      # Also the setpoint (reg 00338): the pump keeps a separate setpoint per control mode,
      # otherwise the sliders show the previous mode's setpoint for up to 15 s.
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_control_mode_code
            - sensor.magna3_user_setpoint
  
  # Pre-load the bus context before the pump switches to Remote (internal,
  # called by Remote Start, Remote Stop, Reset Alarm and "Save Settings").
  # The request registers 00102 (control mode), 00103 (operation mode) and 00104
  # (setpoint) read 0 after every power cycle of the pump. Without pre-loading,
  # the pump would run in Remote with control mode 0 (constant speed) and a 0 %
  # setpoint, and a subsequent "Save Settings" would store that permanently in the
  # EEPROM. So the active values (reg 00203, 00204, 00338) are read fresh and
  # copied into the request registers; after the switch the pump keeps running
  # exactly as before.
  # If the pump is already in Remote, the request registers already hold HA's
  # values; then nothing is written (otherwise a value not yet re-read could undo
  # a change just made). Returns {"ok": true/false}.
  magna3_prepare_remote:
    alias: "MAGNA3: Prepare Remote (internal)"
    # queued: two near-simultaneous calls (e.g. Start and Stop) run one after the other
    # instead of the second being dropped as "already running"
    mode: queued
    sequence:
      # Read fresh instead of using values up to 30 s old
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_control_mode_code
            - sensor.magna3_operation_mode_code
            - sensor.magna3_user_setpoint
      - variables:
          status: "{{ states('sensor.magna3_status_bits_raw') | int(-1) }}"
          ist_remote: "{{ status >= 0 and status | bitwise_and(256) > 0 }}"
          modus: "{{ states('sensor.magna3_control_mode_code') | int(-1) }}"
          betrieb: "{{ states('sensor.magna3_operation_mode_code') | int(-1) }}"
          sollwert: "{{ states('sensor.magna3_user_setpoint') | float(-1) }}"
          werte_ok: >
            {{ modus in [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 128, 129, 130, 131]
               and betrieb in [0, 4, 6] and 0 <= sollwert <= 100 }}
          ok: "{{ status >= 0 and (ist_remote or werte_ok) }}"
          ergebnis: "{{ {'ok': ok} }}"
      - if:
          - condition: template
            value_template: "{{ not ok }}"
        then:
          - action: persistent_notification.create
            data:
              title: "MAGNA3"
              message: >-
                Switch to Remote aborted: the pump's status, control mode, operation
                mode or setpoint is currently unavailable. Please try again in a minute.
      - if:
          - condition: template
            value_template: "{{ ok and not ist_remote }}"
        then:
          - action: modbus.write_register
            data:
              hub: Grundfos_MAGNA3
              address: 101  # Register 00102 = active control mode
              slave: 1
              value: "{{ modus }}"
          - action: modbus.write_register
            data:
              hub: Grundfos_MAGNA3
              address: 102  # Register 00103 = active operation mode
              slave: 1
              value: "{{ betrieb }}"
          - action: modbus.write_register
            data:
              hub: Grundfos_MAGNA3
              address: 103  # Register 00104 = active setpoint
              slave: 1
              value: "{{ (sollwert * 100) | round(0) | int }}"
      - stop: "Remote prepared"
        response_variable: ergebnis

  # Remote Start
  magna3_start_remote:
    alias: "MAGNA3: Remote Start"
    sequence:
      - action: script.magna3_prepare_remote
        response_variable: vorbereitung
      - condition: template
        value_template: "{{ vorbereitung.ok }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100  # Register 00101
          slave: 1
          value: 3  # Remote(1) + On(1)
      # Re-read status right away (otherwise up to 30 s) so the dashboard switches at once
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_control_source_code

  # Remote Stop
  magna3_stop_remote:
    alias: "MAGNA3: Remote Stop"
    sequence:
      - action: script.magna3_prepare_remote
        response_variable: vorbereitung
      - condition: template
        value_template: "{{ vorbereitung.ok }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 1  # Remote(1) + Off(0)
      # Re-read status right away (otherwise up to 30 s) so the dashboard switches at once
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_control_source_code

  # Switch to local (discard bus setpoint, pump reverts to stored EEPROM setpoint)
  magna3_to_local:
    alias: "MAGNA3: Switch to Local"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 0  # Local(0)
      # Re-read status right away (otherwise up to 30 s) so the dashboard switches at once
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_control_source_code

  # Switch to local AND copy current bus setpoint into pump EEPROM.
  # Mechanism per Grundfos doc 98367081 (reg 00101 bit 4 "CopyToLocal"):
  # Control Context (mode, op-mode, on/off, setpoint) is copied from remote
  # to local on the Remote->Local transition when bit 4 is set.
  # Two-step variant: arm bit 4 while still in Remote, give the pump a polling
  # window, then perform the Remote->Local transition. Single-write 3 -> 16
  # proved unreliable on real MAGNA3 firmware (the pump did not always see
  # CopyToLocal as active during the same poll cycle as the bit-0 fall).
  # The pump is always switched on (19 = On): a stored "Off" would leave the
  # heating circuit pump standing after control ends; it could then only be started
  # at the pump display or via Grundfos GO, not by the heat pump.
  # In local mode step 1 first switches to Remote; so that the request registers
  # (0 after a power cycle) do not end up in the EEPROM, the bus context is
  # pre-loaded first (as for Remote Start).
  magna3_to_local_copy:
    alias: "MAGNA3: Switch to Local (adopt setpoint)"
    sequence:
      - action: script.magna3_prepare_remote
        response_variable: vorbereitung
      - condition: template
        value_template: "{{ vorbereitung.ok }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100  # Register 00101
          slave: 1
          value: 19  # Remote(1) + On(1) + CopyToLocal(1) — arm bit 4 while still in Remote
      - delay:
          milliseconds: 500
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 16  # Local(0) + CopyToLocal(1) — Remote->Local edge triggers EEPROM copy
      - delay: 2
      # Re-read status right away (otherwise up to 30 s) so the dashboard switches at once
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_control_source_code
            - sensor.magna3_control_mode_code
            - sensor.magna3_user_setpoint
      # Wait briefly until the control mode text and meter sensor show the freshly read values
      - delay: 1
      # Notification with the values the pump now has locally (= the adopted ones)
      - action: persistent_notification.create
        data:
          title: "MAGNA3"
          message: >-
            {% set sw = states('sensor.magna3_user_setpoint') %}
            {% set m = states('sensor.magna3_actual_setpoint_m') %}
            MAGNA3 is back under local control via the pump display.
            Adopted: control mode {{ states('sensor.magna3_control_mode') }}
            and setpoint
            {{ (sw | float | round(1) | string) ~ ' %' if sw | is_number else 'unknown' -}}
            {{ ' (' ~ (m | float | round(2) | string) ~ ' m)' if m | is_number else '' }}.

  # Alarm Reset (switches the pump to Remote and on)
  magna3_reset_alarm:
    alias: "MAGNA3: Reset Alarm"
    sequence:
      # The reset switches the pump to Remote, so pre-load the bus context first
      - action: script.magna3_prepare_remote
        response_variable: vorbereitung
      - condition: template
        value_template: "{{ vorbereitung.ok }}"
      # Rising Edge: 0 → 1
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 7  # Remote(1) + On(1) + ResetAlarm(1)
      - delay: 2
      # Only clear the ResetAlarm bit if nobody else has written reg 00101 since (Stop,
      # Local, Save or another automation). Otherwise e.g. a Stop within these 2 s would
      # be undone by writing 3 (Remote + On).
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.magna3_control_register_00101_raw
      - if:
          - condition: state
            entity_id: sensor.magna3_control_register_00101_raw
            state: "7"
        then:
          - action: modbus.write_register
            data:
              hub: Grundfos_MAGNA3
              address: 100
              slave: 1
              value: 3  # Back to Remote + On
      # Re-read status right away (otherwise up to 30 s) so the dashboard switches at once
      - delay: 2
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_status_bits_raw
            - sensor.magna3_control_source_code
      # Notification with the actual state (a Stop within the 2 s after the reset still applies)
      - action: persistent_notification.create
        data:
          title: "MAGNA3"
          message: >-
            {% set s = states('sensor.magna3_status_bits_raw') | int(-1) %}
            Alarm reset performed.
            {% if s < 0 %}Pump state currently not readable.
            {%- else %}Pump now:
            {{ 'under HA control' if s | bitwise_and(256) > 0 else 'under local control' }},
            {{ 'switched on' if s | bitwise_and(512) > 0 else 'stopped' }}.
            {%- endif %}

  # Enable AUTOADAPT
  magna3_enable_autoadapt:
    alias: "MAGNA3: Enable AUTOADAPT"
    sequence:
      - action: script.magna3_set_control_mode
        data:
          mode: 128

  # Enable FLOWADAPT
  magna3_enable_flowadapt:
    alias: "MAGNA3: Enable FLOWADAPT"
    sequence:
      - action: script.magna3_set_control_mode
        data:
          mode: 129

  # Enable proportional pressure
  magna3_enable_proportional:
    alias: "MAGNA3: Enable Proportional Pressure"
    sequence:
      - action: script.magna3_set_control_mode
        data:
          mode: 6

  # Enable constant pressure
  magna3_enable_constant_pressure:
    alias: "MAGNA3: Enable Constant Pressure"
    sequence:
      - action: script.magna3_set_control_mode
        data:
          mode: 4
  
  # --- Optional: Set FLOWLIMIT (Register 00106) ---
  # NOTE: This script is not operated from the UI — the corresponding
  # input_number above is deliberately commented out. The fallback below
  # only applies if it is enabled; otherwise the script aborts cleanly.
  # Call with an explicit parameter, e.g.:
  #   action: script.magna3_set_max_flow_limit
  #   data:
  #     limit_m3h: 2.5  # Max. flow rate in m³/h
  magna3_set_max_flow_limit:
    alias: "MAGNA3: Set Max Flow Limit"
    fields:
      limit_m3h:
        description: "Max flow in m3/h (e.g. 2.5)"
        example: "2.5"
    variables:
      limit: >
        {% if limit_m3h is defined %}
          {{ limit_m3h | float(-1) }}
        {% else %}
          {{ states('input_number.magna3_max_flow_limit') | float(-1) }}
        {% endif %}
    sequence:
      # Abort cleanly without a valid value instead of writing 0 m3/h as the limit.
      # (numeric_state is not an option: it needs an entity_id, limit is a variable.)
      - condition: template
        value_template: "{{ limit | float(-1) >= 0 }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 105  # Register 00106
          slave: 1
          value: "{{ (limit | float(0) * 100) | int }}"

  # --- WARNING: PID parameters - EXPERTS ONLY! ---
  # magna3_set_pid_kp:
  #   alias: "MAGNA3: Set Kp (EXPERTS!)"
  #   fields:
  #     kp:
  #       description: "Proportional gain (e.g. 1.5)"
  #       example: "1.5"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 109  # Register 00110
  #         slave: 1
  #         value: >
  #           {% set value = kp | float if kp is defined else states('input_number.magna3_pid_kp') | float %}
  #           {{ (value * 10) | int }}
  
  # magna3_set_pid_ti:
  #   alias: "MAGNA3: Set Ti (EXPERTS!)"
  #   fields:
  #     ti:
  #       description: "Integral time in seconds (e.g. 15.0)"
  #       example: "15.0"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 110  # Register 00111
  #         slave: 1
  #         value: >
  #           {% set value = ti | float if ti is defined else states('input_number.magna3_pid_ti') | float %}
  #           {{ (value * 10) | int }}
  
  # magna3_set_pid_direct:
  #   alias: "MAGNA3: Set Control Direction (DANGEROUS!)"
  #   fields:
  #     direct:
  #       description: "0=Inverse, 1=Direct"
  #       example: "0"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 111  # Register 00112
  #         slave: 1
  #         value: >
  #           {% set value = direct | int if direct is defined else states('input_number.magna3_pid_direct') | int %}
  #           {{ value }}

# ==============================================================================
# AUTOMATIONS - Examples
# ==============================================================================
automation:
  # ForcedToLocal detector: the pump was forced into local mode by something
  # other than HA (manual operation at the pump display, GO app, etc.).
  # Reg 00201 bit 12.
  - id: magna3_forced_to_local_detected
    alias: "MAGNA3: Pump forced to local"
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_forced_to_local
        to: 'on'
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3"
          message: >
            Pump has been forced into local mode (ForcedToLocal bit set).
            HA control is currently not possible. Likely cause: someone
            interacted with the pump display or the Grundfos GO app.
  
  # Alarm notification
  # Status bit and alarm code are read separately: re-read the code before notifying.
  # If the code changes while the alarm is active, the same notification (notification_id) is updated.
  - id: magna3_alarm_notification
    alias: "MAGNA3: Alarm Notification"
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_alarm
        to: 'on'
      - platform: state
        entity_id: sensor.magna3_alarm_code
        not_to: ['unavailable', 'unknown', '0']
    condition:
      - condition: state
        entity_id: binary_sensor.magna3_alarm
        state: 'on'
    action:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.magna3_alarm_code
      - action: persistent_notification.create
        data:
          notification_id: magna3_alarm
          title: "🚨 MAGNA3 Alarm"
          message: >
            Code: {{ states('sensor.magna3_alarm_code') }}
            {{ states('sensor.magna3_alarm_text') }}
  
  # Warning notification (Reg 00201 bit 11, orange LED on the pump)
  # As for the alarm: re-read the code, code changes update the same notification.
  - id: magna3_warning_notification
    alias: "MAGNA3: Warning Notification"
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_warning
        to: 'on'
      - platform: state
        entity_id: sensor.magna3_warning_code
        not_to: ['unavailable', 'unknown', '0']
    condition:
      - condition: state
        entity_id: binary_sensor.magna3_warning
        state: 'on'
    action:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.magna3_warning_code
      - action: persistent_notification.create
        data:
          notification_id: magna3_warning
          title: "⚠️ MAGNA3 Warning"
          message: >
            Warning code: {{ states('sensor.magna3_warning_code') }}
            (Pump continues to run, but attention is needed — e.g. sensor
            drift or bearing service due)

  # High current warning
  - id: magna3_high_current
    alias: "MAGNA3: High Current Warning"
    trigger:
      - platform: numeric_state
        entity_id: sensor.magna3_motor_current
        above: 5.0
        for:
          minutes: 5
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3 Warning"
          message: "Motor current above 5A: {{ states('sensor.magna3_motor_current') }} A"
  
  # Setpoint sync: Input Number -> Modbus. Sends UI values to the pump
  # Writes only when the slider differs from the pump value. When the automation
  # "Update Both Sliders from Pump Value" sets a slider to the pump value, no echo
  # write back to the pump happens. Nothing is written while the pump value is
  # unavailable either.
  - id: magna3_sync_setpoint_percent
    alias: "MAGNA3: Sync Setpoint %"
    trigger:
      - platform: state
        entity_id: input_number.magna3_setpoint_percent
    condition:
      - condition: template
        value_template: >
          {% set pumpe = states('sensor.magna3_user_setpoint') | float(none) %}
          {{ pumpe is not none
             and (trigger.to_state.state | float(0) - pumpe) | abs > 0.05 }}
    action:
      - action: script.magna3_set_setpoint_percent

  - id: magna3_sync_setpoint_meter
    alias: "MAGNA3: Sync Setpoint m"
    mode: restart  # the script may wait up to 7 s; the last input wins
    trigger:
      - platform: state
        entity_id: input_number.magna3_setpoint_m
    condition:
      - condition: template
        value_template: >
          {% set pumpe = states('sensor.magna3_actual_setpoint_m') | float(none) %}
          {{ pumpe is not none
             and (trigger.to_state.state | float(0) - pumpe) | abs > 0.005 }}
    action:
      - action: script.magna3_set_setpoint_m

  # After each HA start: wait 30s for Modbus data, then set both sliders to current pump values.
  # A slider is only set when its pump value is available; otherwise it would jump to 0.
  - id: magna3_sync_slider_on_start
    alias: "MAGNA3: Sync Setpoints on Start"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: 30  # Wait for Modbus sensors to load
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.magna3_user_setpoint
                state: ["unavailable", "unknown"]
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.magna3_setpoint_percent
            data:
              value: "{{ states('sensor.magna3_user_setpoint') | float(0) }}"
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.magna3_actual_setpoint_m
                state: ["unavailable", "unknown"]
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.magna3_setpoint_m
            data:
              value: "{{ states('sensor.magna3_actual_setpoint_m') | float(0) }}"

  # Rule: 4 s after the last slider move, both sliders show the pump value.
  # Triggers: new pump report, local/remote switch and slider moves from elsewhere.
  # - The pump is only polled every 15 s. After a slider move, reg 00338 is therefore re-read 2 s later
  #   (gauges switch at once). While a slider was moved within the last 4 s (user still adjusting), it is
  #   not overwritten; otherwise it used to jump back to a stale intermediate value.
  # - In local mode a slider has no effect (the pump ignores reg 00104, Remote Start overwrites it).
  #   If it is moved anyway, it shows the pump value again after 4 s.
  # - The automation's own slider changes (same context as its last run) do not restart it.
  - id: magna3_sync_both_sliders_from_pump
    alias: "MAGNA3: Update Both Sliders from Pump Value"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.magna3_user_setpoint
        id: pump
      - platform: state
        entity_id: sensor.magna3_control_source_code
        id: control_source
      # The meter value also changes without a new percent value (unit/range after a
      # control mode change, or an input register returning later after an outage)
      - platform: state
        entity_id: sensor.magna3_actual_setpoint_m
        id: pump
      - platform: state
        entity_id:
          - input_number.magna3_setpoint_percent
          - input_number.magna3_setpoint_m
        id: slider
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unavailable', 'unknown']
             and (trigger.id != 'slider'
                  or trigger.to_state.context.id != this.context.id) }}
    action:
      - delay: 2
      # After a slider move, re-read the pump value right away instead of waiting up to 15 s.
      # If it changes, the automation restarts via the "pump" trigger.
      - if:
          - condition: trigger
            id: slider
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.magna3_user_setpoint
      - repeat:
          while:
            - condition: template
              value_template: >
                {{ [states.input_number.magna3_setpoint_percent.last_changed,
                    states.input_number.magna3_setpoint_m.last_changed] | max
                   > now() - timedelta(seconds=4)
                   or is_state('script.magna3_set_setpoint_m', 'on') }}
          sequence:
            - delay: 1
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.magna3_user_setpoint
            state: ["unavailable", "unknown"]
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_setpoint_percent
        data:
          value: "{{ states('sensor.magna3_user_setpoint') | float(0) }}"
      # Only set the meter slider while the meter value is valid (not in open loop)
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: sensor.magna3_actual_setpoint_m
                state: ["unavailable", "unknown"]
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.magna3_setpoint_m
            data:
              value: "{{ states('sensor.magna3_actual_setpoint_m') | float(0) }}"

  # Unit, sensor range and setpoint range depend on the control mode (e.g. m in
  # proportional pressure, % in constant speed). They are only polled every
  # 5 min, so re-read them right away on every control mode change (including
  # after a power cycle of the pump).
  - id: magna3_refresh_sensor_config
    alias: "MAGNA3: Refresh Sensor Config on Control Mode Change"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.magna3_control_mode_code
        not_to: ["unavailable", "unknown"]
    action:
      - delay: 5  # give the pump time to switch the registers
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.magna3_feedback_sensor_unit
            - sensor.magna3_feedback_sensor_min
            - sensor.magna3_feedback_sensor_max
            - sensor.magna3_setpoint_range_min
            - sensor.magna3_setpoint_range_max

