        scan_interval: 300
      
      # --- Optional: With external pressure sensor ---
      # - name: "MAGNA3 Remote Pressure 1"
      #   unique_id: magna3_r00316_remote_pressure1
      #   address: 315  # Register 00316
      #   input_type: input
