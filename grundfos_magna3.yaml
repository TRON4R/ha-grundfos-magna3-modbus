      - name: "MAGNA3 Energy Consumption"
        unique_id: magna3_r00332_energy
        address: 331  # Register 00332-00333 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        slave: 1
        scan_interval: 300
      
      - name: "MAGNA3 Number of Starts"
        unique_id: magna3_r00334_number_of_starts
        address: 333  # Register 00334-00335 (32-bit)
        input_type: input
        data_type: uint32
        state_class: total_increasing
        slave: 1
        scan_interval: 300
      
      - name: "MAGNA3 User Setpoint"
        unique_id: magna3_r00338_user_setpoint
        address: 337  # Register 00338
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        state_class: measurement
