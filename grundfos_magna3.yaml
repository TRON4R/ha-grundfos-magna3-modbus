# ==============================================================================
# TEMPLATE BINARY SENSORS - Decode status bits
# ==============================================================================
# The Modbus integration cannot read individual bits,
# so template binary sensors with bit masks are used
template:
  - binary_sensor: # for register 00201
      # Bit 0: LowFlowStop
      - name: "MAGNA3 Low Flow Stop"
        unique_id: magna3_status_low_flow_stop
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(1) > 0 }}
        device_class: running
        icon: mdi:water-off
      
      # Bit 1: CopyToLocal
      - name: "MAGNA3 Copy to Local"
        unique_id: magna3_status_copy_to_local
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(2) > 0 }}
        icon: mdi:content-copy
      
      # Bit 2: MaxFlowLimit Enabled
      - name: "MAGNA3 FlowLimit Active"
        unique_id: magna3_status_flowlimit_enabled
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(4) > 0 }}
        icon: mdi:water-check
      
      # Bit 6: Rotation (pump running)
      - name: "MAGNA3 Running"
        unique_id: magna3_status_rotation
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(64) > 0 }}
        device_class: running
        icon: mdi:pump
      
      # Bit 8: AccessMode (Remote/Local)
      - name: "MAGNA3 Remote Mode"
        unique_id: magna3_status_remote_mode
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(256) > 0 }}
        device_class: connectivity
        icon: mdi:lan-connect
      
      # Bit 9: OnOff
      - name: "MAGNA3 Powered On"
        unique_id: magna3_status_on_off
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(512) > 0 }}
        device_class: power
        icon: mdi:power
      
      # Bit 10: Alarm
      - name: "MAGNA3 Alarm"
        unique_id: magna3_status_alarm
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(1024) > 0 }}
        device_class: problem
        icon: mdi:alert-circle
      
      # Bit 11: Warning
      - name: "MAGNA3 Warning"
        unique_id: magna3_status_warning
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(2048) > 0 }}
        device_class: problem
        icon: mdi:alert
      
      # Bit 12: ForcedToLocal - remote control off, local manual mode on
      - name: "MAGNA3 Forced to Local"
        unique_id: magna3_status_forced_to_local
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(4096) > 0 }}
        device_class: problem
        icon: mdi:hand-back-left
      
      # Bit 13: AtMaxSpeed
      - name: "MAGNA3 At Max Speed"
        unique_id: magna3_status_at_max_speed
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(8192) > 0 }}
        icon: mdi:speedometer
      
      # Bit 15: AtMinSpeed
      - name: "MAGNA3 At Min Speed"
        unique_id: magna3_status_at_min_speed
        state: >
          {{ states('sensor.magna3_status_bits_raw') | int(0) | bitwise_and(32768) > 0 }}
        icon: mdi:speedometer

  # ==========================================================================
  # TEMPLATE SENSORS - Computed values and text outputs
  # ==========================================================================

  - sensor:
      # Computes software version and date from BCD values in registers 00034 to 00037
      - name: "MAGNA3 Software Version" 
        unique_id: magna3_software_version
        state: >
          {% set hi = states('sensor.magna3_software_version_hi_raw') | int(0) %}
          {% set lo = states('sensor.magna3_software_version_lo_raw') | int(0) %}
          {% set dm = states('sensor.magna3_software_date_daymonth_raw') | int(0) %}
          {% set yr = states('sensor.magna3_software_date_year_raw') | int(0) %}
          {% set a = (hi // 4096) | bitwise_and(0x0F) %}
          {% set b = (hi // 256) | bitwise_and(0x0F) %}
          {% set c = (hi // 16) | bitwise_and(0x0F) %}
          {% set d = hi | bitwise_and(0x0F) %}
          {% set e = (lo // 4096) | bitwise_and(0x0F) %}
          {% set f = (lo // 256) | bitwise_and(0x0F) %}
          {% set g = (lo // 16) | bitwise_and(0x0F) %}
          {% set h = lo | bitwise_and(0x0F) %}
          {% set day1 = (dm // 4096) | bitwise_and(0x0F) %}
          {% set day2 = (dm // 256) | bitwise_and(0x0F) %}
          {% set mon1 = (dm // 16) | bitwise_and(0x0F) %}
          {% set mon2 = dm | bitwise_and(0x0F) %}
          {% set y1 = (yr // 4096) | bitwise_and(0x0F) %}
          {% set y2 = (yr // 256) | bitwise_and(0x0F) %}
          {% set y3 = (yr // 16) | bitwise_and(0x0F) %}
          {% set y4 = yr | bitwise_and(0x0F) %}
          {{ a }}{{ b }}.{{ c }}{{ d }}.{{ e }}{{ f }}.{{ g }}{{ h }} ({{ day1 }}{{ day2 }}.{{ mon1 }}{{ mon2 }}.{{ y1 }}{{ y2 }}{{ y3 }}{{ y4 }})
        icon: mdi:information-outline
  
      # Control mode as text
      - name: "MAGNA3 Control Mode"
        unique_id: magna3_control_mode_text
        state: >
          {% set mode = states('sensor.magna3_control_mode_code') | int(0) %}
          {% if mode == 0 %}Constant Speed
          {% elif mode == 1 %}Constant Frequency
          {% elif mode == 3 %}Constant Head
          {% elif mode == 4 %}Constant Pressure
          {% elif mode == 5 %}Const. Diff. Pressure
          {% elif mode == 6 %}Proportional Pressure
          {% elif mode == 7 %}Constant Flow
          {% elif mode == 8 %}Constant Temperature
          {% elif mode == 10 %}Constant Level
          {% elif mode == 128 %}AUTOADAPT
          {% elif mode == 129 %}FLOWADAPT
          {% elif mode == 130 %}Closed-Loop Sensor
          {% elif mode == 131 %}AUTOADAPT(CP)
          {% else %}Unknown ({{ mode }})
          {% endif %}
        icon: mdi:tune
      
      # Operation mode as text
      - name: "MAGNA3 Operation Mode"
        unique_id: magna3_operation_mode_text
        state: >
          {% set mode = states('sensor.magna3_operation_mode_code') | int(0) %}
          {% if mode == 0 %}Auto-Control
          {% elif mode == 4 %}Open Loop Min
          {% elif mode == 6 %}Open Loop Max
          {% else %}Unknown ({{ mode }})
          {% endif %}
        icon: mdi:cog-outline
      
      # Alarm code as text (most common codes)
      - name: "MAGNA3 Alarm Text"
        unique_id: magna3_alarm_text
        state: >
          {% set code = states('sensor.magna3_alarm_code') | int(0) %}
          {% if code == 0 %}No Alarm
          {% elif code == 1 %}Leakage Current
          {% elif code == 2 %}Missing Phase
          {% elif code == 3 %}External Fault
          {% elif code == 4 %}Too Many Restarts
          {% elif code == 32 %}Overvoltage
          {% elif code == 40 %}Undervoltage
          {% elif code == 48 %}Overload
          {% elif code == 49 %}Overcurrent
          {% elif code == 51 %}Blocked Motor
          {% elif code == 57 %}Dry Running
          {% elif code == 64 %}Overtemperature
          {% elif code == 88 %}Sensor Fault
          {% else %}Code {{ code }}
          {% endif %}
        icon: mdi:alert-circle-outline
      
      # Energy cost (adjustable)
      - name: "MAGNA3 Energy Cost"
        unique_id: magna3_energy_cost
        unit_of_measurement: "EUR"
        device_class: monetary
        state_class: total
        state: >
          {{ (states('sensor.magna3_energy_consumption') | float(0) * 0.30) | round(2) }}
        # ↑ Adjust electricity price!
      
      # Calculate efficiency
      - name: "MAGNA3 Efficiency"
        unique_id: magna3_efficiency
        unit_of_measurement: "%"
        state_class: measurement
        state: >
          {% set p_elec = states('sensor.magna3_power_consumption') | float(0) %}
          {% set flow = states('sensor.magna3_volume_flow') | float(0) %}
          {% set head = states('sensor.magna3_head_pressure') | float(0) %}
          {% if p_elec > 0 %}
            {% set p_hydr = (flow * head * 2.725) %}
            {{ ((p_hydr / p_elec) * 100) | round(1) }}
          {% else %}0{% endif %}
        icon: mdi:percent
      
      # Convert setpoint to meters (formula verified 2026-02-11)
      - name: "MAGNA3 Actual Setpoint (m)"
        unique_id: magna3_setpoint_meter
        unit_of_measurement: "m"
        device_class: distance
        state_class: measurement
        state: >
          {% set sp = states('sensor.magna3_user_setpoint') | float(-1) %}
          {% set s_max = states('sensor.magna3_feedback_sensor_max') | float(0) %}
          {% set r_min_pct = states('sensor.magna3_setpoint_range_min') | float(0) %}
          {% set r_max_pct = states('sensor.magna3_setpoint_range_max') | float(0) %}
          {% if sp < 0 or s_max <= 0 or r_max_pct <= r_min_pct %}
            unavailable
          {% else %}
            {% set rmin = (r_min_pct / 100) * s_max %}
            {% set rmax = (r_max_pct / 100) * s_max %}
            {{ ((sp / 100) * (rmax - rmin) + rmin) | round(2) }}
          {% endif %}
        icon: mdi:ruler
      
      - name: "MAGNA3 Pump RTC"
        unique_id: magna3_pump_rtc_formatted
        device_class: timestamp
        state: >
          {{ states('sensor.magna3_pump_unix_rtc') | int(0) | as_datetime }}


      - name: "MAGNA3 Flow Estimation State Text"
        unique_id: magna3_flow_estimation_text
        state: >
          {% set status = states('sensor.magna3_flow_estimation_state') | int(0) %}
          {% if status == 0 %}Within range
          {% elif status == 1 %}Below range
          {% elif status == 2 %}Above range
          {% else %}Unknown ({{ status }})
          {% endif %}
        icon: mdi:chart-bell-curve

        # Control source as text
      - name: "MAGNA3 Control Source"
        unique_id: magna3_control_source_text
        state: >
          {% set source = states('sensor.magna3_control_source_code') | int(0) %}
          {% if source == 1 %}Display
          {% elif source == 2 %}Home Assistant via Modbus/TCP
          {% elif source == 3 %}Grundfos GO App
          {% elif source == 4 %}Digital Input
          {% elif source == 5 %}OFF Button
          {% else %}Unknown ({{ source }})
          {% endif %}
        icon: >
          {% set source = states('sensor.magna3_control_source_code') | int(0) %}
          {% if source == 1 %}mdi:monitor
          {% elif source == 2 %}mdi:ethernet
          {% elif source == 3 %}mdi:cellphone-wireless
          {% elif source == 4 %}mdi:electric-switch
          {% elif source == 5 %}mdi:power-off
          {% else %}mdi:help-circle
          {% endif %}


      - name: "MAGNA3 Months To Bearing Service"
        unique_id: magna3_months_to_bearing_service
        unit_of_measurement: "mon"
        state_class: measurement
        # device_class: (omitted)  # HA has no duration device_class for "months"
        availability: >
          {{ (states('sensor.magna3_bearing_service_raw') | int(0)) | bitwise_and(0xFF) != 255 }}
        state: >
          {{ (states('sensor.magna3_bearing_service_raw') | int(0)) | bitwise_and(0xFF) }}

      - name: "MAGNA3 Bearing Service Type"
        unique_id: magna3_bearing_service_type
        state: >
          {% set v = states('sensor.magna3_bearing_service_raw') | int(0) %}
          {% set t = (v // 256) | bitwise_and(0x01) %}
          {{ 'Lubricate bearings' if t == 0 else 'Change bearings' }}
        # device_class: (omitted)  # Text status
        # state_class: (omitted)   # Text status

      - name: "MAGNA3 Drive State"
        unique_id: magna3_drive_state_text
        state: >
          {% set s = states('sensor.magna3_drive_state_code') | int(-1) %}
          {% if s == 0 %}Stopped
          {% elif s == 1 %}Accelerating
          {% elif s == 2 %}Decelerating
          {% elif s == 3 %}Steady state / closed loop
          {% elif s == 5 %}Accelerating halt
          {% elif s == 6 %}Decelerating halt
          {% elif s == 7 %}Start on the run (flying cut-in)
          {% else %}Code {{ s }}
          {% endif %}
        # device_class: (omitted)  # Text status
        # state_class: (omitted)   # Text status


      # --- Flow sensor natively shows m³/h. E.g. Lambda heat pump uses L/h ---
      # --- This template sensor mirrors the original Modbus sensor in L/h for easier comparison in graphs ---
      - name: "MAGNA3 Flow Rate L/h"
        unique_id: magna3_flow_rate_lh
        unit_of_measurement: "L/h"
        state: "{{ (states('sensor.magna3_volume_flow') | float(0) * 1000) | round(0) }}"
        device_class: volume_flow_rate
        state_class: measurement

# ==============================================================================
# INPUT NUMBERS - UI Controls
# ==============================================================================
input_number:
  magna3_setpoint_percent:
    name: "MAGNA3 Setpoint (%)"
    min: 0
    max: 100
    step: 0.5
    unit_of_measurement: "%"
    icon: mdi:percent
    mode: slider # alternatively "box" mode is possible
  
  magna3_setpoint_m:
    name: "MAGNA3 Setpoint (m)"
    min: 0
    max: 10
    step: 0.1
    unit_of_measurement: "m"
    icon: mdi:ruler
    mode: slider # alternatively "box" mode is possible
  
  magna3_control_mode:
    name: "MAGNA3 Control Mode (Code)"
    min: 0
    max: 131
    step: 1
    icon: mdi:cog
    mode: box
  
  # --- Optional: Set FLOWLIMIT (Register 00106) ---
  # WARNING: Only enable if FLOWADAPT or EnableMaxFlowLimit is used!
  # magna3_max_flow_limit:
  #   name: "MAGNA3 Max Flow Limit"
  #   min: 0
  #   max: 90  # 0-90% of Qmax or 0-9.0 m³/h (depending on pump)
  #   step: 0.1
  #   unit_of_measurement: "m³/h"
  #   # no state_class: measurement, this is a setpoint not a statistic
  #   icon: mdi:water-check
  #   mode: slider
  
  # ============================================================================
  # WARNING: PID PARAMETERS - EXPERTS ONLY!
  # ============================================================================
  # The following registers (00110-00112) control the pump PID controller.
  # Grundfos has optimally set these values at the factory!
  # 
  # RISKS of changing:
  # - Unstable control (pump cycles, oscillates)
  # - Mechanical stress, motor overload
  # - Wrong control direction (00112): CATASTROPHIC malfunction!
  # - Setpoint not reached
  # - Difficult to reverse
  # 
  # ONLY ENABLE if:
  # - Explicitly recommended by Grundfos support
  # - Hydraulics have been significantly changed
  # - Under observation with measuring instruments!
  # ============================================================================
  
  # --- PID parameters (EXPERTS ONLY, commented out!) ---
  # magna3_pid_kp:
  #   name: "MAGNA3 Kp (P-Gain)"
  #   min: 0
  #   max: 10.0
  #   step: 0.1
  #   icon: mdi:sine-wave
  #   mode: box
  #   # Register 00110, Skalierung 0.1
  #   # Default: Pumpen-spezifisch (z.B. 1.5)
  #   # Too high: overshoot, oscillation
  #   # Too low: sluggish control
  
  # magna3_pid_ti:
  #   name: "MAGNA3 Ti (Integral Time)"
  #   min: 0
  #   max: 100.0
  #   step: 0.1
  #   unit_of_measurement: "s"
  #   icon: mdi:timer-outline
  #   mode: box
  #   # Register 00111, Skalierung 0.1 s
  #   # Default: 10-30s (pumpen-spezifisch)
  #   # Too small: fast integration, overshoot
  #   # Too large: slow settling
  
  # magna3_pid_direct:
  #   name: "MAGNA3 Control Direction"
  #   min: 0
  #   max: 1
  #   step: 1
  #   icon: mdi:swap-vertical
  #   mode: box
  #   # Register 00112
  #   # 0 = Inverse (default): Sensor up -> Pump down
  #   # 1 = Direct: Sensor up -> Pump up
  #   # WARNING: Wrong setting = pump controls in reverse!

# ==============================================================================
# SCRIPTS - Pump Control
# ==============================================================================
script:
  # Set setpoint in %
  magna3_set_setpoint_percent:
    alias: "MAGNA3: Set Setpoint (%)"
    fields:
      prozent:
        description: "Setpoint in percent (0-100)"
        example: "45.5"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 103  # Register 00104
          slave: 1
          value: >
            {% if prozent is defined %}
              {{ (prozent | float * 100) | int }}
            {% else %}
              {{ (states('input_number.magna3_setpoint_percent') | float * 100) | int }}
            {% endif %}
  
  magna3_set_setpoint_m:
    alias: "MAGNA3: Set Setpoint (m)"
    fields:
      meter:
        description: "Setpoint in meters (e.g. 4.0)"
        example: "4.0"
    sequence:
      - variables:
          m: "{{ meter | float if meter is defined else states('input_number.magna3_setpoint_m') | float }}"
          s_max: "{{ states('sensor.magna3_feedback_sensor_max') | float(0) }}"
          r_min_pct: "{{ states('sensor.magna3_setpoint_range_min') | float(0) }}"
          r_max_pct: "{{ states('sensor.magna3_setpoint_range_max') | float(0) }}"
      - condition: template
        value_template: "{{ s_max > 0 and r_max_pct > r_min_pct }}"
      - variables:
          rmin: "{{ (r_min_pct / 100) * s_max }}"
          rmax: "{{ (r_max_pct / 100) * s_max }}"
          prozent: "{{ ((m - rmin) / (rmax - rmin)) * 100 }}"
          # Clamp to 0-100% and convert to register value (0-10000)
          reg_value: "{{ [0, [10000, (prozent * 100) | int] | min] | max }}"
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 103  # Register 00104
          slave: 1
          value: "{{ reg_value }}"
  
  # Set control mode
  magna3_set_control_mode:
    alias: "MAGNA3: Set Control Mode"
    fields:
      mode:
        description: "Mode code (6=Prop, 128=AUTO, 129=FLOW)"
        example: "128"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 101  # Register 00102
          slave: 1
          value: >
            {% if mode is defined %}
              {{ mode | int }}
            {% else %}
              {{ states('input_number.magna3_control_mode') | int }}
            {% endif %}
  
  # Remote Start
  magna3_start_remote:
    alias: "MAGNA3: Remote Start"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100  # Register 00101
          slave: 1
          value: 3  # Remote(1) + On(1)

  # Remote Stop
  magna3_stop_remote:
    alias: "MAGNA3: Remote Stop"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 1  # Remote(1) + Off(0)

  # Switch to local (discard bus setpoint, pump reverts to stored EEPROM setpoint)
  magna3_to_local:
    alias: "MAGNA3: Switch to Local"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 0  # Local(0)

  # Switch to local AND copy current bus setpoint into pump EEPROM.
  # Mechanism per Grundfos doc 98367081 (reg 00101 bit 4 "CopyToLocal"):
  # Control Context (mode, op-mode, on/off, setpoint) is copied from remote
  # to local on the Remote->Local transition when bit 4 is set.
  # Two-step variant: arm bit 4 while still in Remote, give the pump a polling
  # window, then perform the Remote->Local transition. Single-write 3 -> 16
  # proved unreliable on real MAGNA3 firmware (the pump did not always see
  # CopyToLocal as active during the same poll cycle as the bit-0 fall).
  magna3_to_local_copy:
    alias: "MAGNA3: Switch to Local (adopt setpoint)"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100  # Register 00101
          slave: 1
          value: 19  # Remote(1) + On(1) + CopyToLocal(1) — arm bit 4 while still in Remote
      - delay:
          milliseconds: 500
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 16  # Local(0) + CopyToLocal(1) — Remote->Local edge triggers EEPROM copy
      - delay: 2
      - action: persistent_notification.create
        data:
          message: "MAGNA3 switched to local — current setpoint adopted"
          title: "MAGNA3"

  # Alarm Reset
  magna3_reset_alarm:
    alias: "MAGNA3: Reset Alarm"
    sequence:
      # Rising Edge: 0 → 1
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 7  # Remote(1) + On(1) + ResetAlarm(1)
      - delay: 2
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 100
          slave: 1
          value: 3  # Back to Remote + On
      - action: persistent_notification.create
        data:
          title: "MAGNA3"
          message: "Alarm reset performed (pump is now under HA control)"

  # Enable AUTOADAPT
  magna3_enable_autoadapt:
    alias: "MAGNA3: Enable AUTOADAPT"
    sequence:
      - action: script.magna3_set_control_mode
        data:
          mode: 128

  # Enable FLOWADAPT
  magna3_enable_flowadapt:
    alias: "MAGNA3: Enable FLOWADAPT"
    sequence:
      - action: script.magna3_set_control_mode
        data:
          mode: 129

  # Enable proportional pressure
  magna3_enable_proportional:
    alias: "MAGNA3: Enable Proportional Pressure"
    sequence:
      - action: script.magna3_set_control_mode
        data:
          mode: 6

  # Enable constant pressure
  magna3_enable_constant_pressure:
    alias: "MAGNA3: Enable Constant Pressure"
    sequence:
      - action: script.magna3_set_control_mode
        data:
          mode: 4
  
  # --- Optional: Set FLOWLIMIT (Register 00106) ---
  # NOTE: This script is currently not called from the UI,
  # as the corresponding input_number is commented out.
  # Call manually with explicit parameter only, e.g.:
  #   action: script.magna3_set_max_flow_limit
  #   data:
  #     limit_m3h: 2.5  # Max. flow rate in m³/h
  magna3_set_max_flow_limit:
    alias: "MAGNA3: Set Max Flow Limit"
    fields:
      limit_m3h:
        description: "Max flow in m3/h (e.g. 2.5)"
        example: "2.5"
    sequence:
      - action: modbus.write_register
        data:
          hub: Grundfos_MAGNA3
          address: 105  # Register 00106
          slave: 1
          value: >
            {% set limit = limit_m3h | float if limit_m3h is defined else states('input_number.magna3_max_flow_limit') | float %}
            {{ (limit * 100) | int }}

  # --- WARNING: PID parameters - EXPERTS ONLY! ---
  # magna3_set_pid_kp:
  #   alias: "MAGNA3: Set Kp (EXPERTS!)"
  #   fields:
  #     kp:
  #       description: "Proportional gain (e.g. 1.5)"
  #       example: "1.5"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 109  # Register 00110
  #         slave: 1
  #         value: >
  #           {% set value = kp | float if kp is defined else states('input_number.magna3_pid_kp') | float %}
  #           {{ (value * 10) | int }}
  
  # magna3_set_pid_ti:
  #   alias: "MAGNA3: Set Ti (EXPERTS!)"
  #   fields:
  #     ti:
  #       description: "Integral time in seconds (e.g. 15.0)"
  #       example: "15.0"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 110  # Register 00111
  #         slave: 1
  #         value: >
  #           {% set value = ti | float if ti is defined else states('input_number.magna3_pid_ti') | float %}
  #           {{ (value * 10) | int }}
  
  # magna3_set_pid_direct:
  #   alias: "MAGNA3: Set Control Direction (DANGEROUS!)"
  #   fields:
  #     direct:
  #       description: "0=Inverse, 1=Direct"
  #       example: "0"
  #   sequence:
  #     - action: modbus.write_register
  #       data:
  #         hub: Grundfos_MAGNA3
  #         address: 111  # Register 00112
  #         slave: 1
  #         value: >
  #           {% set value = direct | int if direct is defined else states('input_number.magna3_pid_direct') | int %}
  #           {{ value }}

# ==============================================================================
# AUTOMATIONS - Examples
# ==============================================================================
automation:
  # ForcedToLocal detector: the pump was forced into local mode by something
  # other than HA (manual operation at the pump display, GO app, etc.).
  # Reg 00201 bit 12.
  - id: magna3_forced_to_local_detected
    alias: "MAGNA3: Pump forced to local"
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_forced_to_local
        to: 'on'
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3"
          message: >
            Pump has been forced into local mode (ForcedToLocal bit set).
            HA control is currently not possible. Likely cause: someone
            interacted with the pump display or the Grundfos GO app.
  
  # Alarm notification
  - id: magna3_alarm_notification
    alias: "MAGNA3: Alarm Notification"
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_alarm
        to: 'on'
    action:
      - action: persistent_notification.create
        data:
          title: "🚨 MAGNA3 Alarm"
          message: >
            Code: {{ states('sensor.magna3_alarm_code') }}
            {{ states('sensor.magna3_alarm_text') }}
  
  # Warning notification (Reg 00201 bit 11, orange LED on the pump)
  - id: magna3_warning_notification
    alias: "MAGNA3: Warning Notification"
    trigger:
      - platform: state
        entity_id: binary_sensor.magna3_warning
        to: 'on'
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3 Warning"
          message: >
            Warning code: {{ states('sensor.magna3_warning_code') }}
            (Pump continues to run, but attention is needed — e.g. sensor
            drift or bearing service due)

  # High current warning
  - id: magna3_high_current
    alias: "MAGNA3: High Current Warning"
    trigger:
      - platform: numeric_state
        entity_id: sensor.magna3_motor_current
        above: 5.0
        for:
          minutes: 5
    action:
      - action: persistent_notification.create
        data:
          title: "⚠️ MAGNA3 Warning"
          message: "Motor current above 5A: {{ states('sensor.magna3_motor_current') }} A"
  
  # Setpoint sync: Input Number -> Modbus. Sends UI values to the pump
  - id: magna3_sync_setpoint_percent
    alias: "MAGNA3: Sync Setpoint %"
    trigger:
      - platform: state
        entity_id: input_number.magna3_setpoint_percent
    action:
      - action: script.magna3_set_setpoint_percent
  
  - id: magna3_sync_setpoint_meter
    alias: "MAGNA3: Sync Setpoint m"
    trigger:
      - platform: state
        entity_id: input_number.magna3_setpoint_m
    action:
      - action: script.magna3_set_setpoint_m

  # After each HA start: wait 30s for Modbus data, then set both sliders to current pump values.
  - id: magna3_sync_slider_on_start
    alias: "MAGNA3: Sync Setpoints on Start"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: 30  # Wait for Modbus sensors to load
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_setpoint_percent
        data:
          value: "{{ states('sensor.magna3_user_setpoint') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_setpoint_m
        data:
          value: "{{ states('sensor.magna3_actual_setpoint_m') | float(0) }}"
        
  # Trigger is pump feedback. User moves slider -> script writes to pump -> pump reports new value -> sliders update
  - id: magna3_sync_both_sliders_from_pump
    alias: "MAGNA3: Update Both Sliders from Pump Value"
    trigger:
      - platform: state
        entity_id: sensor.magna3_user_setpoint
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unavailable', 'unknown'] }}
    action:
      - delay: 2
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_setpoint_percent
        data:
          value: "{{ states('sensor.magna3_user_setpoint') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.magna3_setpoint_m
        data:
          value: "{{ states('sensor.magna3_actual_setpoint_m') | float(0) }}"

