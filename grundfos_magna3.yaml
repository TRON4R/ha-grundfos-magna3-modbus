# ==============================================================================
# GRUNDFOS MAGNA3 - Home Assistant Modbus TCP Integration (v3-enhanced)
# ==============================================================================
# CIM 500 Modbus TCP Configuration
# Documentation: Grundfos 98367081 05.2025
#
# YAML created in 2025 by TRON4R for MAGNA3 integration with Home Assistant
#
# INSTALLATION:
# 1. Copy this file to /config/packages/grundfos-magna3.yaml
# 2. Add to configuration.yaml:
#    homeassistant:
#      packages: !include_dir_named packages
# 3. Adjust IP address below (line 23)
# 4. Restart Home Assistant
#
# CHANGELOG v3-enhanced:
# - Replaced all deprecated service: entries with action:
# - Fixed and added various device classes
# - Added registers 00221 to 00225
# - Added bit 12 to template sensor for register 00201 
# - Various state_class corrections, fixed YAML indentation errors
#
# CHANGELOG v3:
# - Added device classes to all registers (00213-00216, 00210-00211)
# - Added state classes where missing
# - Added register 00106 (SetMaxFlowLimit) (commented out)
# - Added register 00316 (RemotePressure1) (commented out)
# - Added register 00320 (RemoteTemp1) (commented out)
# - Added PID parameters 00110-00112 (commented out with warnings)
# - Detailed PID parameter documentation
# 
# CHANGELOG v2:
# - Added unique IDs (magna3_rXXXXX)
# - Fixed device classes
# - Optimized scan intervals (30-60s instead of 5-10s)
# - Numeric sorting by register address
# - Binary sensors as templates (for bit evaluation)
# - Added missing registers (MaxFlowLimit)
# - Improved descriptions
# ==============================================================================

modbus:
  - name: Grundfos_MAGNA3
    type: tcp
    host: 192.168.2.7  # ← CHANGE: IP address of your CIM 500
    port: 502

    # ==========================================================================
    # SENSORS - Measurements (sorted by register address)
    # ==========================================================================
    sensors:

    # --- Register 00031-00037: Software version and date (RO) --- 
      - name: "MAGNA3 Software Version HI (Raw)"
        unique_id: magna3_r00034_sw_version_hi
        address: 33  # Register 00034
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 86400  # once per day is sufficient

      - name: "MAGNA3 Software Version LO (Raw)"
        unique_id: magna3_r00035_sw_version_lo
        address: 34  # Register 00035
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 86400

      - name: "MAGNA3 Software Date DayMonth (Raw)"
        unique_id: magna3_r00036_sw_date_dm
        address: 35  # Register 00036
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 86400

      - name: "MAGNA3 Software Date Year (Raw)"
        unique_id: magna3_r00037_sw_date_year
        address: 36  # Register 00037
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 86400
    
    # --- Register 00101-00106: Pump Control (display only / all registers in block 00101-00112 are RW!) ---
      
      - name: "MAGNA3 Control Register (00101 Raw)"
        unique_id: magna3_r00101_control_register_raw
        address: 100  # Register 00101
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
        # device_class: (omitted)  # Bitfield
        # state_class: (omitted)   # Bitfield
      
      - name: "MAGNA3 Control Mode Request (00102)"
        unique_id: magna3_r00102_control_mode_req
        address: 101  # Register 00102
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
        # device_class: (omitted)  # Enum/Code
        # state_class: (omitted)   # Enum/Code
      
      - name: "MAGNA3 Operation Mode Request (00103)"
        unique_id: magna3_r00103_operation_mode_req
        address: 102  # Register 00103
        input_type: holding
        data_type: uint16
        slave: 1
        scan_interval: 30
        # device_class: (omitted)  # Enum/Code
        # state_class: (omitted)   # Enum/Code
      
      - name: "MAGNA3 Setpoint Request (00104)"
        unique_id: magna3_r00104_setpoint_req
        address: 103  # Register 00104
        input_type: holding
        data_type: uint16
        unit_of_measurement: "%"
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 30
        # device_class: (omitted)  # Percentage values: no suitable general device_class
        state_class: measurement
      
      # 00105 is "RelayControl" per docs, only for "E-pumps and CUE".
      # For MAGNA3 this is often NOT usable (returns 0 / not present).
      # Included but commented out.
      # - name: "MAGNA3 Relay Control (00105 Raw)"
      #   unique_id: magna3_r00105_relay_control_raw
      #   address: 104  # Register 00105
      #   input_type: holding
      #   data_type: uint16
      #   slave: 1
      #   scan_interval: 30
      #   # device_class: (omitted)  # Bitfield
      #   # state_class: (omitted)   # Bitfield
      
      - name: "MAGNA3 Max Flow Limit Setpoint (00106)"
        unique_id: magna3_r00106_set_max_flow_limit
        address: 105  # Register 00106
        input_type: holding
        data_type: uint16
        unit_of_measurement: "m³/h"
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 30
        device_class: volume_flow_rate
        state_class: measurement
        
      
      # --- Register 00201-00225: Pump Status --- all registers are read-only (RO)
      
      - name: "MAGNA3 Status Bits (Raw)"
        unique_id: magna3_r00201_status_bits
        address: 200  # Register 00201
        input_type: input
        slave: 1
        scan_interval: 30
        # Used for template binary sensors
      
      - name: "MAGNA3 Process Feedback"
        unique_id: magna3_r00202_process_feedback
        address: 201  # Register 00202
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        state_class: measurement
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Control Mode Code"
        unique_id: magna3_r00203_control_mode
        address: 202  # Register 00203
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
        # Rendered as text in template sensor
      
      - name: "MAGNA3 Operation Mode Code"
        unique_id: magna3_r00204_operation_mode
        address: 203  # Register 00204
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Alarm Code"
        unique_id: magna3_r00205_alarm_code
        address: 204  # Register 00205
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Warning Code"
        unique_id: magna3_r00206_warning_code
        address: 205  # Register 00206
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
      
      # --- Register 00207: Bearing service (bitfield)
      - name: "MAGNA3 Bearing Service (Raw)"
        unique_id: magna3_r00207_bearing_service_raw
        address: 206  # Register 00207
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 3600
        # device_class: (omitted)  # Bitfield/status, no suitable HA device_class
        # state_class: (omitted)   # not a measurement in HA terms, raw bitfield
      
# --- Register 00208: DriveState (Enum)
      - name: "MAGNA3 Drive State Code"
        unique_id: magna3_r00208_drive_state
        address: 207  # Register 00208
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
        # device_class: (omitted)  # Status-Code/Enum
        # state_class: (omitted)   # Status-Code/Enum
      
      - name: "MAGNA3 Feedback Sensor Unit"
        unique_id: magna3_r00209_sensor_unit
        address: 208  # Register 00209
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 3600
        # 0=bar, 2=m, 6=m³/h, 10=°C
      
      - name: "MAGNA3 Feedback Sensor Min"
        unique_id: magna3_r00210_sensor_min
        address: 209  # Register 00210
        input_type: input
        data_type: uint16
        # no device_class, as the unit depends on register 209
        # no state_class: measurement, this is a minimum value
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Feedback Sensor Max"
        unique_id: magna3_r00211_sensor_max
        address: 210  # Register 00211
        input_type: input
        data_type: uint16
        # no device_class, as the unit depends on register 209
        # no state_class: measurement, this is a maximum value
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Nominal Frequency"
        unique_id: magna3_r00212_nom_frequency
        address: 211  # Register 00212
        input_type: input
        data_type: uint16
        unit_of_measurement: "Hz"
        device_class: frequency
        # state_class: measurement # not set, not a statistical value
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Min Frequency"
        unique_id: magna3_r00213_min_frequency
        address: 212  # Register 00213
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # state_class: measurement # not set, not a statistical value
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Max Frequency"
        unique_id: magna3_r00214_max_frequency
        address: 213  # Register 00214
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # state_class: measurement # not set, not a statistical value
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Setpoint Range Min"
        unique_id: magna3_r00215_setpoint_range_min
        address: 214  # Register 00215
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # state_class: measurement # not set, not a statistical value
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 3600
      
      - name: "MAGNA3 Setpoint Range Max"
        unique_id: magna3_r00216_setpoint_range_max
        address: 215  # Register 00216
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # state_class: measurement # not set, not a statistical value
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 3600
      
      
      - name: "MAGNA3 Flow Estimation State"
        unique_id: magna3_r00221_flow_estimation_state
        address: 220  # Register 00221
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 15
        # No device_class, status code value
        # 0: Within range, 1: Below range, 2: Above range

      - name: "MAGNA3 Kp Actual"
        unique_id: magna3_r00222_kp_actual
        address: 221  # Register 00222
        input_type: input
        data_type: uint16
        # No device_class, dimensionless factor
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 60
        # icon: mdi:sine-wave # icons not allowed for modbus sensors

      - name: "MAGNA3 Ti Actual"
        unique_id: magna3_r00223_ti_actual
        address: 222  # Register 00223
        input_type: input
        data_type: uint16
        unit_of_measurement: "s"     # Important for duration
        device_class: duration
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 60
        # icon: mdi:timer-outline # icons not allowed for modbus sensors

      - name: "MAGNA3 Direct Control"
        unique_id: magna3_r00224_direct_control_actual
        address: 223  # Register 00224
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 60
        # No device_class, binary status (0/1)
        # 0: Inverse (Standard), 1: Direct

      - name: "MAGNA3 Control Source Code"
        unique_id: magna3_r00225_control_source
        address: 224  # Register 00225
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 30
        # Values: 1=Display, 2=Bus, 3=GO App, 4=Digital Input, 5=OFF Button

      #
      # --- Register 00301-00365: Pump Data (Measurements) --- all registers are read-only (RO)
      
      - name: "MAGNA3 Head Pressure"
        unique_id: magna3_r00301_head
        address: 300  # Register 00301
        input_type: input
        data_type: uint16
        unit_of_measurement: "m"
        device_class: distance
        state_class: measurement
        scale: 0.01  # 0.001 bar × 10.2 ≈ 0.01 m
        precision: 2
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Volume Flow"
        unique_id: magna3_r00302_volume_flow
        address: 301  # Register 00302
        input_type: input
        data_type: uint16
        unit_of_measurement: "m³/h"
        device_class: volume_flow_rate # added, HA now supports volume flow rates
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 15
        # icon: mdi:water-pump # icons not allowed for modbus sensors
      
      - name: "MAGNA3 Relative Performance"
        unique_id: magna3_r00303_relative_performance
        address: 302  # Register 00303
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        # no device_class, HA only supports battery, humidity or power_factor for percentages
        state_class: measurement
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Speed"
        unique_id: magna3_r00304_speed
        address: 303  # Register 00304
        input_type: input
        data_type: uint16
        unit_of_measurement: "rpm"
        # device_class: frequency # frequency is wrong here. HA has no device_class for RPM, better none than a wrong one
        state_class: measurement
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Frequency"
        unique_id: magna3_r00305_frequency
        address: 304  # Register 00305
        input_type: input
        data_type: uint16
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Digital Input"
        unique_id: magna3_r00306_digital_input
        address: 305  # Register 00306
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 60
        # Bitfield: DI1-DI3
      
      - name: "MAGNA3 Digital Output"
        unique_id: magna3_r00307_digital_output
        address: 306  # Register 00307
        input_type: input
        data_type: uint16
        slave: 1
        scan_interval: 60
        # Bitfield: DO1-DO2
      
      - name: "MAGNA3 Actual Setpoint"
        unique_id: magna3_r00308_actual_setpoint
        address: 307  # Register 00308
        input_type: input
        data_type: uint16
        unit_of_measurement: "%"
        state_class: measurement
        scale: 0.01
        precision: 1
        slave: 1
        scan_interval: 15
        # icon: mdi:speedometer # icons not allowed for modbus sensors
      
      - name: "MAGNA3 Motor Current"
        unique_id: magna3_r00309_motor_current
        address: 308  # Register 00309
        input_type: input
        data_type: uint16
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 DC Link Voltage"
        unique_id: magna3_r00310_dc_link_voltage
        address: 309  # Register 00310
        input_type: input
        data_type: uint16
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        scale: 0.1
        precision: 1
        slave: 1
        scan_interval: 30
      
      - name: "MAGNA3 Power Consumption"
        unique_id: magna3_r00312_power
        address: 311  # Register 00312-00313 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Electronic Temp"
        unique_id: magna3_r00321_electronic_temp
        address: 320  # Register 00321
        input_type: input
        data_type: uint16
        unit_of_measurement: "K"  # Grundfos delivers raw Kelvin values; HA converts automatically to C/F via device_class
        device_class: temperature
        state_class: measurement
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Pump Liquid Temp"
        unique_id: magna3_r00322_pump_liquid_temp
        address: 321  # Register 00322
        input_type: input
        data_type: uint16
        unit_of_measurement: "K"  # Grundfos delivers raw Kelvin values; HA converts automatically to C/F via device_class
        device_class: temperature
        state_class: measurement
        scale: 0.01
        precision: 2
        slave: 1
        scan_interval: 15
      
      - name: "MAGNA3 Specific Energy Consumption"
        unique_id: magna3_r00326_specific_energy
        address: 325  # Register 00326
        input_type: input
        data_type: uint16
        unit_of_measurement: "Wh/m³"
        state_class: measurement
        slave: 1
        scan_interval: 300
      
      - name: "MAGNA3 Operation Time"
        unique_id: magna3_r00327_operation_time
        address: 326  # Register 00327-00328 (32-bit)
        input_type: input
        data_type: uint32
        unit_of_measurement: "h"
        # device_class: duration # not compatible with state_class: total_increasing per HA docs
        state_class: total_increasing
        slave: 1
        scan_interval: 300

      - name: "MAGNA3 Total Powered Time"
        unique_id: magna3_r00329_total_powered_time
        address: 328  # Register 00329-00330 (32-bit)
        input_type: input
