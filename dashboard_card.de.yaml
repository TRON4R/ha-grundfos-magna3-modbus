type: custom:vertical-stack-in-card
cards:
  - type: heading
    heading: Grundfos MAGNA3 Heizkreispumpe
    heading_style: title
    icon: mdi:pump
    badges:
      - type: entity
        entity: sensor.magna3_regelungsart
    uix:
      style: |
        ha-icon {
          color: red !important;
        }
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.magna3_forderhohe
        name: Förderhöhe
        unit: m
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 6
          red: 8
        needle: true
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_leistungsaufnahme
        name: Leistung
        unit: W
        min: 0
        max: 153
        needle: true
        severity:
          green: 0
          yellow: 80
          red: 120
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_drehzahl
        name: Drehzahl
        unit: rpm
        min: 0
        max: 4530
        severity:
          green: 0
          yellow: 3000
          red: 4000
        needle: true
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.magna3_durchfluss_l_h
        name: Durchfluss
        unit: L/h
        min: 0
        max: 5500
        severity:
          green: 0
          yellow: 3000
          red: 4000
        needle: true
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_sollwert_aktuell
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
        needle: true
        name: Soll Regelung
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_medientemperatur
        unit: °C
        min: 0
        max: 65
        severity:
          green: 0
          yellow: 50
          red: 60
        needle: true
        name: Wassertemperatur
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Durchfluss ⇧
        secondary: Schätzung {{ states(entity) }}
        multiline_secondary: true
        icon: mdi:chart-bell-curve
        entity: sensor.magna3_durchfluss_status_text
        tap_action:
          action: more-info
        color: |
          {% if is_state(entity, 'im Messbereich') %}
            green
          {% else %}
            amber
          {% endif %}
        features_position: bottom
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_sollwert_benutzer
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
        needle: true
        name: Sollwert Benutzer
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_sollwert_meter
        unit: m
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 6
          red: 8
        needle: true
        name: Sollwert Benutzer
        uix:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: entities
    title: Einstellungen
    entities:
      - entity: input_number.magna3_sollwert_prozent
        name: Sollwert (%)
        uix:
          style: |
            :host {
              {% if not is_state('binary_sensor.magna3_remote_modus', 'on') %}
              opacity: 0.4;
              pointer-events: none;
              {% endif %}
            }
      - entity: input_number.magna3_sollwert_meter
        name: Sollwert (m)
        uix:
          style: |
            :host {
              {% if not is_state('binary_sensor.magna3_remote_modus', 'on') %}
              opacity: 0.4;
              pointer-events: none;
              {% endif %}
            }
      - entity: sensor.magna3_steuerquelle
      - entity: binary_sensor.magna3_remote_modus
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: HA-Steuerung starten
        icon: mdi:play
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_start_remote
        tooltip:
          content: >-
            HA übernimmt die Steuerung per Modbus. Pumpe läuft mit ihrer aktuellen
            Regelungsart und ihrem Sollwert weiter (bzw. wird gestartet).
            Die Sollwert-Slider und Buttons im Dashboard steuern jetzt die MAGNA3.
            Vorher sind Slider und Regelungsart-Buttons ausgegraut.
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        styles:
          card:
            - padding: 6px
            - height: 110px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.7)
      - type: custom:button-card
        name: |-
          Einstellungen sichern &
          HA-Steuerung beenden
        icon: mdi:content-save-move
        show_name: true
        show_icon: true
        color: "#44739E"
        triggers_update:
          - binary_sensor.magna3_remote_modus
        tap_action:
          action: perform-action
          perform_action: script.magna3_to_local_copy
        tooltip:
          content: >-
            Überträgt die aktuellen Einstellungen (Regelungsart, Sollwert,
            Betriebsmodus) dauerhaft in die Pumpe und gibt die Steuerung an das
            Pumpen-Display zurück. Die Pumpe wird dabei eingeschaltet (auch wenn
            sie vorher per HA gestoppt war). Nach Änderungen via HA verwenden,
            damit sie einen Stromausfall überleben. Nur unter HA-Steuerung bedienbar.
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        styles:
          card:
            # 4 statt 6 px: Bei 1920 px Fensterbreite passt "Einstellungen sichern &" so in eine Zeile
            - padding: 4px
            - height: 110px
            - opacity: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? '1' : '0.4' ]]]"
            - pointer-events: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? 'auto' : 'none' ]]]"
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
      - type: custom:button-card
        name: HA-Steuerung beenden
        icon: mdi:hand-back-right
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_to_local
        tooltip:
          content: >-
            Gibt die Steuerung an die Pumpe zurück. Der aktuelle Bus-Sollwert
            wird VERWORFEN — die Pumpe nutzt den letzten gespeicherten (EEPROM) Sollwert.
            Zum Abbrechen einer HA-Session ohne Speicherung.
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        styles:
          card:
            - padding: 6px
            - height: 110px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: |-
          Pumpe stoppen
          (HA-Steuerung bleibt)
        icon: mdi:stop
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_stop_remote
        tooltip:
          content: >-
            Pumpe schaltet aus, HA behält aber die Steuerung via Modbus.
            Wiederanlauf mit „HA-Steuerung starten".
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.7)
      - type: custom:button-card
        # Weiches Trennzeichen (\u00AD): Am Handy bricht der Name als "Proportional-" / "druck" um, statt abgeschnitten zu werden
        name: "Proportional\u00ADdruck"
        icon: mdi:function-variant
        show_name: true
        show_icon: true
        color: "#44739E"
        triggers_update:
          - binary_sensor.magna3_remote_modus
          - sensor.magna3_regelungsart_code
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_proportional
        tooltip:
          content: >-
            Pumpe regelt die Förderhöhe proportional zum Volumenstrom.
            Druck sinkt bei wenig Durchfluss (spart Energie) und steigt bei viel Durchfluss.
            Standard für Heizkörper mit Thermostatventilen.
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        # Aktive Regelungsart laut Pumpe (Reg 00203) hervorheben: getoenter Hintergrund und Rahmen (keine fette Schrift: wird am Handy zu breit)
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
            - opacity: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? '1' : '0.4' ]]]"
            - pointer-events: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? 'auto' : 'none' ]]]"
            - background-color: "[[[ return states['sensor.magna3_regelungsart_code']?.state === '6' ? 'rgba(68, 115, 158, 0.2)' : 'var(--ha-card-background, var(--card-background-color, white))' ]]]"
            - box-shadow: "[[[ return states['sensor.magna3_regelungsart_code']?.state === '6' ? 'inset 0 0 0 2px #44739E' : 'var(--ha-card-box-shadow, none)' ]]]"
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
      - type: custom:button-card
        # Weiches Trennzeichen (­): Bei sehr schmalen Displays "Konstant-" / "druck" statt abgeschnitten
        name: "Konstant­druck"
        icon: mdi:approximately-equal
        show_name: true
        show_icon: true
        color: "#44739E"
        triggers_update:
          - binary_sensor.magna3_remote_modus
          - sensor.magna3_regelungsart_code
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_constant_pressure
        tooltip:
          content: >-
            Pumpe hält eine konstante Förderhöhe unabhängig vom Volumenstrom.
            Standard für Fußbodenheizungen oder Systeme mit festem Druck-Sollwert.
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        # Aktive Regelungsart laut Pumpe (Reg 00203) hervorheben: getoenter Hintergrund und Rahmen (keine fette Schrift: wird am Handy zu breit)
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
            - opacity: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? '1' : '0.4' ]]]"
            - pointer-events: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? 'auto' : 'none' ]]]"
            - background-color: "[[[ return states['sensor.magna3_regelungsart_code']?.state === '4' ? 'rgba(68, 115, 158, 0.2)' : 'var(--ha-card-background, var(--card-background-color, white))' ]]]"
            - box-shadow: "[[[ return states['sensor.magna3_regelungsart_code']?.state === '4' ? 'inset 0 0 0 2px #44739E' : 'var(--ha-card-box-shadow, none)' ]]]"
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: AutoAdapt
        icon: mdi:auto-fix
        show_name: true
        show_icon: true
        color: "#44739E"
        triggers_update:
          - binary_sensor.magna3_remote_modus
          - sensor.magna3_regelungsart_code
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_autoadapt
        tooltip:
          content: >-
            Pumpe lernt die Hydraulik des Systems und passt sich automatisch an.
            Werkseinstellung. Im Zweifel die beste Wahl.
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        # Aktive Regelungsart laut Pumpe (Reg 00203) hervorheben: getoenter Hintergrund und Rahmen (keine fette Schrift: wird am Handy zu breit)
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
            - opacity: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? '1' : '0.4' ]]]"
            - pointer-events: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? 'auto' : 'none' ]]]"
            - background-color: "[[[ return states['sensor.magna3_regelungsart_code']?.state === '128' ? 'rgba(68, 115, 158, 0.2)' : 'var(--ha-card-background, var(--card-background-color, white))' ]]]"
            - box-shadow: "[[[ return states['sensor.magna3_regelungsart_code']?.state === '128' ? 'inset 0 0 0 2px #44739E' : 'var(--ha-card-box-shadow, none)' ]]]"
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.5)
      - type: custom:button-card
        name: FlowAdapt
        icon: mdi:waves
        show_name: true
        show_icon: true
        color: "#44739E"
        triggers_update:
          - binary_sensor.magna3_remote_modus
          - sensor.magna3_regelungsart_code
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_flowadapt
        tooltip:
          content: >-
            Kombiniert AutoAdapt mit Max-Volumenstrom-Begrenzung (FLOWLIMIT).
            Aktivieren, wenn der Volumenstrom begrenzt werden soll (z.B. wegen Geräuschen oder Verschleiß).
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        # Aktive Regelungsart laut Pumpe (Reg 00203) hervorheben: getoenter Hintergrund und Rahmen (keine fette Schrift: wird am Handy zu breit)
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
            - opacity: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? '1' : '0.4' ]]]"
            - pointer-events: "[[[ return states['binary_sensor.magna3_remote_modus']?.state === 'on' ? 'auto' : 'none' ]]]"
            - background-color: "[[[ return states['sensor.magna3_regelungsart_code']?.state === '129' ? 'rgba(68, 115, 158, 0.2)' : 'var(--ha-card-background, var(--card-background-color, white))' ]]]"
            - box-shadow: "[[[ return states['sensor.magna3_regelungsart_code']?.state === '129' ? 'inset 0 0 0 2px #44739E' : 'var(--ha-card-box-shadow, none)' ]]]"
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.5)
      - type: custom:button-card
        name: Alarm zurücksetzen
        icon: mdi:alert-circle-check
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_reset_alarm
        tooltip:
          content: >-
            Setzt aktive Pumpen-Alarme zurück (durch einen Rising-Edge-Trigger auf Reg 00101 Bit 2).
            Nebeneffekt: schaltet die Pumpe in HA-Steuerung und ein.
            Erst nach Behebung der Fehlerursache anwenden.
          placement: bottom
          arrow: true
        # Fester Rahmen (vertical-stack-in-card entfernt ihn sonst je nach Ladezeitpunkt).
        # Schmale Karte (z. B. Handy): kleineres Icon und Schrift, damit Icon und Text in 110 px passen
        extra_styles: |
          ha-card { container-type: inline-size; border: 1px solid var(--ha-card-border-color, var(--divider-color)) !important; }
          @container (max-width: 130px) {
            #icon { width: 28px !important; height: 28px !important; --mdc-icon-size: 28px !important; }
            #name { font-size: 12px !important; }
          }
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
uix:
  style: |
    ha-card > :first-child {
      padding-top: 12px;
    }
