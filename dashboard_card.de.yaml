type: custom:vertical-stack-in-card
cards:
  - type: heading
    heading: Grundfos MAGNA3 Heizkreispumpe
    heading_style: title
    icon: mdi:pump
    badges:
      - type: entity
        entity: sensor.magna3_regelungsart
    card_mod:
      style: |
        ha-icon {
          color: red !important;
        }
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.magna3_forderhohe
        name: Förderhöhe
        unit: m
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 6
          red: 8
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_leistungsaufnahme
        name: Leistung
        unit: W
        min: 0
        max: 153
        needle: true
        severity:
          green: 0
          yellow: 80
          red: 120
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_drehzahl
        name: Drehzahl
        unit: rpm
        min: 0
        max: 4530
        severity:
          green: 0
          yellow: 3000
          red: 4000
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.magna3_durchfluss_l_h
        name: Durchfluss
        unit: L/h
        min: 0
        max: 5500
        severity:
          green: 0
          yellow: 3000
          red: 4000
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_sollwert_aktuell
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
        needle: true
        name: Soll Regelung
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_medientemperatur
        unit: °C
        min: 0
        max: 65
        severity:
          green: 0
          yellow: 50
          red: 60
        needle: true
        name: Wassertemperatur
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Durchfluss ⇧
        secondary: Schätzung {{ states(entity) }}
        multiline_secondary: true
        icon: mdi:chart-bell-curve
        entity: sensor.magna3_durchfluss_status_text
        tap_action:
          action: more-info
        color: |
          {% if is_state(entity, 'im Messbereich') %}
            green
          {% else %}
            amber
          {% endif %}
        features_position: bottom
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_sollwert_benutzer
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
        needle: true
        name: Sollwert Benutzer
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_sollwert_meter
        unit: m
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 6
          red: 8
        needle: true
        name: Sollwert Benutzer
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: entities
    title: Einstellungen
    entities:
      - entity: input_number.magna3_sollwert_prozent
        name: Sollwert (%)
      - entity: input_number.magna3_sollwert_meter
        name: Sollwert (m)
      - entity: sensor.magna3_steuerquelle
      - entity: binary_sensor.magna3_remote_modus
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: HA-Steuerung starten
        icon: mdi:play
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_start_remote
        tooltip:
          content: >-
            HA übernimmt die Steuerung per Modbus. Pumpe läuft weiter (bzw. wird gestartet).
            Die Sollwert-Slider und Buttons im Dashboard steuern jetzt die MAGNA3.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.7)
      - type: custom:button-card
        name: |-
          Einstellungen sichern &
          HA-Steuerung beenden
        icon: mdi:content-save-move
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_to_local_copy
        tooltip:
          content: >-
            Gibt die Steuerung an die Pumpe zurück und speichert Sollwert,
            Regelungsart und On/Off-Zustand im Pumpen-EEPROM.
            Nach Änderungen via HA verwenden, damit sie einen Stromausfall überleben.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
      - type: custom:button-card
        name: HA-Steuerung beenden
        icon: mdi:hand-back-right
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_to_local
        tooltip:
          content: >-
            Gibt die Steuerung an die Pumpe zurück. Der aktuelle Bus-Sollwert
            wird VERWORFEN — die Pumpe nutzt den letzten gespeicherten (EEPROM) Sollwert.
            Zum Abbrechen einer HA-Session ohne Speicherung.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: |-
          Pumpe stoppen
          (HA-Steuerung bleibt)
        icon: mdi:stop
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_stop_remote
        tooltip:
          content: >-
            Pumpe schaltet aus, HA behält aber die Steuerung via Modbus.
            Wiederanlauf mit „HA-Steuerung starten".
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.7)
      - type: custom:button-card
        name: Proportionaldruck
        icon: mdi:function-variant
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_proportional
        tooltip:
          content: >-
            Pumpe regelt die Förderhöhe proportional zum Volumenstrom.
            Druck sinkt bei wenig Durchfluss (spart Energie) und steigt bei viel Durchfluss.
            Standard für Heizkörper mit Thermostatventilen.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
      - type: custom:button-card
        name: Konstantdruck
        icon: mdi:approximately-equal
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_constant_pressure
        tooltip:
          content: >-
            Pumpe hält eine konstante Förderhöhe unabhängig vom Volumenstrom.
            Standard für Fußbodenheizungen oder Systeme mit festem Druck-Setpoint.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: AutoAdapt
        icon: mdi:auto-fix
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_autoadapt
        tooltip:
          content: >-
            Pumpe lernt die Hydraulik des Systems und passt sich automatisch an.
            Werkseinstellung. Im Zweifel die beste Wahl.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.5)
      - type: custom:button-card
        name: FlowAdapt
        icon: mdi:waves
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_flowadapt
        tooltip:
          content: >-
            Kombiniert AutoAdapt mit Max-Volumenstrom-Begrenzung (FLOWLIMIT).
            Aktivieren, wenn der Volumenstrom begrenzt werden soll (z.B. wegen Geräuschen oder Verschleiß).
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.5)
      - type: custom:button-card
        name: Alarm zurücksetzen
        icon: mdi:alert-circle-check
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_reset_alarm
        tooltip:
          content: >-
            Setzt aktive Pumpen-Alarme zurück (durch einen Rising-Edge-Trigger auf Reg 00101 Bit 2).
            Nebeneffekt: schaltet die Pumpe in HA-Steuerung.
            Erst nach Behebung der Fehlerursache anwenden.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
card_mod:
  style: |
    ha-card > :first-child {
      padding-top: 12px;
    }
