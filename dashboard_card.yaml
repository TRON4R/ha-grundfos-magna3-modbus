type: custom:vertical-stack-in-card
cards:
  - type: heading
    heading: Grundfos MAGNA3 Circulation Pump
    heading_style: title
    icon: mdi:pump
    badges:
      - type: entity
        entity: sensor.magna3_control_mode
    card_mod:
      style: |
        ha-icon {
          color: red !important;
        }
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.magna3_head_pressure
        name: Head Pressure
        unit: m
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 6
          red: 8
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_power_consumption
        name: Power
        unit: W
        min: 0
        max: 153
        needle: true
        severity:
          green: 0
          yellow: 80
          red: 120
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_speed
        name: Speed
        unit: rpm
        min: 0
        max: 4530
        severity:
          green: 0
          yellow: 3000
          red: 4000
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.magna3_flow_rate_l_h
        name: Flow Rate
        unit: L/h
        min: 0
        max: 5500
        severity:
          green: 0
          yellow: 3000
          red: 4000
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_actual_setpoint
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
        needle: true
        name: Actual Setpoint
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_pump_liquid_temp
        unit: °C
        min: 0
        max: 65
        severity:
          green: 0
          yellow: 50
          red: 60
        needle: true
        name: Liquid Temp
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Flow Estimation ⇧
        secondary: Estimate {{ states(entity) }}
        multiline_secondary: true
        icon: mdi:chart-bell-curve
        entity: sensor.magna3_flow_estimation_state_text
        tap_action:
          action: more-info
        color: |
          {% if is_state(entity, 'Within range') %}
            green
          {% else %}
            amber
          {% endif %}
        features_position: bottom
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_user_setpoint
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
        needle: true
        name: User Setpoint
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_actual_setpoint_m
        unit: m
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 6
          red: 8
        needle: true
        name: User Setpoint
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: entities
    title: Settings
    entities:
      - entity: input_number.magna3_setpoint_percent
        name: Setpoint (%)
      - entity: input_number.magna3_setpoint_m
        name: Setpoint (m)
      - entity: sensor.magna3_control_source
      - entity: binary_sensor.magna3_remote_mode
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: Start HA Control
        icon: mdi:play
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_start_remote
        tooltip:
          content: >-
            HA takes over via Modbus. Pump runs (or starts).
            Setpoint slider in HA now controls the pump.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.7)
      - type: custom:button-card
        name: |-
          Save Settings &
          End HA Control
        icon: mdi:content-save-move
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_to_local_copy
        tooltip:
          content: >-
            Hands control back to the pump and stores the current setpoint,
            control mode, and on/off state in the pump's EEPROM.
            Use after changing settings via HA so they survive a power cycle.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
      - type: custom:button-card
        name: End HA Control
        icon: mdi:hand-back-right
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_to_local
        tooltip:
          content: >-
            Hands control back to the pump. The current bus setpoint is
            DISCARDED — the pump reverts to its last saved (EEPROM) setpoint.
            Use to abort an HA session without persisting changes.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: |-
          Stop Pump
          (keep HA Control)
        icon: mdi:stop
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_stop_remote
        tooltip:
          content: >-
            Pump turns off, but HA stays in control via Modbus.
            Resume operation with "Start HA Control".
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.7)
      - type: custom:button-card
        name: Proportional Pressure
        icon: mdi:function-variant
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_proportional
        tooltip:
          content: >-
            Pump adjusts head proportionally to flow demand.
            Pressure drops at low flow (saves energy) and rises at high flow.
            Standard for radiator heating with thermostatic valves.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
      - type: custom:button-card
        name: Constant Pressure
        icon: mdi:approximately-equal
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_constant_pressure
        tooltip:
          content: >-
            Pump maintains a constant differential head regardless of flow.
            Standard for underfloor heating or systems requiring a stable pressure setpoint.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: AutoAdapt
        icon: mdi:auto-fix
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_autoadapt
        tooltip:
          content: >-
            Pump learns the system's hydraulics over time and adapts automatically.
            Factory default. Best choice when in doubt.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.5)
      - type: custom:button-card
        name: FlowAdapt
        icon: mdi:waves
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_flowadapt
        tooltip:
          content: >-
            Combines AutoAdapt with a maximum flow limit (FLOWLIMIT).
            Use when flow must be capped to avoid noise or wear.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.5)
      - type: custom:button-card
        name: Reset Alarm
        icon: mdi:alert-circle-check
        show_name: true
        show_icon: true
        color: "#44739E"
        tap_action:
          action: perform-action
          perform_action: script.magna3_reset_alarm
        tooltip:
          content: >-
            Clears active pump alarms (rising-edge trigger on Reg 00101 bit 2).
            Side effect: switches the pump into HA control.
            Use only after fixing the underlying fault.
          placement: bottom
          arrow: true
        styles:
          card:
            - padding: 6px
            - height: 110px
            - margin-top: 8px
          grid:
            - grid-template-areas: '"i" "n"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr auto
            - row-gap: 2px
          name:
            - white-space: pre-line
            - font-size: var(--paper-font-body1_-_font-size, 14px)
            - line-height: 1.15
          img_cell:
            - align-self: end
            - justify-self: center
            - overflow: visible
          icon:
            - width: 48px
            - height: 48px
            - "--mdc-icon-size": 48px
            - transform: scale(1.3)
card_mod:
  style: |
    ha-card > :first-child {
      padding-top: 12px;
    }
