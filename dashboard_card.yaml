type: custom:vertical-stack-in-card
cards:
  - type: heading
    heading: Grundfos MAGNA3 Circulation Pump
    heading_style: title
    icon: mdi:pump
    badges:
      - type: entity
        entity: sensor.magna3_control_mode
    card_mod:
      style: |
        ha-icon {
          color: red !important;
        }
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.magna3_head_pressure
        name: Head Pressure
        unit: m
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 6
          red: 8
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_power_consumption
        name: Power
        unit: W
        min: 0
        max: 153
        needle: true
        severity:
          green: 0
          yellow: 80
          red: 120
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_speed
        name: Speed
        unit: rpm
        min: 0
        max: 4530
        severity:
          green: 0
          yellow: 3000
          red: 4000
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.magna3_flow_rate_l_h
        name: Flow Rate
        unit: L/h
        min: 0
        max: 5500
        severity:
          green: 0
          yellow: 3000
          red: 4000
        needle: true
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_actual_setpoint
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
        needle: true
        name: Actual Setpoint
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_pump_liquid_temp
        unit: °C
        min: 0
        max: 65
        severity:
          green: 0
          yellow: 50
          red: 60
        needle: true
        name: Liquid Temp
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Flow Estimation ⇧
        secondary: Estimate {{ states(entity) }}
        multiline_secondary: true
        icon: mdi:chart-bell-curve
        entity: sensor.magna3_flow_estimation_state_text
        tap_action:
          action: more-info
        color: |
          {% if is_state(entity, 'Within range') %}
            green
          {% else %}
            amber
          {% endif %}
        features_position: bottom
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_user_setpoint
        unit: "%"
        min: 0
        max: 100
        severity:
          green: 0
          yellow: 80
          red: 90
        needle: true
        name: User Setpoint
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
      - type: gauge
        entity: sensor.magna3_actual_setpoint_m
        unit: m
        min: 0
        max: 10
        severity:
          green: 0
          yellow: 6
          red: 8
        needle: true
        name: User Setpoint
        card_mod:
          style: |
            ha-card {
              border: none !important;
              box-shadow: none !important;
            }
  - type: entities
    title: Settings
    entities:
      - entity: input_number.magna3_setpoint_percent
        name: Setpoint (%)
      - entity: input_number.magna3_setpoint_m
        name: Setpoint (m)
      - entity: sensor.magna3_control_source
      - entity: binary_sensor.magna3_remote_mode
  - type: horizontal-stack
    cards:
      - show_name: true
        show_icon: true
        type: button
        name: Remote Start
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: script.magna3_start_remote
        card_mod:
          style: |
            ha-card {
              margin-bottom: 10px;
            }
      - show_name: true
        show_icon: true
        type: button
        name: → Local
        icon: mdi:hand-back-right
        tap_action:
          action: perform-action
          perform_action: script.magna3_to_local
        card_mod:
          style: |
            ha-card {
              margin-bottom: 10px;
            }
      - type: button
        name: Remote Stop
        icon: mdi:stop
        tap_action:
          action: perform-action
          perform_action: script.magna3_stop_remote
        card_mod:
          style: |
            ha-card {
              margin-bottom: 10px;
            }
  - type: markdown
    content: " "
    card_mod:
      style: |
        ha-card {
          border: none !important;
          box-shadow: none !important;
          background: none !important;
          padding: 4px 0 !important;
          margin: 0 !important;
          min-height: 0 !important;
          overflow: hidden;
        }
        ha-markdown {
          padding: 0 !important;
        }
  - type: horizontal-stack
    cards:
      - show_name: true
        show_icon: true
        type: button
        name: Proportional Pressure
        icon: mdi:gauge
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_proportional
      - show_name: true
        show_icon: true
        type: button
        name: AutoAdapt
        icon: mdi:auto-fix
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_autoadapt
      - type: button
        name: FlowAdapt
        icon: mdi:waves
        tap_action:
          action: perform-action
          perform_action: script.magna3_enable_flowadapt
card_mod:
  style: |
    ha-card > :first-child {
      padding-top: 12px;
    }
